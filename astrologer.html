<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sathyadarshana | Astrology</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" class="home-btn">Home</a>
    <h1>Sathyadarshana Astrology</h1>
  </nav>

  <section class="form-section">
    <h2>Generate Birth Report</h2>
    <form id="birthForm">
      <label>Name:</label>
      <input type="text" id="name" required />

      <label>Gender:</label>
      <select id="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label>Date of Birth:</label>
      <input type="date" id="dob" required />

      <label>Time of Birth:</label>
      <input type="time" id="tob" required />

      <label>Place of Birth:</label>
      <input type="text" id="pob" required />

      <label>Mode:</label>
      <select id="mode">
        <option value="KP">KP</option>
        <option value="Vedic">Vedic</option>
      </select>

      <button type="submit">Generate Report</button>
    </form>
  </section>

  <section id="report-output">
    <h3>Report Output</h3>
    <pre id="reportData">No report generated yet.</pre>
  </section>

  <script>
    document.getElementById("birthForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const gender = document.getElementById("gender").value;
      const dob = document.getElementById("dob").value;
      const tob = document.getElementById("tob").value;
      const pob = document.getElementById("pob").value;
      const mode = document.getElementById("mode").value;

      const response = await fetch("/.netlify/functions/generateReport", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, gender, dob, tob, pob, mode }),
      });
      const result = await response.json();
      document.getElementById("reportData").innerText = JSON.stringify(result, null, 2);
    });
  </script>
</body>
</html>
