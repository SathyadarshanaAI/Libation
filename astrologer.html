<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana Astrology</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#0f172a; color:#e0f2fe; scroll-behavior:smooth; }
    section { 
      min-height:100vh; 
      max-width:800px; 
      margin:2rem auto; 
      padding:1.5rem; 
      background:rgba(30,41,59,0.6); 
      border-radius:1rem; 
      backdrop-filter: blur(10px);
      box-shadow:0 0 25px rgba(56,189,248,0.3);
    }
    nav { 
      position:sticky; 
      top:0; 
      display:flex; 
      gap:1rem; 
      justify-content:center; 
      background:rgba(2,6,23,0.5); 
      padding:1rem; 
      backdrop-filter: blur(8px);
      box-shadow:0 0 12px rgba(56,189,248,0.5);
    }
    nav a { 
      color:#e0f2fe; 
      background:rgba(14,165,233,0.8); 
      padding:0.5rem 1rem; 
      border-radius:0.5rem; 
      text-decoration:none;
      transition:0.3s;
    }
    nav a:hover { background:#38bdf8; transform:scale(1.05);}
    button { 
      background:#16f0a7; 
      border:none; 
      padding:0.7rem 1rem; 
      border-radius:0.5rem; 
      margin:0.5rem; 
      cursor:pointer; 
      transition:0.3s;
    }
    button:hover { background:#0ea5e9; color:#fff; transform:scale(1.05); }

    /* Floating neon-glass language button */
    #lang-btn {
      position:fixed;
      bottom:20px;
      right:20px;
      background:rgba(14,165,233,0.8);
      color:white;
      border:none;
      border-radius:50%;
      width:60px;
      height:60px;
      font-size:18px;
      cursor:pointer;
      box-shadow:0 0 20px #38bdf8;
      backdrop-filter:blur(10px);
      transition:transform 0.3s;
      z-index:1000;
    }
    #lang-btn:hover { transform:scale(1.2);}
  </style>
</head>
<body>
  <nav>
    <a href="/index.html">Home</a>
    <a href="#report">Report</a>
    <a href="#palmistry">Palmistry</a>
    <a href="#numerology">Numerology</a>
    <a href="#geo">GeoVision</a>
    <a href="#tariff">Tariff</a>
  </nav>

  <section id="report">
    <h1>KP Live Report</h1>
    <input type="text" id="name" placeholder="Full Name">
    <input type="date" id="dob">
    <input type="time" id="tob">
    <input type="text" id="pob" placeholder="Birth Place">
    <button onclick="generatePDF()">Download KP PDF</button>
  </section>

  <section id="palmistry"><h1>Palmistry</h1><p>Coming soon.</p></section>
  <section id="numerology"><h1>Numerology</h1><p>Coming soon.</p></section>
  <section id="geo"><h1>GeoVision</h1><p>Coming soon.</p></section>

  <section id="tariff">
    <h1>Tariff & Packages</h1>
    <p><b>Standard Report:</b> $5</p>
    <p><b>Premium Reading:</b> $10</p>
    <p><b>Lifetime Service (1 year):</b> $30</p>
    <p><i>Student Mode available (Free or Pay-What-You-Can)</i></p>
  </section>

  <!-- Hidden Google Translate container -->
  <div id="google_translate_element"></div>
  <button id="lang-btn">🌐</button>

  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,si,ta',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }

    // Toggle language menu on button click
    document.getElementById('lang-btn').addEventListener('click', () => {
      const gadget = document.querySelector('.goog-te-gadget-simple');
      if (gadget) {
        gadget.click();
      } else {
        alert("Language menu not loaded yet. Wait a moment and try again.");
      }
    });

    async function generatePDF() {
      const res = await fetch("/api/generateReport", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          birthDate: document.getElementById("dob").value,
          birthTime: document.getElementById("tob").value,
          birthPlace: document.getElementById("pob").value
        })
      });
      if (!res.ok) { alert("Report failed"); return; }
      const blob = await res.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "KP_Report.pdf";
      link.click();
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
