<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana Astrology</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
      padding: 2rem;
    }
    input {
      display: block;
      margin: 0.5rem auto;
      padding: 0.7rem;
      border-radius: 6px;
      border: none;
      width: 60%;
    }
    button {
      margin-top: 1rem;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      color: #0f172a;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>KP Astrology Report</h1>
  <p>Enter your birth details to generate a downloadable KP report.</p>

  <!-- Input Fields -->
  <input id="name" placeholder="Full Name">
  <input id="birthdate" type="date">
  <input id="birthtime" type="time">
  <input id="birthplace" placeholder="Birth Place">

  <!-- Button -->
  <button onclick="generateReport()">Generate KP PDF</button>

  <script>
    async function generateReport() {
      const payload = {
        name: document.getElementById('name').value,
        birthDate: document.getElementById('birthdate').value,
        birthTime: document.getElementById('birthtime').value,
        birthPlace: document.getElementById('birthplace').value
      };

      try {
        const res = await fetch('/api/generateReport', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.pdfBase64) {
          const link = document.createElement('a');
          link.href = 'data:application/pdf;base64,' + data.pdfBase64;
          link.download = 'KP_Report.pdf';
          link.click();
          alert('KP Report generated successfully!');
        } else {
          alert('Failed to generate report. Check function response.');
        }
      } catch (error) {
        console.error('Error generating report:', error);
        alert('An error occurred while generating the report.');
      }
    }
  </script>
</body>
</html>
