<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana - Astrologer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 700px;
      margin: 2rem auto;
      text-align: center;
      padding: 1rem;
      background: rgba(2, 6, 23, 0.7);
      border-radius: 12px;
      box-shadow: 0 0 25px #0ea5e9;
    }
    .mode-btn {
      display: block;
      width: 80%;
      margin: 1rem auto;
      padding: 1rem;
      background: #0ea5e9;
      color: #fff;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }
    .mode-btn:hover {
      background: #38bdf8;
      transform: scale(1.05);
    }
    input, select {
      margin: 0.5rem;
      padding: 0.7rem;
      border-radius: 6px;
      border: none;
      width: 80%;
      text-align: center;
    }
    #lang-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 15px #0ea5e9;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Astrology Report Generator</h1>
    
    <!-- Birth Details -->
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="text" id="nic" placeholder="NIC (for secure DB)" required>
    <input type="date" id="birthdate" required>
    <input type="time" id="birthtime" required>
    <input type="text" id="birthplace" placeholder="Birth Place" required>

    <!-- KP or Vedic Selection -->
    <button class="mode-btn" onclick="setMode('KP')">KP Mode</button>
    <button class="mode-btn" onclick="setMode('Vedic')">Vedic Mode</button>

    <!-- Generate Report -->
    <button class="mode-btn" onclick="generateReport()">Generate Astrology Report</button>
    <button class="mode-btn" onclick="downloadPDF()">Download PDF</button>
    <button class="mode-btn" onclick="playVoice()">Play Voice Summary</button>

    <!-- Output -->
    <div id="report-output" style="margin-top:20px; text-align:left;"></div>
  </div>

  <!-- Language Globe Button -->
  <div id="google_translate_element" style="display:none;"></div>
  <button id="lang-btn">🌐</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script type="text/javascript">
    let mode = 'KP';

    function setMode(selected) {
      mode = selected;
      alert(mode + " mode selected.");
    }

    function generateReport() {
      const name = document.getElementById('name').value;
      const nic = document.getElementById('nic').value;
      const dob = document.getElementById('birthdate').value;
      const tob = document.getElementById('birthtime').value;
      const pob = document.getElementById('birthplace').value;

      // Placeholder for KP Sub Lord Calculation (future API logic)
      const kpResult = "Sub Lord Calculations will be fetched dynamically...";

      const report = `
        <h2>Astrology Report</h2>
        <p><b>Name:</b> ${name}</p>
        <p><b>NIC:</b> ${nic}</p>
        <p><b>Date of Birth:</b> ${dob}</p>
        <p><b>Time of Birth:</b> ${tob}</p>
        <p><b>Place of Birth:</b> ${pob}</p>
        <p><b>Selected Mode:</b> ${mode}</p>
        <p><b>KP Sub Lord Result:</b> ${kpResult}</p>
      `;
      document.getElementById('report-output').innerHTML = report;
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      pdf.text("Sathyadarshana Astrology Report", 10, 10);
      pdf.text(document.getElementById('report-output').innerText, 10, 20);
      pdf.save("Astrology_Report.pdf");
    }

    function playVoice() {
      const text = document.getElementById('report-output').innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US'; // Sinhala/Tamil support via Google Translate voice later
      speechSynthesis.speak(utterance);
    }

    // Google Translate initialization
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,si,ta',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
    document.getElementById('lang-btn').addEventListener('click', function(){
      document.querySelector('.goog-te-gadget-simple').click();
    });
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
