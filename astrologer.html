<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana - KP Live Report</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: radial-gradient(circle, #0f172a, #000); color: #e0f2fe; text-align: center; }
    .container { max-width: 800px; margin: 2rem auto; padding: 2rem; background: rgba(30,41,59,0.8); border-radius: 1rem; box-shadow: 0 0 25px rgba(56,189,248,0.3); }
    input, button { width: 90%; padding: 0.7rem; margin: 0.5rem; border-radius: 0.5rem; border: none; font-size: 1rem; }
    button { background: linear-gradient(90deg, #16f0a7, #0ea5e9); cursor: pointer; }
    button:hover { background: linear-gradient(90deg, #0ea5e9, #16f0a7); transform: scale(1.05); }
    pre { text-align: left; background: #1e293b; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="container">
    <h1>KP Live Report (Mock)</h1>
    <input type="text" id="name" placeholder="Full Name">
    <input type="date" id="birthDate">
    <input type="time" id="birthTime">
    <input type="text" id="birthPlace" placeholder="Birth Place">
    <button onclick="generateKPReport()">Generate KP Report</button>
    <button id="pdfBtn" style="display:none;" onclick="downloadPDF()">Download PDF</button>
    <pre id="output"></pre>
  </div>

  <script>
    async function generateKPReport() {
      const data = {
        name: document.getElementById('name').value,
        birthDate: document.getElementById('birthDate').value,
        birthTime: document.getElementById('birthTime').value,
        birthPlace: document.getElementById('birthPlace').value
      };
      const res = await fetch('/api/generateReport', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      });
      const json = await res.json();
      document.getElementById('output').textContent = JSON.stringify(json, null, 2);
      window.generatedPDF = json.pdfBase64; // Save PDF for download
      document.getElementById('pdfBtn').style.display = 'inline-block';
    }
    function downloadPDF() {
      const link = document.createElement('a');
      link.href = 'data:application/pdf;base64,' + window.generatedPDF;
      link.download = "KP_Report.pdf";
      link.click();
    }
  </script>
</body>
</html>
