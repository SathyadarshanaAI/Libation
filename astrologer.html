
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana Astrology</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      scroll-behavior: smooth;
    }
    nav {
      position: sticky;
      top: 0;
      display: flex;
      gap: 1rem;
      justify-content: center;
      background: rgba(2,6,23,0.93);
      padding: 1rem;
      z-index: 100;
    }
    nav a {
      color: #e0f2fe;
      background: #0ea5e9;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    nav a:hover {
      background: #38bdf8;
    }
    main {
      max-width: 540px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(30,41,59,0.9);
      border-radius: 1rem;
      box-shadow: 0 2px 24px 0 #02061755;
    }
    h1 {
      margin-top: 0;
      color: #7dd3fc;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input {
      background: #1e293b;
      color: #e0f2fe;
      border: 1px solid #334155;
      border-radius: 0.4rem;
      padding: 0.7rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus {
      border: 1.5px solid #38bdf8;
    }
    button {
      background: #16f0a7;
      color: #1e293b;
      border: none;
      padding: 0.9rem 1.2rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, color 0.2s;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button:hover:enabled {
      background: #0ea5e9;
      color: #fff;
    }
    .message {
      margin-top: 1rem;
      text-align: center;
      font-size: 1.05rem;
    }
    section {
      margin-top: 2.5rem;
      background: rgba(30,41,59,0.7);
      border-radius: 0.7rem;
      padding: 1rem 1.5rem;
    }
    @media (max-width: 600px) {
      main { padding: 1rem; }
      section { padding: 1rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="#report">Report</a>
    <a href="#palmistry">Palmistry</a>
    <a href="#numerology">Numerology</a>
    <a href="#geo">GeoVision</a>
  </nav>

  <main id="report">
    <h1>KP Live Report</h1>
    <form id="kpForm" autocomplete="off">
      <input type="text" id="name" placeholder="Full Name" autocomplete="name" required>
      <input type="date" id="dob" required>
      <input type="time" id="tob" required>
      <input type="text" id="pob" placeholder="Birth Place" autocomplete="address-level2" required>
      <button type="submit" id="downloadBtn">Download KP PDF</button>
    </form>
    <div class="message" id="resultMsg"></div>
  </main>

  <section id="palmistry">
    <h1>Palmistry</h1>
    <p>Coming soon.</p>
  </section>
  <section id="numerology">
    <h1>Numerology</h1>
    <p>Coming soon.</p>
  </section>
  <section id="geo">
    <h1>GeoVision</h1>
    <p>Coming soon.</p>
  </section>

  <script>
    const form = document.getElementById('kpForm');
    const downloadBtn = document.getElementById('downloadBtn');
    const msg = document.getElementById('resultMsg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      // Validation (extra check for blank input)
      if(!form.name.value.trim() || !form.dob.value || !form.tob.value || !form.pob.value.trim()) {
        msg.textContent = "Please fill all details.";
        msg.style.color = "#fb7185";
        return;
      }

      downloadBtn.disabled = true;
      downloadBtn.textContent = "Generating...";
      msg.textContent = "";

      try {
        const res = await fetch("/api/generateReport", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: form.name.value.trim(),
            birthDate: form.dob.value,
            birthTime: form.tob.value,
            birthPlace: form.pob.value.trim()
          })
        });

        if (!res.ok) {
          msg.textContent = "Report failed. Try again.";
          msg.style.color = "#fb7185";
        } else {
          const blob = await res.blob();
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "KP_Report.pdf";
          link.click();
          msg.textContent = "✅ Report downloaded!";
          msg.style.color = "#34d399";
          form.reset();
        }
      } catch (err) {
        msg.textContent = "Network error. Try again.";
        msg.style.color = "#fb7185";
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = "Download KP PDF";
      }
    });
  </script>
</body>
</html>
