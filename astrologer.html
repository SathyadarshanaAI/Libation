<!-- KP Birth Chart Section (Dynamic Mock) -->
<h2 style="margin-top:2rem;">KP Birth Chart (Dynamic Mock)</h2>
<canvas id="chartCanvas" width="500" height="500" style="background:#0f172a;border-radius:50%;box-shadow:0 0 15px #38bdf8;"></canvas>
<p style="margin-top:1rem; color:#7dd3fc;">Positions update dynamically (mock data). NASA ephemeris coming soon.</p>
<button onclick="refreshChart()" style="margin-top:1rem;">Refresh Planet Positions</button>

<script>
  const canvas = document.getElementById('chartCanvas');
  const ctx = canvas.getContext('2d');
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const radius = 200;

  // Draw the 12 houses
  function drawHouses() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let i = 0; i < 12; i++) {
      const angle = (i * 30) * Math.PI / 180;
      const x = centerX + radius * Math.cos(angle);
      const y = centerY + radius * Math.sin(angle);
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(x, y);
      ctx.strokeStyle = "#38bdf8";
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    ctx.strokeStyle = "#16f0a7";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Sample mock planetary degrees
  let mockData = {
    Sun: 12, Moon: 46, Mercury: 123,
    Venus: 188, Mars: 222, Jupiter: 260,
    Saturn: 315, Rahu: 44, Ketu: 224
  };

  // Draw planets
  function drawPlanets() {
    drawHouses();
    Object.entries(mockData).forEach(([planet, deg]) => {
      const rad = (deg - 90) * Math.PI / 180;
      const px = centerX + (radius - 40) * Math.cos(rad);
      const py = centerY + (radius - 40) * Math.sin(rad);
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, 2 * Math.PI);
      ctx.fillStyle = planet === 'Sun' ? 'yellow' :
                      planet === 'Moon' ? '#ccc' :
                      planet === 'Mars' ? 'red' :
                      planet === 'Mercury' ? '#0ff' :
                      planet === 'Jupiter' ? 'orange' :
                      planet === 'Saturn' ? '#aaa' :
                      planet === 'Venus' ? 'pink' :
                      planet === 'Rahu' ? 'lime' : 'violet';
      ctx.fill();
      ctx.fillText(planet, px + 8, py);
    });
  }

  // Refresh (for future live API)
  function refreshChart() {
    // Change degrees randomly to simulate movement
    Object.keys(mockData).forEach(p => {
      mockData[p] = (mockData[p] + Math.floor(Math.random()*30)) % 360;
    });
    drawPlanets();
    alert("Mock positions refreshed. Live NASA data coming soon.");
  }

  // Initial draw
  drawPlanets();
</script>
