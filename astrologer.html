<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana | KP Live Report</title>
  <style>
    body { 
      margin: 0; 
      font-family: sans-serif; 
      background: #0f172a; 
      color: #e0f2fe; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
    }
    .container {
      background: rgba(30,41,59,0.9);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px #38bdf8;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 { margin-bottom: 1rem; }
    input {
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.7rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    button {
      background: #16f0a7;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #0ea5e9;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>KP Live Report</h1>
    <input type="text" id="name" placeholder="Full Name">
    <input type="date" id="dob">
    <input type="time" id="tob">
    <input type="text" id="pob" placeholder="Birth Place">
    <button onclick="generatePDF()">Download KP Report</button>
  </div>

  <script>
    async function generatePDF() {
      const res = await fetch("/api/generateReport", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          birthDate: document.getElementById("dob").value,
          birthTime: document.getElementById("tob").value,
          birthPlace: document.getElementById("pob").value
        })
      });
      if (!res.ok) { 
        alert("Report generation failed."); 
        return; 
      }
      const blob = await res.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "KP_Report.pdf";
      link.click();
    }
  </script>
</body>
</html>
