<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sathyadarshana - Astrologer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
    }
    nav {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: rgba(2,6,23,0.85);
      padding: 1rem;
      box-shadow: 0 0 12px #38bdf8;
      z-index: 999;
    }
    nav a {
      color: #e0f2fe;
      text-decoration: none;
      padding: 0.6rem 1rem;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      border-radius: 6px;
      transition: 0.3s;
    }
    nav a:hover {
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      color: #0f172a;
      transform: scale(1.05);
    }
    section {
      min-height: 100vh;
      max-width: 900px;
      margin: 2rem auto;
      padding: 2rem 1.5rem;
      background: rgba(30,41,59,0.8);
      border-radius: 1rem;
      box-shadow: 0 0 25px rgba(56,189,248,0.3);
      text-align: center;
    }
    input, select, button {
      width: 90%;
      margin: 0.5rem auto;
      padding: 0.8rem;
      border-radius: 0.5rem;
      border: none;
      font-size: 1rem;
    }
    button {
      background: linear-gradient(90deg, #16f0a7, #0ea5e9);
      color: #0f172a;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: linear-gradient(90deg, #0ea5e9, #16f0a7);
      transform: scale(1.05);
    }
    #lang-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 12px #0ea5e9;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="#report">Report</a>
    <a href="#palmistry">Palmistry</a>
    <a href="#numerology">Numerology</a>
    <a href="#nadi">Nadi</a>
    <a href="#geo">GeoVision</a>
    <a href="#tariff">Tariff</a>
  </nav>

  <!-- Astrology Report Generator -->
  <section id="report">
    <h1>Astrology Report Generator</h1>
    <input type="text" id="name" placeholder="Full Name">
    <select id="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male (පුරුෂ)</option>
      <option value="Female">Female (ස්ත්‍රී)</option>
    </select>
    <input type="text" id="nic" placeholder="NIC">
    <input type="date" id="birthdate">
    <input type="time" id="birthtime">
    <input type="text" id="birthplace" placeholder="Birth Place">
    <button onclick="setMode('KP')">KP Mode</button>
    <button onclick="setMode('Vedic')">Vedic Mode</button>
    <button onclick="generateReport()">Generate Report (PDF)</button>
    <div id="report-output" style="margin-top:1rem;text-align:left;"></div>
  </section>

  <div id="google_translate_element" style="display:none;"></div>
  <button id="lang-btn">🌐</button>

  <script>
    let mode = 'KP';
    function setMode(selected) { mode = selected; alert(mode + " mode selected."); }

    async function generateReport() {
      const name = document.getElementById('name').value;
      const gender = document.getElementById('gender').value;
      const dob = document.getElementById('birthdate').value;
      const tob = document.getElementById('birthtime').value;
      const pob = document.getElementById('birthplace').value;

      const response = await fetch('/.netlify/functions/generateReport', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, gender, dob, tob, pob, mode })
      });

      if (response.ok) {
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${name}_KP_Report.pdf`;
        link.click();
      } else {
        alert("Failed to generate report. Please try again.");
      }
    }

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en', includedLanguages: 'en,si,ta',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
    document.getElementById('lang-btn').addEventListener('click', () => {
      document.querySelector('.goog-te-gadget-simple').click();
    });
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
