<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sathyadarshana Astrology</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      padding: 1rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.95);
      padding: 1rem;
      border-radius: 12px;
      margin: 1rem 0;
    }
    h2, h3 {
      color: #38bdf8;
    }
    ul {
      list-style: disc;
      margin-left: 1.5rem;
    }
  </style>
</head>
<body>
  <h2>🔭 Sathyadarshana Astrology</h2>

  <div class="card">
    <h3>Birth Chart Generator</h3>
    <p>This version uses simulated NASA planetary data.</p>
  </div>

  <div class="card">
    <h3>🪐 NASA-Based Planetary Positions</h3>
    <ul id="planet-data">
      <!-- JS එකෙන් data load වෙනවා -->
    </ul>
  </div>

  <script>
    // Simulated values (will replace with real NASA data soon)
    const simulatedPlanets = {
      Sun: 143.55,
      Moon: 221.80,
      Mars: 111.25,
      Mercury: 32.10,
      Venus: 76.80,
      Jupiter: 245.60,
      Saturn: 302.40,
      Rahu: 123.70,
      Ketu: 303.70
    };

    const ul = document.getElementById('planet-data');
    for (const [planet, value] of Object.entries(simulatedPlanets)) {
      const li = document.createElement('li');
      li.textContent = `${planet}: ${value.toFixed(2)}°`;
      ul.appendChild(li);
    }
  </script>
</body>
</html>
