<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astrology Test Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      padding: 2rem;
    }
    h1 {
      color: #38bdf8;
      text-align: center;
    }
    .section {
      background: #1e293b;
      padding: 1.5rem;
      margin: 1rem 0;
      border-radius: 12px;
      box-shadow: 0 0 12px #38bdf8;
    }
    textarea {
      width: 100%;
      padding: 1rem;
      border-radius: 8px;
      border: none;
      background: #334155;
      color: #e0f2fe;
      font-size: 16px;
    }
    button {
      background: #0ea5e9;
      border: none;
      padding: 12px;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    audio {
      width: 100%;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1>🔭 Astrology Test Page</h1>

  <div class="section">
    <h2>1️⃣ Birth Report</h2>
    <p>Testing KP Birth Report Output</p>
    <textarea id="birthReport" placeholder="Your KP Birth Report will show here..."></textarea>
    <button onclick="speakReport()">🔊 Speak</button>
    <button onclick="downloadPDF()">📄 Download PDF</button>
    <audio id="audioPlayer" controls hidden></audio>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    function speakReport() {
      const text = document.getElementById('birthReport').value;
      if (!text.trim()) return alert("Please enter or generate report first.");
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      speechSynthesis.speak(utter);
    }

    function downloadPDF() {
      const element = document.getElementById('birthReport');
      const opt = {
        margin:       0.5,
        filename:     'kp-birth-report.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().from(element).set(opt).save();
    }
  </script>

</body>
</html>
