<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sathyadarshana Astrology</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }

    .card {
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      margin: 2rem auto;
      max-width: 500px;
    }

    button {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 8px;
      background-color: #06b6d4;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #22d3ee;
    }

    ul {
      text-align: left;
      padding-left: 1.2rem;
      line-height: 1.8;
    }

    .planet-list {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <h1>🪐 Sathyadarshana Astrology</h1>
  <p>Explore your planetary chart with AI-assisted insight.</p>

  <button onclick="generateChart()">Generate Chart</button>

  <div class="card" id="chart-box">
    <!-- Chart results will appear here -->
  </div>

  <script>
    function generateChart() {
      const chartBox = document.getElementById("chart-box");

      // Placeholder values for now
      chartBox.innerHTML = `
        <h2>🔭 Your Planetary Chart</h2>
        <div class="planet-list">
          <ul>
            <li>☉ Sun: ♌ Leo (Simha)</li>
            <li>☽ Moon: ♓ Pisces (Meena)</li>
            <li>♂ Mars: ♏ Scorpio (Vrischika)</li>
            <li>♀ Venus: ♉ Taurus (Vrushabha)</li>
            <li>☿ Mercury: ♍ Virgo (Kanya)</li>
            <li>♃ Jupiter: ♐ Sagittarius (Dhanu)</li>
            <li>♄ Saturn: ♒ Aquarius (Kumbha)</li>
            <li>☊ Rahu: ♋ Cancer (Kataka)</li>
            <li>☋ Ketu: ♑ Capricorn (Makara)</li>
          </ul>
        </div>
        <p>🌟 Powered by AI Buddhi & Seed Engine (Prototype)</p>
      `;
    }
  </script>
</body>
</html>
