<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Sub-Lord Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #e0f2fe;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px #0ea5e9;
      width: 90%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background-color: #0ea5e9;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .result, #prediction {
      background-color: #1e293b;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      color: #cbd5e1;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>KP Sub-Lord Calculator</h2>
    <label for="planet">Planet:</label>
    <select id="planet">
      <option>Sun</option>
      <option>Moon</option>
      <option>Mars</option>
      <option>Mercury</option>
      <option>Jupiter</option>
      <option>Venus</option>
      <option>Saturn</option>
    </select>

    <label for="degree">Degrees (0-30° in Rashi):</label>
    <input type="number" id="degree" placeholder="E.g., 20" min="0" max="30">

    <button onclick="getSubLord()">Get Sub-Lord</button>

    <div id="result" class="result"></div>
    <div id="prediction" class="result"></div>
  </div>

  <script>
    function getSubLord() {
      const planet = document.getElementById("planet").value;
      const degree = parseFloat(document.getElementById("degree").value);

      let nakshatra = "";
      let starLord = "";

      if (degree >= 0 && degree < 13.2) {
        nakshatra = "Ashwini";
        starLord = "Ketu";
      } else if (degree >= 13.2 && degree < 26.4) {
        nakshatra = "Bharani";
        starLord = "Venus";
      } else if (degree >= 26.4 && degree <= 30) {
        nakshatra = "Krittika";
        starLord = "Sun";
      } else {
        document.getElementById("result").innerText = "Invalid degree range. Must be 0–30°";
        document.getElementById("prediction").innerText = "";
        return;
      }

      const resultText = `Planet: ${planet}\nPosition: ${degree.toFixed(2)}°\nNakshatra: ${nakshatra}\nStar Lord: ${starLord}`;
      document.getElementById("result").innerText = resultText;

      showPrediction(planet, nakshatra, starLord);
    }

    const kpPredictions = {
      Sun: {
        Bharani: {
          Venus: `☀️ Sun in Bharani (Venus):
- Leadership blended with artistic grace
- 📚 Career: Arts, Finance, Politics
- ❤️ Sensitive in love matters
- 🧘 Seek balance in ego vs. compassion`
        }
      },
      Moon: {
        Rohini: {
          Moon: `🌙 Moon in Rohini (Moon):
- Highly sensual and charming
- 💼 Career: Beauty, Media, Food
- ❤️ Romantic but moody
- 🧠 Emotional intelligence high`
        }
      }
    };

    function showPrediction(planet, nakshatra, starLord) {
      const prediction = kpPredictions?.[planet]?.[nakshatra]?.[starLord];
      document.getElementById("prediction").innerText =
        prediction || "🧘‍♂️ Prediction not available for this combination.";
    }
  </script>
</body>
</html>
