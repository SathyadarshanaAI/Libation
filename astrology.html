<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Astrology Dashboard | KP Sub Lord</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      padding: 20px;
    }
    section {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 40px;
    }
    input, select, button {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      background: #334155;
      color: #e0f2fe;
      border: none;
      border-radius: 5px;
    }
    button {
      background: #3b82f6;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
    h2 {
      color: #7dd3fc;
    }
    #output {
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <section id="kp-sub-lord">
    <h2>KP Sub Lord & Sub-Sub Lord 🔮</h2>
    <label for="degree">Enter Planetary Degree (0° to 360°):</label>
    <input type="number" id="degree" min="0" max="360" step="0.01" />

    <label for="lang">Select Language:</label>
    <select id="lang">
      <option value="en-US">English</option>
      <option value="si-LK">සිංහල</option>
      <option value="ta-IN">தமிழ்</option>
    </select>

    <button onclick="calculateSubLord()">Calculate</button>
    <button onclick="speakResult()">🔊 Speak</button>

    <div id="output"></div>
  </section>

  <script>
    function calculateSubLord() {
      const degree = parseFloat(document.getElementById("degree").value);
      const planets = ["Ketu", "Venus", "Sun", "Moon", "Mars", "Rahu", "Jupiter", "Saturn", "Mercury"];
      const subIndex = Math.floor(degree / 13.33) % 9;
      const subSubIndex = Math.floor((degree * 2) / 13.33) % 9;
      const subLord = planets[subIndex];
      const subSubLord = planets[subSubIndex];

      document.getElementById("output").innerHTML =
        `<strong>Sub Lord:</strong> ${subLord}<br><strong>Sub-Sub Lord:</strong> ${subSubLord}`;
    }

    function speakResult() {
      const output = document.getElementById("output").innerText;
      const lang = document.getElementById("lang").value;
      const msg = new SpeechSynthesisUtterance(output);
      msg.lang = lang;
      window.speechSynthesis.speak(msg);
    }
  </script>

</body>
</html>
