<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA KP Logic Test</title>
  <style>
    body {
      background: #0a0f1b;
      color: #dceaff;
      font-family: monospace;
      padding: 2rem;
    }
    .planet-box {
      background: #111927;
      margin-bottom: 1rem;
      padding: 1rem;
      border-left: 4px solid #48bfe3;
    }
  </style>
</head>
<body>
  <h1>🪐 KP Sub Lord Logic - Mock NASA Input</h1>
  <div id="output"></div>  <script>
    // Sample mock data for testing
    const planets = [
      { name: "Sun", degree: 108.45 },
      { name: "Moon", degree: 13.25 },
      { name: "Mars", degree: 205.88 },
      { name: "Mercury", degree: 74.12 },
      { name: "Jupiter", degree: 289.37 },
      { name: "Venus", degree: 45.65 },
      { name: "Saturn", degree: 323.10 },
      { name: "Rahu", degree: 189.01 },
      { name: "Ketu", degree: 9.01 }
    ];

    // Nakshatra spans (13.333...° per Nakshatra)
    const nakshatras = [
      "Ashwini", "Bharani", "Krittika", "Rohini", "Mrigashira", "Ardra", "Punarvasu",
      "Pushya", "Ashlesha", "Magha", "Purva Phalguni", "Uttara Phalguni", "Hasta",
      "Chitra", "Swati", "Vishakha", "Anuradha", "Jyeshta", "Mula", "Purva Ashadha",
      "Uttara Ashadha", "Shravana", "Dhanishta", "Shatabhisha", "Purva Bhadrapada",
      "Uttara Bhadrapada", "Revati"
    ];

    const lords = [
      "Ketu", "Venus", "Sun", "Moon", "Mars", "Rahu", "Jupiter",
      "Saturn", "Mercury", "Ketu", "Venus", "Sun", "Moon",
      "Mars", "Rahu", "Jupiter", "Saturn", "Mercury", "Ketu", "Venus",
      "Sun", "Moon", "Mars", "Rahu", "Jupiter", "Saturn", "Mercury"
    ];

    function getNakshatraInfo(degree) {
      const segment = 13.33333;
      const index = Math.floor(degree / segment);
      const startDeg = index * segment;
      const percentIn = ((degree - startDeg) / segment * 100).toFixed(2);
      return {
        nakshatra: nakshatras[index],
        lord: lords[index],
        segmentPercent: percentIn + "%"
      };
    }

    const container = document.getElementById("output");

    planets.forEach(planet => {
      const info = getNakshatraInfo(planet.degree);
      const div = document.createElement("div");
      div.className = "planet-box";
      div.innerHTML = `
        <strong>${planet.name}</strong><br>
        Degree: ${planet.degree}°<br>
        Nakshatra: ${info.nakshatra}<br>
        Nakshatra Lord: ${info.lord}<br>
        Position in Segment: ${info.segmentPercent}
      `;
      container.appendChild(div);
    });
  </script></body>
</html>
