<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sathyadarshana Astrology</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
    }
    header {
      background-color: #1e293b;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }
    section {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    input, select, button {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: none;
    }
    button {
      background-color: #0284c7;
      color: white;
      cursor: pointer;
    }
    .report, .pdf-link {
      margin-top: 2rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 0.5rem;
    }
    audio {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    🔭 Sathyadarshana Astrology Panel
  </header>  <section>
    <h2>Enter Birth Details</h2>
    <form id="astroForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="text" id="nic" placeholder="NIC Number (optional)" />
      <input type="date" id="dob" required />
      <input type="time" id="tob" required />
      <input type="text" id="place" placeholder="Place of Birth" required />
      <button type="submit">Generate Report</button>
    </form><div class="report" id="kpResult"></div>
<div class="pdf-link" id="pdfLink"></div>

  </section>  <script>
    document.getElementById("astroForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const dob = document.getElementById("dob").value;
      const tob = document.getElementById("tob").value;
      const place = document.getElementById("place").value;

      const summary = `This is the generated KP Sub-Lord and PDF Voice Summary for ${name} born on ${dob} at ${tob} in ${place}.`;

      document.getElementById("kpResult").innerHTML = `
        <h3>🪐 KP Sub-Lord Result</h3>
        <p>${summary}</p>
        <h3>🗣️ Voice Summary (English)</h3>
        <audio controls src="https://example.com/audio-summary.mp3"></audio>
      `;

      document.getElementById("pdfLink").innerHTML = `
        <a href="https://example.com/birth-report.pdf" download>📄 Download Birth Report (PDF)</a>
      `;
    });
  </script></body>
</html>
