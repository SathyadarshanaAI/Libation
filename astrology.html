<section id="voice-summary" style="margin-top: 50px;">
  <h2 style="color:#38bdf8; text-align:center;">🗣️ KP Voice Summary Generator</h2>
  <div style="background-color: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 0 25px #38bdf8; max-width: 600px; margin: auto;">
    <textarea id="textInput" placeholder="Enter astrology summary here..." style="width:100%; height:120px; border-radius:10px; padding:10px;"></textarea>
    <button onclick="generateVoice()" style="margin-top:10px; background-color:#0ea5e9; border:none; border-radius:8px; padding:10px; width:100%;">🔊 Play Voice</button>
    <button onclick="downloadPDF()" style="margin-top:10px; background-color:#38bdf8; border:none; border-radius:8px; padding:10px; width:100%;">📄 Download PDF</button>
    <audio id="audioPlayer" controls hidden style="margin-top:10px;"></audio>
  </div>
</section>

<!-- Add html2pdf.js if not already in astrology.html -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
  function generateVoice() {
    const text = document.getElementById("textInput").value;
    if (!text.trim()) {
      alert("Please enter some summary text first.");
      return;
    }
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    speechSynthesis.speak(utterance);
  }

  function downloadPDF() {
    const element = document.createElement('div');
    element.innerHTML = `<h2 style="color:#38bdf8;">KP Voice Summary</h2><p>${document.getElementById("textInput").value}</p><footer style="margin-top:20px; font-size:12px;">© Sathyadarshana | Light of Truth</footer>`;
    html2pdf().from(element).set({
      margin: 1,
      filename: 'KP_Voice_Summary.pdf',
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
    }).save();
  }
</script>
