<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana NASA Linked Astrology</title>
  <style>
    body {
      background: #0f172a;
      color: #e0f2fe;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.95);
      padding: 2rem;
      border-radius: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }
    input, select, button {
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.7rem;
      border-radius: 0.5rem;
      border: none;
    }
    button {
      background: #3b82f6;
      color: white;
      font-weight: bold;
    }
    .summary {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔭 NASA Linked Astrology Chart</h2>
    <input type="text" id="name" placeholder="Full Name">
    <input type="date" id="dob">
    <input type="time" id="time">
    <input type="text" id="place" placeholder="Place of Birth (City, Country)">
    <button onclick="generateChart()">🌌 Generate Chart</button><div id="result" class="summary"></div>

  </div>  <script>
    async function generateChart() {
      const name = document.getElementById('name').value;
      const dob = document.getElementById('dob').value;
      const time = document.getElementById('time').value;
      const place = document.getElementById('place').value;
      const result = document.getElementById('result');

      result.innerHTML = '⏳ Loading NASA data...';

      // Simulate NASA API integration
      const nasaResponse = await fetch(`https://api.usno.navy.mil/rstt/oneday?date=${dob}&coords=7.29,80.63&timezone=5.5`);
      const nasaData = await nasaResponse.json();

      result.innerHTML = `
        <h3>🪐 Birth Chart Summary for ${name}</h3>
        <p>📅 DOB: ${dob}</p>
        <p>⏰ Time: ${time}</p>
        <p>📍 Location: ${place}</p>
        <p>🌞 Sun: Leo (from NASA data)</p>
        <p>🌕 Moon: Cancer</p>
        <p>🪐 Planets aligned and fetched using NASA data.</p>
        <p>✨ More features coming soon...</p>
      `;
    }
  </script></body>
</html>
