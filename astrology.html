<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sathyadarshana | Astrology Birth Chart</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at center, #0f172a, #000);
      color: #e0f2fe;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    input, button {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }
    button {
      background-color: #2563eb;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #1e40af;
    }
    #chart {
      margin-top: 2rem;
      white-space: pre-wrap;
      background-color: rgba(30,41,59,0.9);
      padding: 1rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>🪐 Astrology Birth Chart</h1>

  <div class="form-group">
    <label for="name">👤 Full Name</label>
    <input type="text" id="name" placeholder="Enter your name" required />
  </div>

  <div class="form-group">
    <label for="dob">📅 Date of Birth</label>
    <input type="date" id="dob" required />
  </div>

  <div class="form-group">
    <label for="birthTime">⏰ Time of Birth</label>
    <input type="time" id="birthTime" required />
  </div>

  <div class="form-group">
    <label for="birthPlace">📍 Place of Birth</label>
    <input type="text" id="birthPlace" placeholder="City, Country" required />
  </div>

  <div class="form-group">
    <label for="nic">🆔 NIC Number (Optional)</label>
    <input type="text" id="nic" placeholder="Ex: 199043600123" />
  </div>

  <button onclick="generateChart()">🔮 Generate Chart</button>

  <div id="chart"></div>

  <script>
    function generateChart() {
      const name = document.getElementById("name").value;
      const dob = document.getElementById("dob").value;
      const time = document.getElementById("birthTime").value;
      const place = document.getElementById("birthPlace").value;
      const nic = document.getElementById("nic").value;

      if (!name || !dob || !time || !place) {
        alert("Please fill in all required fields.");
        return;
      }

      const userData = {
        name,
        dob,
        time,
        place,
        nic,
        generatedAt: new Date().toISOString()
      };

      console.log("Saving to DB:", userData); // Firebase/MongoDB use later

      const chartData = `
🔮 Birth Chart Summary for ${name}
📅 DOB: ${dob}
⏰ Time: ${time}
📍 Location: ${place}
🆔 NIC: ${nic || 'Not Provided'}

🪐 Sun in Leo ♌
🌕 Moon in Cancer ♋
🔥 Mars in Aries ♈
💧 Venus in Pisces ♓
🌿 Mercury in Gemini ♊
🌌 Jupiter in Aquarius ♒
🌀 Saturn in Capricorn ♑
💥 Rahu in Taurus ♉
🌪 Ketu in Scorpio ♏

🧠 Sub-Lord Insight: Calm, spiritual, introspective thinker.
💫 Message from Buddhi: Seek stillness. A new path begins today.
      `;

      document.getElementById("chart").innerText = chartData;
    }
  </script>

</body>
</html>
