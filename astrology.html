<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana Astrology Chart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    .chart-box {
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 1rem;
      box-shadow: 0 0 15px #38bdf8aa;
    }
    .label {
      margin-top: 1rem;
    }
    select, input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border-radius: 0.5rem;
      border: none;
      background: #1e293b;
      color: #f1f5f9;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem;
      width: 100%;
      background: #38bdf8;
      border: none;
      border-radius: 0.5rem;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }
    .result {
      margin-top: 2rem;
      padding: 1rem;
      background: #1e3a8a;
      border-radius: 0.5rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>KP Sub-Lord Calculator</h1>
  <div class="chart-box">
    <label class="label">Planet:</label>
    <select id="planet">
      <option value="Moon">Moon</option>
      <option value="Sun">Sun</option>
      <option value="Mars">Mars</option>
      <option value="Mercury">Mercury</option>
      <option value="Jupiter">Jupiter</option>
      <option value="Venus">Venus</option>
      <option value="Saturn">Saturn</option>
      <option value="Rahu">Rahu</option>
      <option value="Ketu">Ketu</option>
    </select><label class="label">Degrees (0-30° in Rashi):</label>
<input type="number" id="degrees" step="0.1" min="0" max="30">

<button onclick="calculateSubLord()">Get Sub-Lord</button>

<div class="result" id="output"></div>

  </div>  <script>
    const nakshatras = [
      { name: "Ashwini", lord: "Ketu" },
      { name: "Bharani", lord: "Venus" },
      { name: "Krittika", lord: "Sun" },
      { name: "Rohini", lord: "Moon" },
      { name: "Mrigashira", lord: "Mars" },
      { name: "Ardra", lord: "Rahu" },
      { name: "Punarvasu", lord: "Jupiter" },
      { name: "Pushya", lord: "Saturn" },
      { name: "Ashlesha", lord: "Mercury" },
      { name: "Magha", lord: "Ketu" },
      { name: "Purva Phalguni", lord: "Venus" },
      { name: "Uttara Phalguni", lord: "Sun" },
      { name: "Hasta", lord: "Moon" },
      { name: "Chitra", lord: "Mars" },
      { name: "Swati", lord: "Rahu" },
      { name: "Vishakha", lord: "Jupiter" },
      { name: "Anuradha", lord: "Saturn" },
      { name: "Jyeshtha", lord: "Mercury" },
      { name: "Mula", lord: "Ketu" },
      { name: "Purva Ashadha", lord: "Venus" },
      { name: "Uttara Ashadha", lord: "Sun" },
      { name: "Shravana", lord: "Moon" },
      { name: "Dhanishta", lord: "Mars" },
      { name: "Shatabhisha", lord: "Rahu" },
      { name: "Purva Bhadrapada", lord: "Jupiter" },
      { name: "Uttara Bhadrapada", lord: "Saturn" },
      { name: "Revati", lord: "Mercury" }
    ];

    function calculateSubLord() {
      const degrees = parseFloat(document.getElementById("degrees").value);
      const planet = document.getElementById("planet").value;
      if (isNaN(degrees) || degrees < 0 || degrees > 30) {
        document.getElementById("output").innerText = "Please enter a degree between 0 and 30.";
        return;
      }
      const totalNakshatraDegrees = 13.3333;
      let nakIndex = Math.floor(degrees / totalNakshatraDegrees);
      const nakshatra = nakshatras[nakIndex];

      const output = `Planet: ${planet}\nPosition: ${degrees.toFixed(2)}°\nNakshatra: ${nakshatra.name}\nStar Lord: ${nakshatra.lord}`;
      document.getElementById("output").innerText = output;
    }
  </script></body>
</html>
