<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana Astrology</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .chart-box {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
    h1, h2 {
      color: #38bdf8;
    }
    .planet-row {
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }
    .planet-name {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🌌 Sathyadarshana Astrology</h1>
  <h2>Real-Time Planetary Position (Zodiac Degrees)</h2>
  <div id="chart" class="chart-box">
    Loading chart...
  </div>  <script>
    const sampleData = {
      Sun: { zodiac: 'Leo', degree: 12.5 },
      Moon: { zodiac: 'Scorpio', degree: 24.1 },
      Mars: { zodiac: 'Gemini', degree: 3.3 },
      Mercury: { zodiac: 'Cancer', degree: 17.7 },
      Jupiter: { zodiac: 'Scorpio', degree: 22.0 },
      Venus: { zodiac: 'Virgo', degree: 8.2 },
      Saturn: { zodiac: 'Pisces', degree: 29.5 },
      Rahu: { zodiac: 'Aries', degree: 9.4 },
      Ketu: { zodiac: 'Libra', degree: 9.4 }
    };

    const chartDiv = document.getElementById('chart');
    chartDiv.innerHTML = '';

    for (const planet in sampleData) {
      const { zodiac, degree } = sampleData[planet];
      const row = document.createElement('div');
      row.className = 'planet-row';
      row.innerHTML = `
        <span class="planet-name">${planet}</span>: 
        ${zodiac} (${degree.toFixed(1)}°)
      `;
      chartDiv.appendChild(row);
    }
  </script></body>
</html>
