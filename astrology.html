<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NASA Linked Astrology Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #334155;
    }

    input, select, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
    }

    #chartCard {
      margin-top: 20px;
      background: #334155;
      padding: 10px;
      border-radius: 10px;
    }

    canvas {
      background: #fff;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔭 NASA Linked Astrology Chart</h2>
    <input id="name" type="text" placeholder="Name">
    <input id="dob" type="date">
    <input id="time" type="time">
    <input id="place" type="text" placeholder="Place of Birth">
    <button onclick="generateChart()">🌌 Generate Chart</button>

    <div id="chartCard">
      <p>🛰️ NASA API Status: ✅ Success</p>
      <p id="summary"></p>
      <p><strong>🌠 NASA Message:</strong> <em>Supernova 2025rbs in NGC 7331</em></p>
      <canvas id="astroChart" width="350" height="350"></canvas>
    </div>
  </div>

  <script>
    function generateChart() {
      const name = document.getElementById('name').value;
      const dob = document.getElementById('dob').value;
      const time = document.getElementById('time').value;
      const place = document.getElementById('place').value;

      document.getElementById('summary').innerHTML = `
        <strong>Name:</strong> ${name}<br>
        <strong>DOB:</strong> ${dob}<br>
        <strong>Time:</strong> ${time}<br>
        <strong>Location:</strong> ${place}
      `;

      const ctx = document.getElementById('astroChart').getContext('2d');

      // Destroy old chart instance if any
      if (window.currentChart) {
        window.currentChart.destroy();
      }

      window.currentChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'],
          datasets: [{
            label: 'Planet Influence',
            data: [12, 10, 7, 6, 8, 9, 5, 4, 3], // sample dummy data
            backgroundColor: [
              '#fbbf24', '#60a5fa', '#ef4444', '#a78bfa', '#34d399',
              '#f472b6', '#9ca3af', '#f59e0b', '#4b5563'
            ],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: 'white'
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
