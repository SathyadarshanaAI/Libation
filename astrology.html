<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sathyadarshana | Astrology</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #0f172a;
      color: #e0f2fe;
      padding: 2rem;
    }
    h1 {
      color: #38bdf8;
    }
    .section {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 2rem;
    }
    ul {
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1>🔭 Sathyadarshana Astrology</h1>

  <!-- 🧘🏻 Input Form (You can expand this later) -->
  <div class="section">
    <h2>Birth Chart Generator</h2>
    <p>This version uses simulated NASA planetary data.</p>
  </div>

  <!-- 🌌 NASA Graha Position Display -->
  <div class="section">
    <h2>🪐 NASA-Based Planetary Positions</h2>
    <div id="nasa-output">Loading graha data...</div>
  </div>

  <script>
    function extractGrahaPositions(text) {
      const lines = text.split("\n");
      const grahaMap = {};
      lines.forEach(line => {
        const match = line.match(/^([A-Za-z]+)\s+([\d.]+)/);
        if (match) {
          const graha = match[1];
          const degree = parseFloat(match[2]);
          grahaMap[graha] = degree;
        }
      });
      return grahaMap;
    }

    // Simulated NASA-style planetary degrees
    const nasaData = `
Sun   143.55
Moon  221.80
Mars  111.25
Mercury 32.1
Venus  76.8
Jupiter  245.6
Saturn  302.4
Rahu  123.7
Ketu  303.7
`;

    const grahaPositions = extractGrahaPositions(nasaData);
    const outputDiv = document.getElementById("nasa-output");
    const ul = document.createElement("ul");

    Object.entries(grahaPositions).forEach(([graha, degree]) => {
      const li = document.createElement("li");
      li.textContent = `${graha}: ${degree.toFixed(2)}°`;
      ul.appendChild(li);
    });

    outputDiv.textContent = "";
    outputDiv.appendChild(ul);
  </script>

</body>
</html>
