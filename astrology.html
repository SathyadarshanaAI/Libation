<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Astrology Report PDF Export</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      padding: 20px;
    }
    #report {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      width: 90%;
      max-width: 600px;
    }
    button {
      background-color: #38bdf8;
      color: black;
      padding: 10px 20px;
      border: none;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    canvas {
      margin-top: 15px;
      background: #fff;
    }
  </style>
</head>
<body>

  <div id="report">
    <h2>🪐 Astrology Report</h2>
    <p><strong>Name:</strong> Anuruddha</p>
    <p><strong>Date of Birth:</strong> 1990-12-01</p>
    <p><strong>Time:</strong> 14:30</p>
    <p><strong>Place:</strong> Colombo</p>

    <canvas id="astroChart" width="300" height="300"></canvas>
  </div>

  <button id="exportPDF">📄 Download Astrology Report (PDF)</button>

  <script>
    // Draw sample chart (placeholder)
    const canvas = document.getElementById('astroChart');
    const ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.arc(150, 150, 100, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.fillText("Scorpio", 130, 150);

    // PDF Export logic
    document.getElementById("exportPDF").addEventListener("click", async () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const element = document.getElementById("report");
      await html2canvas(element).then((canvas) => {
        const imgData = canvas.toDataURL("image/png");
        doc.addImage(imgData, 'PNG', 10, 10, 190, 0);
        doc.save("astrology_report.pdf");
      });
    });
  </script>

</body>
</html>
