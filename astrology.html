<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Linked Astrology Chart</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      width: 90%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    input, select, button {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    button {
      background-color: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    #output {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    #errorMessage {
      color: #f87171;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔭 NASA Linked Astrology Chart</h2>
    <input type="text" id="name" placeholder="Your Name" />
    <input type="date" id="dob" />
    <input type="time" id="birthTime" />
    <input type="text" id="location" placeholder="Birthplace (e.g. Kandy, Sri Lanka)" />
    <button onclick="generateChart()">🌌 Generate Chart</button>
    <div id="output">⏳ Loading NASA data...</div>
    <div id="errorMessage"></div>
  </div>  <script>
    async function generateChart() {
      const name = document.getElementById('name').value;
      const dob = document.getElementById('dob').value;
      const birthTime = document.getElementById('birthTime').value;
      const location = document.getElementById('location').value;

      const output = document.getElementById('output');
      const errorMessage = document.getElementById('errorMessage');
      output.innerHTML = '⏳ Loading NASA data...';
      errorMessage.innerText = '';

      try {
        const res = await fetch(`https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY`);
        const data = await res.json();

        if (data.title) {
          output.innerHTML = `
            <strong>🌌 NASA API Status:</strong> ✅ Success<br><br>
            <strong>Name:</strong> ${name}<br>
            <strong>DOB:</strong> ${dob}<br>
            <strong>Time:</strong> ${birthTime}<br>
            <strong>Location:</strong> ${location}<br><br>
            📡 NASA Message: <em>${data.title}</em>
          `;
        } else {
          output.innerHTML = '❌ Unexpected response from NASA.';
        }
      } catch (err) {
        output.innerHTML = '';
        errorMessage.innerText = '❌ NASA API Error: ' + err.message;
      }
    }
  </script></body>
</html>
