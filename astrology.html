<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🪐 Sathyadarshana Astrology</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      padding: 2rem;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,255,255,0.1);
    }
    input, button {
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 5px;
      width: 100%;
      font-size: 1rem;
    }
    input {
      background: #0f172a;
      color: #e0f2fe;
      border: 1px solid #334155;
    }
    button {
      background: #06b6d4;
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }
    #chart {
      margin-top: 2rem;
      white-space: pre-line;
      background: #0f172a;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🪐 Sathyadarshana Astrology</h1>
    <p>Generate your birth chart instantly</p>

    <input type="text" id="name" placeholder="Your Full Name" required />
    <input type="date" id="dob" required />
    <input type="time" id="birthTime" required />
    <input type="text" id="birthPlace" placeholder="Place of Birth" required />
    
    <button onclick="generateChart()">Generate Chart</button>

    <div id="chart"></div>
  </div>

  <script>
    function generateChart() {
      const name = document.getElementById("name").value;
      const dob = document.getElementById("dob").value;
      const time = document.getElementById("birthTime").value;
      const place = document.getElementById("birthPlace").value;

      if (!name || !dob || !time || !place) {
        alert("Please fill in all fields");
        return;
      }

      // 🧠 Mock astrology logic
      const chartData = `
🔮 Birth Chart Summary for ${name}
📅 DOB: ${dob}
⏰ Time: ${time}
📍 Location: ${place}

🪐 Sun in Leo ♌
🌕 Moon in Cancer ♋
🔥 Mars in Aries ♈
💧 Venus in Pisces ♓
🌿 Mercury in Gemini ♊
🌌 Jupiter in Aquarius ♒
🌀 Saturn in Capricorn ♑
💥 Rahu in Taurus ♉
🌪 Ketu in Scorpio ♏

🧠 Sub-Lord Reading: Calm, spiritual, introspective.
💫 Sathyadarshana Insight: Seek stillness. A new path begins today.

📥 Download PDF option coming soon...
      `;
      document.getElementById("chart").innerText = chartData;
    }
  </script>
</body>
</html>
