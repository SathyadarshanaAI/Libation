<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathyadarshana Astrology</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }
    canvas {
      display: block;
      margin: 20px auto;
      background-color: #111;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(255,255,255,0.2);
    }
    h2 {
      text-align: center;
      margin-top: 30px;
      font-size: 1.6em;
      color: #0ff;
    }
    .color-key {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .key {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .box {
      width: 15px;
      height: 15px;
      border-radius: 3px;
    }
  </style>
</head>
<body>  <h2>Planetary Motion Chart</h2>  <div class="color-key">
    <div class="key"><div class="box" style="background: #0f0"></div>Direct Motion</div>
    <div class="key"><div class="box" style="background: #ff0"></div>Stationary</div>
    <div class="key"><div class="box" style="background: #f00"></div>Retrograde</div>
  </div><canvas id="astroChart" width="380" height="380"></canvas>

  <script>
    const canvas = document.getElementById('astroChart');
    const ctx = canvas.getContext('2d');
    const radius = 160;
    const center = canvas.width / 2;

    // Sample planets with degrees and velocities
    const planets = [
      { name: 'Sun', degree: 120, velocity: 1.2 },
      { name: 'Moon', degree: 210, velocity: 0.0 },
      { name: 'Mars', degree: 90, velocity: -0.8 },
      { name: 'Jupiter', degree: 45, velocity: 0.5 },
      { name: 'Venus', degree: 275, velocity: 0.0 },
      { name: 'Saturn', degree: 330, velocity: -0.3 }
    ];

    function drawChart() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Outer Circle
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw 12 divisions (rāśi)
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30) * Math.PI / 180;
        const x = center + radius * Math.cos(angle);
        const y = center + radius * Math.sin(angle);
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.lineTo(x, y);
        ctx.strokeStyle = '#333';
        ctx.stroke();
      }

      // Planet Points
      planets.forEach(p => {
        const angle = (p.degree - 90) * Math.PI / 180;
        const x = center + radius * Math.cos(angle);
        const y = center + radius * Math.sin(angle);

        // Determine color by motion
        let color = '#ff0'; // Stationary
        if (p.velocity > 0.01) color = '#0f0';
        else if (p.velocity < 0) color = '#f00';

        // Dot
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();

        // Label
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText(p.name, x + 10, y);
      });
    }

    drawChart();
  </script></body>
</html>
