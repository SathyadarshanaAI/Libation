<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aura Scanner | SathyadarshanaAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Scan your palm, face, or body aura with SathyadarshanaAI's smart camera tool.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&    }
    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #000);
      color: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      text);
      width: 100vw;
      color: #7dd3fc;
      font-size: 1.6em;
      text-shadow: 0 0 12px #38bdf8;
      font-weight: bold;
      letter-spacing: 0.02em;
    }
    main {
      justify-content: flex-start;
    }
    #camera-container {
      position: relative;
      width: 100vw;
      max-width: 480px;
      aspect-ratio: 3/4;
      background: #000;
      overflow: hidden;
      border-radius: 1.2em;
      margin:0.3em;
      display: block;
    }
    #faceOverlay {
      width: 50%;
      height: 50%;
      left: 25%;
      top: 25%;
      border-radius: 50%;
      display: none;
    }
    #bodyOverlay {
      width: 40%;
      height: 80%;
      left: 30%;
      top: 10%;
      border-radius: 0.5em;
      display: none;
    }
    /* Controls */
    #controls {
      margin: 1em 0 0.7em 0;
      display: flex border: none;
      border-radius: 0.5em;
      background: linear-gradient(90deg,#38bdf8,#16f0a7);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 0 15px #38bdf888;
      transition: 0.25s;
      outline: none;
    }
    button:active, button:focus { outline: 2px solid #16f0a7; }
    button:hover { transform: scale(1.05);: rgba(220,20,60,0.4);
      font-size: 1.1em;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 7px #000;
      z-index: 10;
      user-select: none;
    }
    /* Feedback message */
    #message {
      bold;
      min-height: 1.7em;
      font-size: 1.08em;
      letter-spacing: .02em;
    }
    @media (max-width: 750px) {
      #camera-container { max-width: 98vw; }
      #controls { flex-direction: column; gap: 0.5rem; }
    }
    @media (max-width: 480px) {
      header { font-size: 1.15em; }
      #camera-container { border-radius: 0.5em; }
      button { font-size: 0.94em; }
      #watermark { font-size: 0.9em; bottom: 8px; right: 10px; }
    }
    footer {
      text-align: center;
      padding: 1em 0 0.2em 0;
      background: transparent;
      color: #38bdf8;
      font-weight: bold;
      font-size: 1em;
      letter-spacing: 0.01em;
      width: 100vw;
      line-height: 1.5;
    }
    .;
      font-weight: bold;
      font-size: 1.03em;
      letter-spacing: 0.015em;
      margin-top: 0.3em;
    }
    .ovi-blessing span { font-size: 1.07em; margin-left: 0.2em; }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0;font-size:1em;font-weight:700;letter-spacing:.01em;">Aura Scanner - Palm | Face | Body</h1>
  </header>
  <main>
    <div id="camera-container="overlay" aria-hidden="true"></div>
      <div id="watermark" aria-hidden="true">© SathyadarshanaAI</div>
    </div>
    <div id="message"></div>
    <div id="controls">
      <button onclick="setMode('palm')" aria-label="Palm scan mode">Palm</button>
      <button onclick="setMode('face')" aria-label="Face scan mode">Face</button>
      <button onclick="setMode('body')" aria-label="Full body scan mode">Full Body</button>
      <button id="switchCam" aria-label="button id="capture" aria-label="Capture image">Capture</button>
    </div>
    <canvas id="snapshot"></canvas>
    <a id="downloadLink" style="display:none;">Download</a>
  </main>
  <footer>
    Made with ❤️ by Buddhi & Mona<br>
    <span class="ovi-blessing">
      ඔබට සතුට, සෙත, ශක්තිය, ආදරය සහ ආලෝකය ලැබේවා!
      <span>🙏 ඔවි: ජය වේවා! ❤️</span>
    </span>
  </footer>
  <script>
    // Camera logic');
    async function startCamera() {
      message.textContent = "";
      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFront ? 'user' : 'environment', width: {ideal: 720}, height: {ideal: 960} }
        });
        video.srcObject = stream;
      } catch (e) {
        message.textContent = "Camera access denied or unavailable. Please allow camera permission and reload.";
      }
    }
    startCamera();

    document.getElementById('switchCam === 'palm') ? 'block' : 'none';
      document.getElementById('faceOverlay').style.display = (mode === 'face') ? 'block' : 'none';
      document.getElementById('bodyOverlay').style.display = (mode === 'body') ? 'block' : 'none';
    }

    // Make Palm the default mode on load
    setMode('palm');

    // Flashlight (mobile, optional)
    async function enableFlash() {
      if (!stream) return;
      const track = stream.getVideoTracks()[0];
      if (!track) return;
      const capabilities = track.getCapabilities?.();
      if (capabilities && capabilities.torch) {
        try {
          await track.applyConstraints({ advanced: [{ torch: true }] });
        } catch (e) { /* Torch not supported or error */ }
      }
    }

    // Capture logic + responsive watermark
    document.getElementById('capture').onclick = async () => {
      if (!video.videoWidth) {
        message.textContent = "Camera not ready!";
        return;
      }
      await enableFlash();
      const canvas = document.getElementById('snapshot');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight watermark (bottom right)
      const wmText = "© SathyadarshanaAI";
      const fontSize = Math.floor(canvas.width/22);
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.fillStyle = "rgba(220,20,60,0.5)";
      ctx.textBaseline = "bottom";
      ctx.textAlign = "right";
      ctx.fillText(wmText, canvas.width - 30, canvas.height - 18);

      // Save image (download + DB prep)
      const dataURL = canvas.toDataURL('image/png');
      const link = document.getElementdownloadLink');
      link.href = dataURL;
      link.download = `AuraScan_${Date.now()}.png`;
      link.style.display = "block";
      link.textContent = "Download Image";
      link.click();
      link.style.display = "none";

      // Show DB save placeholder
      message.textContent = "Image saved! (DB integration coming soon)";
      setTimeout(() => message.textContent = "", 2500);
    };

    // Restrict right-click only on video/canvas
    document.getElementById('camera-container').addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
