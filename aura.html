<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palm Scanner with Flash | Sathyadarshana</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #0ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    video {
      width: 90%;
      max-width: 400px;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      box-shadow: 0 0 25px #38bdf888;
    }
    #flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 9999;
    }
    button {
      margin-top: 1em;
      padding: 1em 2em;
      background: #38bdf8;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Palm Scanner (with Flash)</h2>
  <video id="camera" autoplay playsinline></video>
  <button id="toggleFlash">Flash On</button>
  <button id="captureBtn">Capture</button>
  <div id="flash-overlay"></div>
  <canvas id="snapshot" style="display:none;"></canvas>
  <script>
    const video = document.getElementById('camera');
    const toggleFlashBtn = document.getElementById('toggleFlash');
    const captureBtn = document.getElementById('captureBtn');
    const overlay = document.getElementById('flash-overlay');
    const canvas = document.getElementById('snapshot');
    let stream;
    let flashOn = false;
    let track;

    async function startCamera() {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
    }

    toggleFlashBtn.onclick = async () => {
      if (!track) return alert("Camera not started!");
      const capabilities = track.getCapabilities();
      if (capabilities.torch) {
        try {
          flashOn = !flashOn;
          await track.applyConstraints({ advanced: [{ torch: flashOn }] });
        } catch (err) {
          alert("Flash control failed: " + err.message);
        }
      } else {
        // Fallback: Screen flash simulation
        overlay.style.opacity = 1;
        setTimeout(() => { overlay.style.opacity = 0; }, 150);
        alert("Torch not supported, using screen flash.");
      }
    };

    captureBtn.onclick = () => {
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageURL = canvas.toDataURL('image/png');
      const newTab = window.open();
      newTab.document.write(`<img src="${imageURL}" style="width:100%">`);
    };

    startCamera();
  </script>
</body>
</html>
