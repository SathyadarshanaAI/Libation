<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aura Scanner | SathyadarshanaAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #000);
      color: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      text-align: center;
    }
    header {
      padding: 1rem;
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(8px);
      width: 100%;
      color: #7dd3fc;
      font-size: 1.6em;
      text-shadow: 0 0 12px #38bdf8;
    }
    #camera-container {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: 70vh;
      background: black;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .overlay {
      position: absolute;
      border: 2px dashed #38bdf8;
      opacity: 0.8;
      pointer-events: none;
    }
    #palmOverlay { width: 70%; height: 60%; left: 15%; top: 20%; border-radius: 0.3em; }
    #faceOverlay { width: 50%; height: 50%; left: 25%; top: 25%; border-radius: 50%; display:none; }
    #bodyOverlay { width: 40%; height: 80%; left: 30%; top: 10%; border-radius: 0.5em; display:none; }
    #controls {
      margin: 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 0.8em 1.6em;
      border: none;
      border-radius: 0.5em;
      background: linear-gradient(90deg,#38bdf8,#16f0a7);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 0 15px #38bdf888;
      transition: 0.25s;
    }
    button:hover { transform: scale(1.05); }
    canvas { display: none; }
    #watermark {
      position: absolute;
      bottom: 10px;
      right: 10px;
      color: rgba(220,20,60,0.4);
      font-size: 1.2em;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 6px #000;
    }
    /* Preview Modal */
    #previewModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }
    #previewModal img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 0.5em;
      box-shadow: 0 0 20px #38bdf8aa;
    }
    #previewButtons {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <header>Aura Scanner - Palm | Face | Body</header>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div id="palmOverlay" class="overlay"></div>
    <div id="faceOverlay" class="overlay"></div>
    <div id="bodyOverlay" class="overlay"></div>
    <div id="watermark">© SathyadarshanaAI</div>
  </div>

  <div id="controls">
    <button onclick="setMode('palm')">Palm Mode</button>
    <button onclick="setMode('face')">Face Mode</button>
    <button onclick="setMode('body')">Full Body Mode</button>
    <button id="switchCam">Switch Camera</button>
    <button id="capture">Capture</button>
  </div>

  <!-- Preview Modal -->
  <div id="previewModal">
    <img id="capturedImg" alt="Captured Aura">
    <div id="previewButtons">
      <button id="saveBtn">Save</button>
      <button id="closeBtn">Close</button>
    </div>
  </div>

  <canvas id="snapshot"></canvas>

  <script>
    let video = document.getElementById('video');
    let stream;
    let useFront = true;

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: useFront ? 'user' : 'environment' } });
      video.srcObject = stream;
    }
    startCamera();

    document.getElementById('switchCam').onclick = () => { useFront = !useFront; startCamera(); };

    function setMode(mode) {
      document.getElementById('palmOverlay').style.display = (mode === 'palm') ? 'block' : 'none';
      document.getElementById('faceOverlay').style.display = (mode === 'face') ? 'block' : 'none';
      document.getElementById('bodyOverlay').style.display = (mode === 'body') ? 'block' : 'none';
    }

    async function enableFlash() {
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities();
      if (caps.torch) {
        try { await track.applyConstraints({ advanced: [{ torch: true }] }); } 
        catch (e) { console.log("Torch unsupported", e); }
      }
    }

    document.getElementById('capture').onclick = async () => {
      await enableFlash();
      const canvas = document.getElementById('snapshot');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video,0,0,canvas.width,canvas.height);

      // Add watermark
      ctx.font = "48px Arial";
      ctx.fillStyle = "rgba(220,20,60,0.5)";
      ctx.fillText("© SathyadarshanaAI", canvas.width - 500, canvas.height - 50);

      const imgData = canvas.toDataURL('image/png');
      document.getElementById('capturedImg').src = imgData;
      document.getElementById('previewModal').style.display = 'flex';

      // Auto-save for DB (Seed Engine placeholder)
      console.log("Saved to DB (NIC) – Pending integration");
    };

    document.getElementById('saveBtn').onclick = () => {
      const link = document.createElement('a');
      link.href = document.getElementById('capturedImg').src;
      link.download = `AuraScan_${Date.now()}.png`;
      link.click();
    };

    document.getElementById('closeBtn').onclick = () => {
      document.getElementById('previewModal').style.display = 'none';
    };

    // Security: Disable right-click & dev tools
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => { if (e.ctrlKey || e.key === 'F12') e.preventDefault(); });
  </script>
</body>
</html>
