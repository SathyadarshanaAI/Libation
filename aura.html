   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Energy Scanner | Demo</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #0ff;
    }
    video, canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #controls {
      position: fixed;
      bottom: 10px; width: 100%;
      display: flex; justify-content: center; gap: 12px;
      z-index: 5;
    }
    button {
      background: linear-gradient(90deg, #38bdf8, #16f0a7);
      color: #000; font-weight: bold;
      border: none; border-radius: 8px;
      padding: 10px 16px; cursor: pointer;
    }
    #resultOverlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      display: none; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 10; text-align: center; padding: 1em;
    }
    #resultImg {
      max-width: 80%; max-height: 50%;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 35px rgba(56,189,248,0.6);
      margin-bottom: 1em;
    }
    .aura-glow { animation: pulse 2.5s infinite alternate; }
    @keyframes pulse {
      from { box-shadow: 0 0 30px rgba(56,189,248,0.3); }
      to { box-shadow: 0 0 60px rgba(23,240,167,0.8); }
    }
    .coming-soon {
      margin-top: 1em;
      color: #f87171;
      font-size: 1.1em;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <video id="camera" autoplay playsinline></video>
  <canvas id="snapshot" style="display:none;"></canvas>

  <div id="controls">
    <button id="captureBtn">Capture Aura</button>
    <button id="closeBtn" style="display:none;">Close</button>
  </div>

  <div id="resultOverlay">
    <img id="resultImg" class="aura-glow" alt="Aura Snapshot">
    <div id="auraText"></div>
    <div class="coming-soon">Full AI-powered aura analysis is coming soon via Seed Engine Lab.</div>
    <button onclick="closeResult()">Close</button>
  </div>

  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('snapshot');
    const captureBtn = document.getElementById('captureBtn');
    const resultOverlay = document.getElementById('resultOverlay');
    const resultImg = document.getElementById('resultImg');
    const auraText = document.getElementById('auraText');

    let stream;

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = stream;
    }

    function capturePhoto() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const pixels = imgData.data;

      let red=0,green=0,blue=0,total=0;
      for(let i=0;i<pixels.length;i+=4){
        red+=pixels[i]; green+=pixels[i+1]; blue+=pixels[i+2]; total++;
      }
      red/=total; green/=total; blue/=total;

      let auraColor = red>green && red>blue ? "Red – Vitality (Root Chakra)" :
                      green>red && green>blue ? "Green – Balance (Heart Chakra)" :
                      "Blue – Calm (Throat Chakra)";

      resultImg.src = canvas.toDataURL('image/png');
      auraText.innerHTML = `<strong>Dominant Aura:</strong> ${auraColor}`;
      resultOverlay.style.display = "flex";
    }

    function closeResult() {
      resultOverlay.style.display = "none";
    }

    captureBtn.onclick = capturePhoto;
    startCamera();
  </script>
</body>
</html>
