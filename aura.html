<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura & Full Body Scanner | Sathyadarshana Seed Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #e0f2fe;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #overlayGlow {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 60%, #7dd3fc55 0%, #16f0a755 35%, transparent 90%);
      mix-blend-mode: lighten;
      animation: auraPulse 4s infinite alternate;
      pointer-events: none;
      z-index: 2;
    }
    @keyframes auraPulse {
      from { opacity: .5; filter: blur(3px);}
      to { opacity: .9; filter: blur(5px);}
    }
    #controls {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 10px 18px;
      background: linear-gradient(90deg, #38bdf8, #16f0a7);
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 0 15px #38bdf888;
    }
    button:hover {
      background: linear-gradient(90deg, #16f0a7, #38bdf8);
      transform: scale(1.05);
    }
    .result-box {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.9);
      padding: 1.5em;
      border-radius: 1em;
      box-shadow: 0 0 22px #38bdf822;
      color: #f1f5f9;
      display: none;
      z-index: 4;
      max-width: 90%;
    }
    .result-title { 
      color: #16f0a7; 
      font-size: 1.2em; 
      font-weight: bold;
      margin-bottom: 0.6em;
      text-shadow: 0 0 6px #16f0a799;
    }
    img { max-width: 100%; border-radius: 1em; margin-top: 0.5em; }
  </style>
</head>
<body>
  <video id="camera" autoplay playsinline></video>
  <div id="overlayGlow"></div>

  <div id="controls">
    <button id="switchCam">Switch Camera</button>
    <button id="toggleFlash">Flash On</button>
    <button id="captureBody">Capture Full Body</button>
    <button id="captureFace">Capture Face</button>
    <button id="reset">Reset</button>
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-title">Scan Result</div>
    <img id="scanImg" alt="Captured Frame"/>
    <div id="resultDetails"></div>
  </div>

  <script>
    let stream, track, flashOn = false, useFront = false;
    const video = document.getElementById('camera');
    const resultBox = document.getElementById('resultBox');
    const scanImg = document.getElementById('scanImg');
    const resultDetails = document.getElementById('resultDetails');

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: useFront ? 'user' : 'environment' }, audio: false
      });
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
    }

    function capture(mode) {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Aura glow overlay effect on capture
      ctx.globalAlpha = 0.5;
      const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 60, canvas.width/2, canvas.height/2, canvas.width/1.2);
      grad.addColorStop(0, '#7dd3fc88');
      grad.addColorStop(0.4, '#16f0a799');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const imgData = canvas.toDataURL('image/png');
      scanImg.src = imgData;
      resultBox.style.display = "block";

      // Demo seed engine result (future: NIC + DB integration)
      const label = mode === 'body' ? 'Full Body' : 'Face';
      resultDetails.innerHTML = `
        <strong>Scan Type:</strong> ${label}<br>
        <strong>Aura Colors:</strong> <span style="color:#38bdf8">Blue, Green</span><br>
        <strong>Chakra Focus:</strong> <span style="color:#16f0a7">Heart</span><br>
        <em>Saved to Seed Engine under your NIC ID (coming soon).</em>
      `;
    }

    document.getElementById('switchCam').onclick = () => {
      useFront = !useFront;
      startCamera();
    };

    document.getElementById('toggleFlash').onclick = async () => {
      if (!track) return;
      const caps = track.getCapabilities();
      if (caps.torch) {
        flashOn = !flashOn;
        await track.applyConstraints({ advanced: [{ torch: flashOn }] });
        document.getElementById('toggleFlash').textContent = flashOn ? 'Flash Off' : 'Flash On';
      } else {
        alert('Flash not supported on this device.');
      }
    };

    document.getElementById('captureBody').onclick = () => capture('body');
    document.getElementById('captureFace').onclick = () => capture('face');

    document.getElementById('reset').onclick = () => {
      resultBox.style.display = "none";
      scanImg.src = "";
      resultDetails.innerHTML = "";
    };

    // Anti-Copy & Lockdown Protection
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (['F12', 'I', 'J', 'C', 'U'].includes(e.key) && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        freezeSession();
      }
    });

    function freezeSession() {
      document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:40vh;'>Unauthorized Action Detected!<br>Session Locked.</h1>";
      setTimeout(() => location.reload(), 8000);
    }

    startCamera();
  </script>
</body>
</html>
