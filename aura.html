<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {

    p {

    #scanner {
      margin-top: 2em;
      width: 340px;
      height: 260px;
      border: 2.2px solid #38bdf8;
      border-radius: 1.2em;
      background: #0f172a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0;
    }
    #video {
      width: 100%;
      height: auto;

    }
    #aura-events: none;
      background: radial-gradient(circle at 50% 60%, #7dd3fc44 0%, #16f0a799 40%, transparent 90%);
      mix-blend-mode: lighten;
      animation: auraPulse 4s infinite alternate;
      z-index: 2;
    }
    @keyframes auraPulse {
      from { opacity: .62; }
      to { opacity: 1; filter: blur(3px);}
    }
    .btn-group {
      margin-top: 1.5em;
      display: flex;
      justify-content: center;
      gap: 1.1em;
      flex-wrap: wrap;
    }
    button {
      padding: 0.8em 1.6em;
      border: none;
      border-radius: 0.52em;
      background: linear-gradient(90deg, #38bdf8 30%, #16f0a7 80%);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      transition: 0.25s;
      box-shadow: 0 0 12px #38bdf888;

    }
    button:hover {
      background: linear-gradient(90deg, #16f0a7 30%, #38bdf8 80%);

    }
    .result-box {
      margin-top: 2em;
      background: rgba(15, 23, 42, 0.92);
      padding: 1.5em 1.2em;
      border-radius: 1.2em;
      max-width: 540px;
      color: #f1f5f9;
      line-height: 1.68;
      display: none;
      box-shadow: 0 0 22px #38bdf822;
      font-size: 1.09em;
      position: relative;
      animation: fadeIn .9s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform scale(.97);}
      to { opacity: 1; transform: scale(1);}
    }
    .result-title {
      color: #16f0a7;
      font-size: 1.15em;
      font-weight: 700;
      margin-bottom: 0.6em;
      letter-spacing:;

      margin-top: 1.5em;

      color: #38bdf8;
      opacity: .86;
    }
    .scan-img {
      display: block;
      margin: 1.1em auto 0.8em (max-width: 460px) {
      #scanner { width: 98vw; }
      .result-box { max-width: 99vw; }
    }
  </style>
</head>
<body>
  <h1>Aura Energy Scanner</h1>
  <p>
    Face the camera and allowspan style="color:#16f0a7">Final release will include real-time chakra and aura mapping.</span>
  </p>
  <div id="scanner">
    <video id="video" autoplay playsinline></video>
    <div id="auraGlow"></div>
  </div>
  <div" disabled>Capture Aura</button>
    <button id="resetBtn" disabled>Reset</button>
  </div>
  <div class="result-box" id="resultBox">
    <div class="result-title">Aura Scan Result</div>
    <img id="scanImg" class="scan-img"resultDetails"></div>
    <div class="tips">Note: This demo provides simulated aura reading. Final version will analyze colors, chakras & vibrational energy in real time.</div>
  </div>
  <script>
    const video = document.getElementById('video');
    const auraGlow = document.getElementById('auraGlow');
    const startScanBtn = document.getElementById('startScan');
    const captureBtn = document.getElementById('captureBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultBox = document.getElementById('resultBox');
    const scanImg = document.getElementById('scanImg');
    const resultDetails = document.getElementById('resultDetails');
    let stream = null;

    startScanBtn.onclick = async () => {
      if (stream) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        captureBtn.disabled = false;
        resetBtn.disabled = false;
        startScanBtn.disabled = true;
      } catch (err) {
        alert("Camera access denied or not available!");
      }
    };

    captureBtn.onclick = () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 340;
      canvas.height = video.videoHeight || 260;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Add simulated aura glow effect
      ctx.globalAlpha = 0.5;
      const grad = ctx.createRadialGradient(
        canvas.width/2, canvas.height/2, 40,
        canvas.width/2, canvas.height/2, canvas.width/2
      );
      grad.addColorStop(0, '#7dd3fc88');
      grad.addColorStop(0.4, '#16f0a799');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(canvas.width/2, canvas.height/2, canvas.width/2-12, 0, Math.PI*2);
      ctx.fill();

      const dataURL = canvas.toDataURL('image/png');
      scanImg.src = dataURL;
      scanImg.style.display = "block";
      showAuraResult(dataURL);
    };

    resetBtn.onclick = () => {
      scanImg.src = "";
      scanImg.style.display = "none";
      resultDetails.innerHTML = "";
      resultBox.style.display = "none";
      captureBtn.disabled = false;
    };

    function showAuraResult(imgSrc) {
      resultBox.style.display = "block";
      // Demo aura color reading (future: AI/ML backend)
      const demoColors = ["Blue", "Green", "Aqua"];
      const demoChakra = "Heart & Throat";
      const demoMeaning = "Calm, healing, communicative, balanced energy.";
      const demoResult = `
        <strong>Aura Colors Detected:</strong> <span style="color:#38bdf8;font-weight:700">${demoColors.join(', ')}</span><br>
        <strong>Dominant Chakra:</strong> <span style="color:#16f0a7">${demoChakra}</span><br>
        <strong>Meaning:</strong> <em>${demoMeaning}</em><br>
        <hr>
        <span style="color:#38bdf8">For a full reading, upgrade to AI-powered aura module (coming soon).</span>
      `;
      resultDetails.innerHTML = demoResult;
    }
  </script>
</body>
</html>
