<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Scanner</title>
    <!-- (Original CSS and JS links or styles, if any, remain unchanged) -->
</head>
<body>

    <h1>Aura Scanner</h1>

    <p>Please select an image to scan your aura.</p>

    <!-- File input and action buttons -->
    <input type="file" id="imageInput" accept="image/*" hidden />
    <label for="imageInput">Choose Image</label>
    <button id="scanButton">Scan</button>
    <button id="demoButton">Demo Data</button>

    <!-- Image preview section -->
    <div id="previewSection">
        <!-- The selected image will be displayed here -->
        <img id="imagePreview" src="" alt="Image Preview" style="display:none; max-width: 100%; height: auto;" />
    </div>

    <!-- Results section -->
    <div id="resultsSection">
        <h2>Results</h2>
        <p id="resultText">Your aura color is Blue. This indicates a calm and peaceful nature.</p>
    </div>

    <!-- JavaScript logic (unchanged except for translated text) -->
    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const resultText = document.getElementById('resultText');

        // Show selected image preview
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Scan button click event
        document.getElementById('scanButton').addEventListener('click', function() {
            if (!imageInput.value) {
                alert("Please select an image first.");
                return;
            }
            // (Scanning logic would go here; using demo data for now)
            resultText.textContent = "Your aura color is Blue. This indicates a calm and peaceful nature.";
        });

        // Demo data button click event
        document.getElementById('demoButton').addEventListener('click', function() {
            // (Load or simulate demo data results)
            imageInput.value = "";  // clear any selected file
            imagePreview.style.display = 'none';  // hide any previous image preview
            resultText.textContent = "Your aura color is Blue. This indicates a calm and peaceful nature.";
        });
    </script>

</body>
</html>
