<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Scanner - Sinhala</title>
  <!-- Load modern fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Inter', 'Zen Maru Gothic', 'Noto Sans Sinhala', sans-serif;
      overflow: hidden;
    }
    #cameraContainer {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    #cameraFeed {
      display: none;
    }
    #captureCanvas {
      display: none;
    }
    #controlsTop, #controlsBottom {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 2;
    }
    #controlsTop {
      top: 10px;
    }
    #controlsBottom {
      bottom: 15px;
    }
    button {
      font-size: 1rem;
      padding: 10px 15px;
      border: 2px solid #0ff;
      background: rgba(0,0,0,0.3);
      color: #0ff;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 8px #00ffff88, 0 0 16px #00ffff44;
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.95);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    #resultText {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      background: rgba(0,0,0,0.6);
      font-size: 1.1rem;
      line-height: 1.5;
      display: none;
      z-index: 2;
      text-shadow: 0 0 5px #fff;
    }
  </style>
</head>
<body>
  <div id="cameraContainer">
    <video id="cameraFeed" autoplay playsinline></video>
    <canvas id="captureCanvas"></canvas>
    <div id="controlsTop">
      <button id="btnStart">කැමරාව ආරම්භ කරන්න</button>
      <button id="btnSwitch" disabled>කැමරාව මාරු කරන්න</button>
      <button id="btnReset" disabled>යලි සකසන්න</button>
    </div>
    <div id="controlsBottom">
      <button id="btnCaptureBody" disabled>සම්පූර්ණ ශරීර රූපය ගන්න</button>
      <button id="btnCaptureFace" disabled>මුහුණ රූපය ගන්න</button>
    </div>
    <div id="resultText"></div>
  </div>
  <script>
    const video = document.getElementById('cameraFeed');
    const canvas = document.getElementById('captureCanvas');
    const ctx = canvas.getContext('2d');
    const btnStart = document.getElementById('btnStart');
    const btnSwitch = document.getElementById('btnSwitch');
    const btnCaptureBody = document.getElementById('btnCaptureBody');
    const btnCaptureFace = document.getElementById('btnCaptureFace');
    const btnReset = document.getElementById('btnReset');
    const resultDiv = document.getElementById('resultText');
    let currentStream = null;
    let currentFacing = 'user'; // default to front camera
    
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing } });
        currentStream = stream;
        video.srcObject = stream;
        video.style.display = 'block';
        btnSwitch.disabled = false;
        btnCaptureBody.disabled = false;
        btnCaptureFace.disabled = false;
        btnStart.disabled = true;
      } catch(err) {
        alert('කැමරාවට ප්‍රවේශ වීම අසාර්ථක විය: ' + err.message);
        console.error('Camera start error:', err);
      }
    }
    
    async function switchCamera() {
      currentFacing = (currentFacing === 'user') ? 'environment' : 'user';
      await startCamera();
    }
    
    function capturePhoto(mode) {
      if (!currentStream) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let resultHTML = '';
      if (mode === 'face') {
        resultHTML = 'මුහුණේ සහ හිසේ අවට <span style="color:#0ff">නිල්</span> පැහැති ඕරා දිස් වේ. ' +
                     'එය විශුද්ධ චක්‍රය සමඟ සම්බන්ධ වන අතර, ඔබේ සන්නිවේදනය සහ අවංකතාව පෙන්වයි.';
        ctx.save();
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = 'rgba(0, 255, 255, 0.7)';
        ctx.shadowBlur = 50;
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height*0.35, canvas.width * 0.15, 0, 2*Math.PI);
        ctx.fill();
        ctx.restore();
      } else {
        resultHTML = 'හිස අවට <span style="color:#f0f">දම්</span> පැහැති ඕරා දිස් වේ. ' +
                     'එය සහස්‍රාර චක්‍රය සමඟ සම්බන්ධ වන අතර, ඔබේ ආධ්‍යාත්මිකත්වය සහ ප්‍රඥාව පෙන්වයි. ' +
                     'තවද, හදවත අවට <span style="color:#0f0">කොළ</span> පැහැති ඕරා දිස් වේ. ' +
                     'එය අනාහත චක්‍රය සමඟ සම්බන්ධ වන අතර, ඔබේ ප්‍රේමය සහ කරුණාව පෙන්වයි.';
        ctx.save();
        ctx.fillStyle = '#ff00ff';
        ctx.shadowColor = 'rgba(255, 0, 255, 0.7)';
        ctx.shadowBlur = 60;
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height*0.15, canvas.width * 0.1, 0, 2*Math.PI);
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.fillStyle = '#00ff00';
        ctx.shadowColor = 'rgba(0, 255, 0, 0.7)';
        ctx.shadowBlur = 60;
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height*0.4, canvas.width * 0.15, 0, 2*Math.PI);
        ctx.fill();
        ctx.restore();
      }
      video.style.display = 'none';
      canvas.style.display = 'block';
      resultDiv.innerHTML = resultHTML;
      resultDiv.style.display = 'block';
      btnCaptureBody.disabled = true;
      btnCaptureFace.disabled = true;
      btnSwitch.disabled = true;
      btnReset.disabled = false;
    }
    
    function resetScanner() {
      resultDiv.style.display = 'none';
      resultDiv.innerHTML = '';
      canvas.style.display = 'none';
      video.style.display = 'block';
      btnCaptureBody.disabled = false;
      btnCaptureFace.disabled = false;
      btnSwitch.disabled = false;
      btnReset.disabled = true;
    }
    
    btnStart.addEventListener('click', startCamera);
    btnSwitch.addEventListener('click', switchCamera);
    btnCaptureBody.addEventListener('click', () => capturePhoto('body'));
    btnCaptureFace.addEventListener('click', () => capturePhoto('face'));
    btnReset.addEventListener('click', resetScanner);
  </script>
</body>
</html>
