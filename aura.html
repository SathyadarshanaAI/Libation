<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aura Scanner</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      /* Disable text selection for copy-protection */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    #camera-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    #camera-container video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    /* Overlay guide styles */
    .overlay-lines {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px dashed rgba(255, 255, 255, 0.5);
      z-index: 2;
    }
    #overlay-face {
      width: 30vw;
      height: 30vw;
      border-radius: 50%;
      display: none;
    }
    #overlay-body {
      width: 60vw;
      height: 80vh;
      display: none;
    }
    /* Watermark text */
    #watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 5rem;
      font-weight: bold;
      color: #fff;
      opacity: 0.05;
      z-index: 1;
      pointer-events: none;
    }
    /* Control buttons container */
    #controls {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      z-index: 3;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    #controls button {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid #0ff;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
    #controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* Footer copyright text */
    #footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      background: rgba(0, 0, 0, 0.5);
      z-index: 3;
      padding: 2px 0;
    }
    /* Glowing text effect (for headings and result text) */
    .glow {
      text-shadow: 
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 30px #0ff,
        0 0 40px #0ff,
        0 0 50px #0ff,
        0 0 60px #0ff,
        0 0 70px #0ff;
      animation: neon-glow 1.5s ease-in-out infinite alternate;
    }
    @keyframes neon-glow {
      from {
        text-shadow: 
          0 0 5px #fff,
          0 0 10px #0ff,
          0 0 20px #0ff,
          0 0 30px #0ff,
          0 0 40px #0ff,
          0 0 50px #0ff,
          0 0 60px #0ff;
      }
      to {
        text-shadow: 
          0 0 10px #fff,
          0 0 20px #0ff,
          0 0 30px #0ff,
          0 0 40px #0ff,
          0 0 50px #0ff,
          0 0 60px #0ff,
          0 0 80px #0ff;
      }
    }
    /* Result overlay modal */
    #result {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      text-align: center;
      color: #fff;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }
    #result img {
      max-width: 80%;
      height: auto;
      border: 2px solid #fff;
      margin-bottom: 10px;
    }
    #closeResult {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid #fff;
      font-size: 1.2rem;
      border-radius: 3px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body oncontextmenu="return false">
  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div id="overlay-face" class="overlay-lines"></div>
    <div id="overlay-body" class="overlay-lines"></div>
    <div id="watermark">SATHYADARSHANA</div>
    <div id="controls">
      <button id="startBtn">Start Camera</button>
      <button id="switchBtn" disabled>Switch Camera</button>
      <button id="flashBtn" disabled>Flash</button>
      <button id="guideBtn">Face/Body Guide</button>
      <button id="captureBtn" disabled>Capture Aura</button>
    </div>
    <div id="footer">© 2025 Sathyadarshana Seed Engine</div>
    <!-- Result overlay (hidden until capture) -->
    <div id="result">
      <button id="closeResult">X</button>
      <h2 id="result-heading" class="glow">Aura Analysis Results</h2>
      <img id="result-img" src="" alt="Captured Aura" />
      <div id="result-text" class="glow"></div>
    </div>
  </div>
  <script>
    const videoElem = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const switchBtn = document.getElementById('switchBtn');
    const flashBtn = document.getElementById('flashBtn');
    const guideBtn = document.getElementById('guideBtn');
    const captureBtn = document.getElementById('captureBtn');
    const overlayFace = document.getElementById('overlay-face');
    const overlayBody = document.getElementById('overlay-body');
    const resultOverlay = document.getElementById('result');
    const resultImg = document.getElementById('result-img');
    const resultText = document.getElementById('result-text');
    const closeResultBtn = document.getElementById('closeResult');
    let currentStream = null;
    let currentFacingMode = 'environment';
    let torchOn = false;
    let showingFaceGuide = false;
    // Toggle face/body guide overlay
    guideBtn.addEventListener('click', () => {
      showingFaceGuide = !showingFaceGuide;
      if (showingFaceGuide) {
        overlayFace.style.display = 'block';
        overlayBody.style.display = 'none';
      } else {
        overlayFace.style.display = 'none';
        overlayBody.style.display = 'block';
      }
    });
    // Start camera stream
    startBtn.addEventListener('click', () => {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } })
        .then(stream => {
          currentStream = stream;
          videoElem.srcObject = stream;
          // Show full-body guide by default
          overlayBody.style.display = 'block';
          captureBtn.disabled = false;
          // Enable switch if multiple cameras
          navigator.mediaDevices.enumerateDevices().then(devices => {
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            if (videoDevices.length > 1) {
              switchBtn.disabled = false;
            }
          });
          // Enable flash if torch available
          const track = stream.getVideoTracks()[0];
          const capabilities = track.getCapabilities();
          if (capabilities.torch) {
            flashBtn.disabled = false;
          }
        })
        .catch(err => {
          console.error('Camera start failed:', err);
          alert('Unable to access camera: ' + err.message);
        });
    });
    // Switch front/back camera
    switchBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } })
        .then(stream => {
          currentStream = stream;
          videoElem.srcObject = stream;
          // Reset torch state on camera switch
          torchOn = false;
          flashBtn.disabled = true;
          // Check new camera's torch capability
          const track = stream.getVideoTracks()[0];
          const capabilities = track.getCapabilities();
          if (capabilities.torch) {
            flashBtn.disabled = false;
          }
        })
        .catch(err => {
          console.error('Camera switch failed:', err);
          alert('Unable to switch camera: ' + err.message);
        });
    });
    // Toggle flashlight on/off
    flashBtn.addEventListener('click', () => {
      const track = currentStream.getVideoTracks()[0];
      torchOn = !torchOn;
      track.applyConstraints({ advanced: [{ torch: torchOn }] })
        .catch(err => console.error('Torch toggle failed:', err));
    });
    // Capture aura image
    captureBtn.addEventListener('click', () => {
      // Draw current video frame to a canvas
      const canvas = document.createElement('canvas');
      canvas.width = videoElem.videoWidth;
      canvas.height = videoElem.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
      // Convert to image and display
      const dataURL = canvas.toDataURL('image/png');
      resultImg.src = dataURL;
      // Demo aura analysis text (colors, chakras, meanings)
      resultText.innerHTML = 'නීල වර්ණය (කණ්ඨ චක්‍රය - සන්නිවේදනය), <br>කොළ වර්ණය (හෘදය චක්‍රය - කරුණාව)';
      // Show result overlay
      resultOverlay.style.display = 'flex';
      // Turn off torch if it was on (to save battery/ not blind user)
      if (torchOn) {
        flashBtn.click();
      }
    });
    // Close result and resume camera view
    closeResultBtn.addEventListener('click', () => {
      resultOverlay.style.display = 'none';
    });
    // Basic prevention of copy/inspect shortcuts
    document.addEventListener('keydown', (e) => {
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
        (e.ctrlKey && e.keyCode === 85)
      ) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
