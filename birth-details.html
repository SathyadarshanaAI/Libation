<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birth Details – Satellite Map | Sathyadarshana</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 25% 20%, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2em;
      min-height: 100vh;
    }
    h1 {
      color: #7dd3fc;
      margin-bottom: 1em;
      font-size: 2.3em;
    }
    #map {
      width: 90%;
      height: 420px;
      border-radius: 1em;
      margin-top: 1.5em;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
    }
    .form-box {
      background: rgba(2, 6, 23, 0.90);
      padding: 1.5em;
      border-radius: 1em;
      max-width: 480px;
      width: 100%;
      text-align: left;
      margin-bottom: 1em;
      box-shadow: 0 0 20px rgba(125, 211, 252, 0.3);
    }
    label {
      display: block;
      margin-top: 1em;
      color: #c7d2fe;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.3em;
      border: none;
      border-radius: 0.5em;
      background: #1e293b;
      color: #e0f2fe;
      font-size: 1em;
    }
    .btn-row {
      display: flex;
      gap: 0.6em;
      margin-top: 1.5em;
    }
    button {
      flex: 1;
      min-width: 120px;
      padding: 0.8em 1.2em;
      border: none;
      border-radius: 0.5em;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1em;
    }
    button:hover {
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
    }
    .info-box {
      max-width: 600px;
      margin: 1em auto;
      padding: 1em;
      background: rgba(30,41,59,0.85);
      border-radius: 1em;
      color: #e0f2fe;
      text-align: left;
      font-size: 1.09em;
      line-height: 1.7;
      display: none;
    }
    @media(max-width:700px){
      #map{height:260px;}
      .info-box {padding:1em;}
    }
  </style>
</head>
<body>
  <h1>Birth Details – Satellite Map</h1>
  <form id="birthForm" class="form-box">
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" name="fullName" required>

    <label for="gender">Gender:</label>
    <select id="gender" name="gender" required>
      <option value="">Select</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="nic">NIC (optional):</label>
    <input type="text" id="nic" name="nic">

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required>

    <label for="birthTime">Time of Birth:</label>
    <input type="time" id="birthTime" name="birthTime" required>

    <label for="birthPlace">Place of Birth (City, Country):</label>
    <input type="text" id="birthPlace" name="birthPlace" placeholder="e.g., Colombo, Sri Lanka" required>

    <input type="hidden" id="latitude" name="latitude">
    <input type="hidden" id="longitude" name="longitude">

    <div class="btn-row">
      <button type="button" id="searchBtn">Show Map</button>
      <button type="submit">Continue</button>
    </div>
  </form>

  <div id="infoBox" class="info-box"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Mapbox Token (replace with your key!)
    const mapboxToken = "YOUR_MAPBOX_TOKEN";
    const map = L.map('map').setView([7.8731, 80.7718], 6);
    L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/satellite-v9/tiles/{z}/{x}/{y}?access_token=${mapboxToken}`, {
      tileSize: 512,
      zoomOffset: -1,
      attribution: '&copy; <a href="https://www.mapbox.com/">Mapbox</a>'
    }).addTo(map);
    let marker;

    document.getElementById('searchBtn').addEventListener('click', () => {
      const place = document.getElementById('birthPlace').value.trim();
      if (!place) return alert("Please enter your city or area.");
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            map.setView([lat, lon], 13);
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map)
              .bindPopup(`<b>${place}</b><br>Coordinates: ${lat.toFixed(4)}, ${lon.toFixed(4)}`)
              .openPopup();
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lon;
            document.getElementById('infoBox').style.display = 'block';
            document.getElementById('infoBox').innerHTML = `
              <strong>Location:</strong> ${place}<br>
              <strong>Latitude:</strong> ${lat.toFixed(4)}<br>
              <strong>Longitude:</strong> ${lon.toFixed(4)}
            `;
          } else {
            alert("Location not found.");
            document.getElementById('infoBox').style.display = 'none';
          }
        })
        .catch(() => alert("Connection or API error."));
    });

    document.getElementById('birthForm').addEventListener('submit', function(e){
      e.preventDefault();
      // Gather all data
      const payload = {
        name: document.getElementById('fullName').value,
        gender: document.getElementById('gender').value,
        nic: document.getElementById('nic').value,
        dob: document.getElementById('dob').value,
        time: document.getElementById('birthTime').value,
        place: document.getElementById('birthPlace').value,
        latitude: document.getElementById('latitude').value,
        longitude: document.getElementById('longitude').value
      };
      if(!payload.latitude || !payload.longitude){
        alert("Please select your place on the map.");
        return;
      }
      // TODO: Replace with your backend API endpoint
      fetch('/api/birth-details', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert('Birth details submitted successfully! The astrology chart will be generated.');
        // Next steps or redirect
      })
      .catch(() => alert('Error submitting details.'));
    });
  </script>
</body>
</html>
