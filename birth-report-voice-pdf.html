<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KP Voice Summary + PDF Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px #38bdf8;
      width: 100%;
      max-width: 600px;
    }

    h2 {
      color: #38bdf8;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      background-color: #0ea5e9;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #000;
      transition: 0.2s;
    }

    button:hover {
      background-color: #38bdf8;
    }

    #audioPlayer {
      margin-top: 20px;
      width: 100%;
    }

    .watermark {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="card" id="report">
    <h2>🗣️ KP Voice Summary + PDF Generator</h2>
    <textarea id="summary" placeholder="Enter astrology result or voice summary..."></textarea>
    <button onclick="playVoice()">🔊 Play Voice</button>
    <button onclick="downloadPDF()">📄 Download PDF</button>
    <audio id="audioPlayer" controls hidden></audio>
    <div class="watermark">© Sathyadarshana | Light of Truth</div>
  </div>

  <script>
    function playVoice() {
      const text = document.getElementById("summary").value.trim();
      if (!text) {
        alert("Please enter some text for voice summary.");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      speechSynthesis.speak(utterance);
    }

    function downloadPDF() {
      const element = document.getElementById("report");
      const opt = {
        margin: 0.5,
        filename: 'voice-summary-report.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().from(element).set(opt).save();
    }
  </script>
</body>
</html>
