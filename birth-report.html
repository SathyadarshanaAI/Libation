<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birth Details Form</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 2em;}
    form { max-width: 400px; margin: auto; background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px #ddd;}
    label { display: block; margin-top: 1em;}
    input, select { width: 100%; padding: 8px; margin-top: 4px;}
    button { margin-top: 1.5em; padding: 10px 20px; background: #1976d2; color: #fff; border: none; border-radius: 4px;}
    #reportBox { max-width: 400px; margin: 2em auto; background: #e3f2fd; padding: 1em; border-radius: 8px;}
  </style>
</head>
<body>
  <h2>Birth Details Form</h2>
  <form id="birthForm">
    <label>Name: <input type="text" name="name" required></label>
    <label>Date of Birth: <input type="date" name="dob" required></label>
    <label>Time of Birth: <input type="time" name="tob"></label>
    <label>Place of Birth: <input type="text" name="pob"></label>
    <label>Gender: 
      <select name="gender" required>
        <option value="">Select</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </label>
    <button type="submit">Get Report</button>
  </form>

  <div id="reportBox"></div>

  <script>
    const birthForm = document.getElementById('birthForm');
    const reportBox = document.getElementById('reportBox');

    birthForm.addEventListener("submit", function(e){
      e.preventDefault();
      const data = {
        name: birthForm.name.value.trim(),
        dob: birthForm.dob.value,
        tob: birthForm.tob.value,
        pob: birthForm.pob.value.trim(),
        gender: birthForm.gender.value
      };

      reportBox.innerHTML = "Generating report...";

      fetch('/api/birth-report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(report => {
        reportBox.innerHTML = `
          <h3>Birth Report</h3>
          <strong>Name:</strong> ${report.name}<br>
          <strong>Date of Birth:</strong> ${report.dob}<br>
          <strong>Time of Birth:</strong> ${report.tob}<br>
          <strong>Place of Birth:</strong> ${report.pob}<br>
          <strong>Gender:</strong> ${report.gender}<br>
          <strong>Lucky Numbers:</strong> ${report.luckyNumbers ? report.luckyNumbers.join(', ') : ''}<br>
          <strong>Element:</strong> ${report.element || ''}<br>
          <strong>Advice:</strong> ${report.advice || ''}
        `;
      })
      .catch(err => {
        reportBox.innerHTML = "An error occurred while retrieving the report!";
      });
    });
  </script>
</body>
</html>
