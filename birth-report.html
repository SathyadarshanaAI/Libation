<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <title>ජන්ම විස්තර පෝරමය</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 2em;}
    form { max-width: 400px; margin: auto; background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px #ddd;}
    label { display: block; margin-top: 1em;}
    input, select { width: 100%; padding: 8px; margin-top: 4px;}
    button { margin-top: 1.5em; padding: 10px 20px; background: #1976d2; color: #fff; border: none; border-radius: 4px;}
    #reportBox { max-width: 400px; margin: 2em auto; background: #e3f2fd; padding: 1em; border-radius: 8px;}
  </style>
</head>
<body>
  <h2>ජන්ම විස්තර පෝරමය</h2>
  <form id="birthForm">
    <label>නම: <input type="text" name="name" required></label>
    <label>උපන් දිනය: <input type="date" name="dob" required></label>
    <label>උපන් වේලාව: <input type="time" name="tob"></label>
    <label>උපන් ස්ථානය: <input type="text" name="pob"></label>
    <label>ස්ත්‍රී/පුරුෂ: 
      <select name="gender" required>
        <option value="">තෝරන්න</option>
        <option value="male">පුරුෂ</option>
        <option value="female">ස්ත්‍රී</option>
        <option value="other">වෙනත්</option>
      </select>
    </label>
    <button type="submit">වාර්තාව ලබාගන්න</button>
  </form>

  <div id="reportBox"></div>

  <script>
    const birthForm = document.getElementById('birthForm');
    const reportBox = document.getElementById('reportBox');

    birthForm.addEventListener("submit", function(e){
      e.preventDefault();
      const data = {
        name: birthForm.name.value.trim(),
        dob: birthForm.dob.value,
        tob: birthForm.tob.value,
        pob: birthForm.pob.value.trim(),
        gender: birthForm.gender.value
      };

      reportBox.innerHTML = "වාර්තාව සකසාගෙන යයි...";

      fetch('/api/birth-report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(report => {
        reportBox.innerHTML = `
          <h3>ජන්ම වාර්තාව</h3>
          <strong>නම:</strong> ${report.name}<br>
          <strong>උපන් දිනය:</strong> ${report.dob}<br>
          <strong>උපන් වේලාව:</strong> ${report.tob}<br>
          <strong>උපන් ස්ථානය:</strong> ${report.pob}<br>
          <strong>ස්ත්‍රී/පුරුෂ:</strong> ${report.gender}<br>
          <strong>උදාසුන ලක්ෂ්‍ය:</strong> ${report.luckyNumbers ? report.luckyNumbers.join(', ') : ''}<br>
          <strong>අංශය:</strong> ${report.element || ''}<br>
          <strong>උපදෙස්:</strong> ${report.advice || ''}
        `;
      })
      .catch(err => {
        reportBox.innerHTML = "වාර්තාව ලබාගැනීමේ දෝෂයක් ඇතිවිය!";
      });
    });
  </script>
</body>
</html>
