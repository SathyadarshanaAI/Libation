<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birth Report | SathyadarshanaAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #000);
      color: #e0f2fe; text-align: center;
      margin: 0; padding: 1em;
    }
    h1 { color: #7dd3fc; text-shadow: 0 0 12px #38bdf8; }
    form {
      background: rgba(255,255,255,0.05);
      padding: 1em; border-radius: 1em;
      max-width: 500px; margin: 1em auto;
      backdrop-filter: blur(10px);
    }
    label { display: block; margin-top: 0.8em; }
    input, select {
      width: 100%; padding: 0.6em;
      border: none; border-radius: 0.5em; margin-top: 0.3em;
    }
    button {
      margin-top: 1em; padding: 0.8em 1.5em;
      background: linear-gradient(90deg, #38bdf8, #16f0a7);
      border: none; border-radius: 0.7em; color: #0f172a;
      font-weight: bold; cursor: pointer;
    }
    #report {
      margin-top: 1.5em; padding: 1em;
      background: rgba(30,41,59,0.7);
      border-radius: 1em; display: none;
      max-width: 700px; margin-left: auto; margin-right: auto;
    }
    .coming-soon { margin-top: 1em; color: #f87171; }
  </style>
</head>
<body>
  <h1>Birth Report</h1>
  <form id="birthForm">
    <label>Name: <input type="text" id="name" required></label>
    <label>Date of Birth: <input type="date" id="dob" required></label>
    <label>Time of Birth: <input type="time" id="time" required></label>
    <label>Place of Birth: <input type="text" id="place" placeholder="City, Country" required></label>
    <button type="submit">Generate Report</button>
  </form>

  <div id="report">
    <h2>Planetary Positions (Demo)</h2>
    <p id="planetData">Fetching planetary data...</p>
    <h3>KP Sub-Lord (Sample)</h3>
    <p>Sun: Leo (Sub-Lord Mercury)<br>Moon: Cancer (Sub-Lord Venus)</p>
    <h3>Vedic Chart (Sample)</h3>
    <p>Ascendant: Sagittarius<br>Main planets mapped by demo data.</p>
    <button onclick="downloadPDF()">Download PDF Report</button>
    <div class="coming-soon">Full AI-powered prediction coming soon via Seed Engine Lab.</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    document.getElementById('birthForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('report').style.display = 'block';
      document.getElementById('planetData').innerText = "Sun: 120° (Leo), Moon: 240° (Sagittarius) – demo ephemeris.";
    });

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("SathyadarshanaAI Birth Report (Demo)", 10, 10);
      doc.text("High Copyright © 2025", 10, 20);
      doc.text("Planetary Data (Sample): Sun 120°, Moon 240°", 10, 40);
      doc.text("Full AI-powered KP/Vedic predictions coming soon.", 10, 60);
      doc.save("BirthReport_Demo.pdf");
    }
  </script>
</body>
</html>
