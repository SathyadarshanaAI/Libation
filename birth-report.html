<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birth Report | SathyadarshanaAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 30% 20%, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
      margin: 0;
      padding: 1.5em;
    }
    h1 {
      color: #7dd3fc;
      text-shadow: 0 0 14px #38bdf8;
      font-size: 2.2em;
      margin-bottom: 1rem;
    }
    form {
      max-width: 450px;
      margin: 1.5em auto;
      background: rgba(255,255,255,0.05);
      padding: 1.5em;
      border-radius: 1.2em;
      box-shadow: 0 4px 35px rgba(0,0,0,0.5), 0 0 25px rgba(56,189,248,0.2);
    }
    label {
      display: block;
      margin-top: 1em;
      text-align: left;
      font-weight: bold;
      color: #16f0a7;
    }
    input, select {
      width: 100%;
      padding: 0.8em;
      margin-top: 0.4em;
      border-radius: 0.6em;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #e0f2fe;
      font-size: 1em;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6em;
      margin-top: 1.5em;
    }
    button {
      flex: 1;
      min-width: 120px;
      background: #38bdf8;
      color: #0f172a;
      padding: 0.9em;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 1em;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(125,211,252,0.4);
      transition: all 0.3s ease;
    }
    button:hover {
      background: #16f0a7;
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(23,240,167,0.4);
    }
    #reportBox {
      max-width: 520px;
      margin: 2em auto;
      background: rgba(22,78,99,0.7);
      padding: 1.5em;
      border-radius: 1.2em;
      box-shadow: 0 0 20px rgba(56,189,248,0.3);
      color: #fff;
      display: none;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Birth Report Generator</h1>
  <form id="birthForm">
    <label>Name <input type="text" name="name" required></label>
    <label>Date of Birth <input type="date" name="dob" required></label>
    <label>Time of Birth <input type="time" name="tob"></label>
    <label>Place of Birth <input type="text" name="pob" placeholder="City, Country"></label>
    <label>Gender
      <select name="gender" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </label>
    <div class="btn-row">
      <button type="button" id="kpBtn">KP Mode</button>
      <button type="button" id="vedicBtn">Vedic Mode</button>
      <button type="submit">Generate</button>
    </div>
  </form>

  <div id="reportBox"></div>

  <script>
    const birthForm = document.getElementById('birthForm');
    const reportBox = document.getElementById('reportBox');

    document.getElementById('kpBtn').onclick = () => alert("KP Astrology Mode Selected");
    document.getElementById('vedicBtn').onclick = () => alert("Vedic Astrology Mode Selected");

    birthForm.addEventListener("submit", function(e){
      e.preventDefault();
      const data = {
        name: birthForm.name.value.trim(),
        dob: birthForm.dob.value,
        tob: birthForm.tob.value,
        pob: birthForm.pob.value.trim(),
        gender: birthForm.gender.value
      };

      reportBox.style.display = "block";
      reportBox.innerHTML = `
        <h3>Birth Report (Preview)</h3>
        <b>Name:</b> ${data.name}<br>
        <b>Date of Birth:</b> ${data.dob}<br>
        <b>Time of Birth:</b> ${data.tob || "N/A"}<br>
        <b>Place of Birth:</b> ${data.pob || "N/A"}<br>
        <b>Gender:</b> ${data.gender}<br>
        <hr>
        <em>KP & NASA-based planetary data integration coming soon.</em>
      `;
    });
  </script>
</body>
</html>
