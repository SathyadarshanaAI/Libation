<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GeoVision | SathyadarshanaAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #000);
      color: #e0f2fe;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      margin-top: 1rem;
      font-size: 2em;
      color: #7dd3fc;
      text-shadow: 0 0 12px #38bdf8;
    }
    .glass-panel {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1.5rem;
      border-radius: 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0,0,0,0.5), 0 0 20px rgba(56,189,248,0.2);
      text-align: left;
    }
    .glass-panel h2 {
      text-align: center;
      color: #16f0a7;
      text-shadow: 0 0 8px rgba(23,240,167,0.4);
    }
    .form-box {
      max-width: 500px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: rgba(30,41,59,0.7);
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(56,189,248,0.2);
    }
    .form-box label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }
    .form-box input, .form-box select {
      width: 100%;
      padding: 0.7rem;
      border-radius: 0.5rem;
      border: none;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    .form-box button {
      background: #38bdf8;
      color: #0f172a;
      padding: 1em 2em;
      font-size: 1.1em;
      font-weight: bold;
      border: none;
      border-radius: 1em;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 0 15px rgba(125,211,252,0.4);
    }
    .form-box button:hover {
      background: #16f0a7;
      color: #0f172a;
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(23,240,167,0.4);
    }
    #map {
      width: 100%;
      max-width: 900px;
      height: 400px;
      margin: 2rem auto;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(56,189,248,0.2);
    }
    .result-box {
      max-width: 700px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: rgba(22,78,99,0.7);
      color: #fff;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(56,189,248,0.2);
      font-size: 1.05em;
    }
    footer {
      margin-top: 3rem;
      padding: 1rem;
      background: rgba(2,6,23,0.6);
      backdrop-filter: blur(10px);
      color: #d90429;
      font-weight: bold;
      font-size: 1em;
      border-top: 2px solid #38bdf8;
    }
  </style>
  <!-- Leaflet (free map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
  <h1>GeoVision</h1>

  <div class="glass-panel">
    <h2>Satellite View & Regional Insights</h2>
    <p>Enter a region below to analyze historical, cultural, and future planetary impacts.</p>
  </div>

  <div class="form-box">
    <label for="region">Region / Area</label>
    <input type="text" id="region" placeholder="Example: Anuradhapura, Monaragala" required>
    <label for="focus">Focus</label>
    <select id="focus" required>
      <option value="">-- Select --</option>
      <option value="climate">History & Climate</option>
      <option value="culture">Cultural & Historical Overview</option>
      <option value="future">Future Risks & Planetary Impacts</option>
    </select>
    <button id="analyzeBtn">Analyze</button>
  </div>

  <div id="map"></div>
  <div id="result" class="result-box"></div>

  <footer>
    © 2025 SathyadarshanaAI | Powered by Buddhi
  </footer>

  <script>
    // Initialize map (centered on Sri Lanka by default)
    const map = L.map('map').setView([7.8731, 80.7718], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Analysis logic
    document.getElementById('analyzeBtn').addEventListener('click', function() {
      const region = document.getElementById('region').value.trim();
      const focus = document.getElementById('focus').value;
      let summary = "";

      if (!region || !focus) {
        summary = "Please fill out both the region and focus fields.";
      } else if (focus === "climate") {
        summary = `Satellite and historical data for ${region}: analyzed for water sources, land structures, and climate patterns (Mahavamsa + AI).`;
      } else if (focus === "culture") {
        summary = `Cultural and historical insights for ${region} examined (Samudrika texts + AI patterns).`;
      } else if (focus === "future") {
        summary = `Future planetary alignments and climate projections for ${region} assessed (NASA & AI integration).`;
      }

      document.getElementById('result').textContent = summary;

      // Move map to region (basic geocoding using free API)
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${region}`)
        .then(res => res.json())
        .then(data => {
          if (data.length > 0) {
            const { lat, lon } = data[0];
            map.setView([lat, lon], 10);
            L.marker([lat, lon]).addTo(map).bindPopup(`${region}`).openPopup();
          }
        });
    });
  </script>
</body>
</html>
