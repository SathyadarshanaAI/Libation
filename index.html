<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KP Chart Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <nav style="margin-bottom: 1em;">
      <a href="index.html" style="margin-right:12px;">KP Chart</a>
      <a href="astrology.html">Astrology Tools</a>
    </nav>
    <h1>KP Chart Generator</h1>
    <form id="kpForm">
      <label>Name <input type="text" id="name" required></label>
      <label>Date of Birth <input type="date" id="dob" required></label>
      <label>Time of Birth <input type="time" id="tob" required></label>
      <label>Place (City) <input type="text" id="pob" required placeholder="e.g. Colombo"></label>
      <label>Time Zone <input type="text" id="timezone" required placeholder="+05:30"></label>
      <button type="submit">Generate Chart</button>
    </form>
    <div id="loading" style="display:none;">Calculating…</div>
    <div id="resultMsg"></div>
    <canvas id="astroChart" width="360" height="360"></canvas>
    <div id="planetTable"></div>
    <footer>
      <small>Powered by KP Chart Generator • 2025</smallbr>
      <a href="astrology.html">Other Astrology Tools</a>
    </footer>
  </main>
  <script src="kp-chart.js"></script>
</body>
</html>
