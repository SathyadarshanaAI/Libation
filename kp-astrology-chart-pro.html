<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KP Generator (Demo)</title>
  <style>
    body { font-family: sans-serif; }
    .box { border:1px solid #ccc;padding:8px;margin:8px 0; }
    table,th,td{border:1px solid #aaa;border-collapse:collapse;} th,td{padding:4px;}
    .pro { color: #008080; font-weight:bold;}
    .free { color: #0a0; }
  </style>
</head>
<body>
  <h2>KP ජනකය (KP Generator Demo)</h2>
  <form id="astroForm">
    ID Number: <input type="text" id="userid" required> <br>
    නම: <input type="text" id="name" required> <br>
    උපන් දිනය: <input type="date" id="date" required> <br>
    වෙලාව: <input type="time" id="time" required> <br>
    අක්ෂාංශය (lat): <input type="number" id="lat" step="0.0001" required> <br>
    දේශාංශය (lon): <input type="number" id="lon" step="0.0001" required> <br>
    Plan: 
      <select id="plan">
        <option value="free">Free (KP Chart + Short Prediction)</option>
        <option value="pro">Pro (All + Full AI Reading)</option>
      </select>
    <br>
    <button type="submit">KP Chart ගන්න</button>
  </form>
  <div id="result"></div>
  <script>
    // Demo KP Chart Engine
    const SIGNS = ["Mesha", "Vrushabha", "Mithuna", "Kataka", "Sinha", "Kanya", "Thula", "Vrushchika", "Dhanu", "Makara", "Kumbha", "Meena"];
    const PLANETS = [
      { name:"Sun", abbr:"Su", years:6   },
      { name:"Moon", abbr:"Mo", years:10 },
      { name:"Mars", abbr:"Ma", years:7  },
      { name:"Rahu", abbr:"Ra", years:18 },
      { name:"Jupiter", abbr:"Ju", years:16 },
      { name:"Saturn", abbr:"Sa", years:19 },
      { name:"Mercury", abbr:"Me", years:17 },
      { name:"Ketu", abbr:"Ke", years:7 },
      { name:"Venus", abbr:"Ve", years:20 }
    ];

    document.getElementById('astroForm').onsubmit = function(e) {
      e.preventDefault();
      const userid = document.getElementById('userid').value;
      const name = document.getElementById('name').value;
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const lat = parseFloat(document.getElementById('lat').value);
      const lon = parseFloat(document.getElementById('lon').value);
      const plan = document.getElementById('plan').value;
      const dt = new Date(date + 'T' + time);

      // Calculate KP Core Chart
      const chart = kpCompute(dt, lat, lon);

      // Render
      document.getElementById('result').innerHTML = `
        <div class="box">
          <b>පරිශීලක ID:</b> ${userid} <br>
          <b>නම:</b> ${name} <br>
          <b>දිනය:</b> ${dt.toISOString().slice(0,10)} <b>වෙලාව:</b> ${dt.toTimeString().slice(0,5)}
          <span class="${plan}">[${plan === 'pro'?'Pro':'Free'} Plan]</span>
        </div>
        ${renderKPChart(chart)}
        ${renderShortPrediction(chart, name)}
        ${plan==='pro' ? renderAIReading(chart, name) : ''}
      `;
    };

    // Minimal KP Algorithm (demo only)
    function kpCompute(dt, lat, lon) {
      const base = dt.getUTCHours() + dt.getUTCMinutes()/60 + dt.getUTCSeconds()/3600;
      const ascDeg = ((base + lon/15) * 15 + 90) % 360;
      const ascSign = Math.floor(ascDeg / 30);
      let houses = [];
      for(let i=0;i<12;i++) {
        const sign = (ascSign + i)%12;
        const sublord = PLANETS[(sign + i) % PLANETS.length].abbr;
        houses.push({
            house: i+1,
            sign: SIGNS[sign],
            deg: ((ascDeg + i*30)%360).toFixed(2),
            sublord: sublord
        });
      }
      let planets = PLANETS.map((p,i)=>({
        ...p,
        deg: ((ascDeg + 22*i)%360).toFixed(2),
        sign: SIGNS[Math.floor(((ascDeg + 22*i)%360)/30)],
        house: ((Math.floor(((ascDeg + 22*i)%360)/30) - ascSign + 12)%12)+1
      }));
      return { ascDeg, ascSign, houses, planets };
    }

    function renderKPChart(chart) {
      let html = `<h4>KP 12-Box Chart</h4><table><tr>`;
      for(let i=0;i<12;i++) {
        const h = chart.houses[i];
        html += `<td valign="top">
          <b>${h.house}</b><br>
          ${h.sign}<br>
          Deg: ${h.deg}<br>
          SubLord: <b>${h.sublord}</b><br>
          <small>Planets: ${
            chart.planets.filter(p=>p.house===h.house).map(p=>p.abbr).join(", ") || "-"
          }</small>
        </td>`;
        if((i+1)%4===0) html+="</tr><tr>";
      }
      html += `</tr></table>
        <h5>Planets</h5>
        <table><tr><th>Planet</th><th>Deg</th><th>Sign</th><th>House</th></tr>`;
      for(const p of chart.planets) {
        html += `<tr><td>${p.abbr}</td><td>${p.deg}</td><td>${p.sign}</td><td>${p.house}</td></tr>`;
      }
      html += `</table>`;
      return html;
    }

    // Short qualitative prediction (free)
    function renderShortPrediction(chart, name) {
      // Demo: Use the ascendant sign for a simple message
      const lagna = chart.houses[0].sign;
      const msg = {
        "Mesha":"උත්සාහවත්, නව ආරම්භයට සුදුසු.",
        "Vrushabha":"ස්ථායී, වාණිජයට හොඳ.",
        "Mithuna":"ඉගෙනීමේ ලැබීම, ද්විත්ව ලක්ෂණ.",
        "Kataka":"ගෘහස්ත, සංවේදී.",
        "Sinha":"නායකත්වය, ක්‍රීඩා.",
        "Kanya":"විග්‍රහ, සේවා.",
        "Thula":"සමතුලිත, නීති.",
        "Vrushchika":"රහස්, ක්‍රියාශීලි.",
        "Dhanu":"ඉදිරියට යාම, ව්‍යාපාර.",
        "Makara":"අවංක, ව්‍යාපාරික.",
        "Kumbha":"නවෝත්පාදන, මිතුරන්.",
        "Meena":"කවිය, ආදරය."
      };
      return `<div class="box free">
        <b>කෙටි පලාපලය (Short prediction for ${name}):</b><br>
        උදා: ${lagna} ලග්නය — ${msg[lagna] || "සාර්ථකත්වය, සාමය."}
      </div>`;
    }

    // Full AI reading (Pro plan only)
    function renderAIReading(chart, name) {
      // Demo: Simulated deep reading (extend with AI backend as needed)
      return `<div class="box pro">
        <b>AI පූර්ණ විශ්ලේෂණය (Full AI Reading for ${name}):</b><br>
        - ලග්නය: <b>${chart.houses[0].sign}</b><br>
        - ප්‍රධාන ග්‍රහ බලපෑම්: ${chart.planets.slice(0,3).map(p=>p.name).join(", ")}<br>
        - Sub-lord analysis, dasha prediction, remedies, and life events ...<br>
        <i>(මෙය Pro plan එකට පමණි. AI backend/DB/logic එකට සම්බන්ධ කල හැක.)</i>
      </div>`;
    }
  </script>
</body>
</html>
