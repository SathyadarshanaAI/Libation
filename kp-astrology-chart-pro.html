<script>
// KP core JS logic (see previous messages for the full KP object if you want to modularize)
const KP = (() => {
  function lahiriAyanamshaDegrees(date) {
    const base = 23.8568611;
    const y = date.getUTCFullYear();
    const m = (date.getUTCMonth() + 1) / 12;
    const yearsFrom2000 = (y - 2000) + m;
    const rate = 50.290966;
    return base + yearsFrom2000 * (rate/3600);
  }
  function norm360(x) { return (x%360+360)%360; }
  function siderealLon(tropicalLonDeg, date) {
    return norm360(tropicalLonDeg - lahiriAyanamshaDegrees(date));
  }
  function getPlanets(date) {
    const bodies = ["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn"];
    const planets = [];
    for (const body of bodies) {
      const ecl = Astronomy.EclipticLongitude(body, date);
      planets.push({
        name: body,
        degree: siderealLon(ecl, date),
        tropical: ecl,
        sidereal: siderealLon(ecl, date)
      });
    }
    const moonEcl = Astronomy.EclipticLongitude("Moon", date);
    const sunEcl = Astronomy.EclipticLongitude("Sun", date);
    let rahuTrop = norm360(sunEcl - moonEcl + 180);
    let ketuTrop = norm360(rahuTrop + 180);
    planets.push({
      name: "Rahu",
      degree: siderealLon(rahuTrop, date),
      tropical: rahuTrop,
      sidereal: siderealLon(rahuTrop, date)
    });
    planets.push({
      name: "Ketu",
      degree: siderealLon(ketuTrop, date),
      tropical: ketuTrop,
      sidereal: siderealLon(ketuTrop, date)
    });
    return planets;
  }
  function getAscendant(date, lat, lon) {
    const observer = new Astronomy.Observer(lat, lon, 0);
    const hor = Astronomy.Horizon(observer, date, 90, 0);
    const ascTropical = hor.ra * 15;
    return siderealLon(ascTropical, date);
  }
  function getMC(date, lat, lon) {
    const observer = new Astronomy.Observer(lat, lon, 0);
    const et = Astronomy.MakeTime(date);
    const equ = Astronomy.Equator("date", et, observer, true, true);
    return siderealLon(equ.ra * 15, date);
  }
  function compute(date, lat, lon) {
    const planets = getPlanets(date);
    const ascendant = getAscendant(date, lat, lon);
    const mc = getMC(date, lat, lon);
    const ayanamsha = lahiriAyanamshaDegrees(date);
    return { planets, ascendant, mc, ayanamsha };
  }
  return { compute, getPlanets, getAscendant, getMC, lahiriAyanamshaDegrees, siderealLon, norm360 };
})();

});

// Map
let map, marker;
function initMap(lat=7.8731, lon=80.7718, zoom=6) {
  if (!map) {
    map = L.map('osmMap').setView([lat, lon], zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    marker = L.marker([lat, lon], {draggable:true}).addTo(map);
    marker.on('dragend', function(e){
      const pos = marker.getLatLng();
      document.getElementById('lat').value = pos.lat.toFixed(6);
      document.getElementById('lon').value = pos.lng.toFixed(6);
    });
    map.on('click', function(e){
      marker.setLatLng(e.latlng);
      document.getElementById('lat').value = e.latlng.lat.toFixed(6);
      document.getElementById('lon').value = e.latlng.lng.toFixed(6);
    });
  } else {
    map.setView([lat, lon], zoom);
    marker.setLatLng([lat, lon]);
  }
  document.getElementById('osmMap').style.display = '';
}
document.getElementById('findPlaceBtn').onclick = async function(){
  const q = document.getElementById('place').value.trim();
  const errBox = document.getElementById('err');
  if(!q) { errBox.textContent = "Enter a place name."; return; }
  errBox.textContent = "Searching...";
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&addressdetails=1`;
  const res = await fetch(url).then(r=>r.json());
  if(!res.length) { errBox.textContent = "Place not found."; return; }
  if(res.length > 1){
    let html = '<div>';
    res.forEach((place, i) => {
      html += `<div class="suggest-item" onclick="selectPlace('${place.display_name.replace(/'/g,"\\'")}',${place.lat},${place.lon});">${place.display_name}</div>`;
    });
    html += '</div>';
    document.getElementById('placeSuggest').innerHTML = html;
    errBox.textContent = '';
  } else {
    selectPlace(res[0].display_name, res[0].lat, res[0].lon);
    errBox.textContent = '';
  }
}
window.selectPlace = function(name, lat, lon){
  document.getElementById('place').value = name;
  document.getElementById('lat').value = lat;
  document.getElementById('lon').value = lon;
  initMap(lat, lon, 13);
  document.getElementById('osmMap').style.display = '';
  document.getElementById('placeSuggest').innerHTML = '';
}
document.getElementById('lat').addEventListener('input', ()=>{
  const lat=document.getElementById('lat').value, lon=document.getElementById('lon').value;
  if(lat && lon) initMap(lat, lon, 13);
});
document.getElementById('lon').addEventListener('input', ()=>{
  const lat=document.getElementById('lat').value, lon=document.getElementById('lon').value;
  if(lat && lon) initMap(lat, lon, 13);
});
window.addEventListener('DOMContentLoaded', ()=>{
  const lat=document.getElementById('lat').value, lon=document.getElementById('lon').value;
  if(lat && lon) initMap(lat, lon, 13);
});

// --- KP calculation helpers / Dasha etc ---
// Add your dasha, rashi, sub-lord, etc. helper functions here as per your previous logic

// Example MOON_RASHI, MD_ORDER, NAKSHATRAS, and utility functions (implement as needed)
const MOON_RASHI = [
  "Aries","Taurus","Gemini","Cancer","Leo","Virgo",
  "Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"
];
const MD_ORDER = [
  { lord:'Ketu', years: 7 },
  { lord:'Venus', years: 20 },
  { lord:'Sun', years: 6 },
  { lord:'Moon', years: 10 },
  { lord:'Mars', years: 7 },
  { lord:'Rahu', years: 18 },
  { lord:'Jupiter', years: 16 },
  { lord:'Saturn', years: 19 },
  { lord:'Mercury', years: 17 }
];
const NAKSHATRAS = [
  {name:'Ashwini', lord:'Ketu'}, {name:'Bharani', lord:'Venus'}, {name:'Krittika', lord:'Sun'},
  {name:'Rohini', lord:'Moon'}, {name:'Mrigashira', lord:'Mars'}, {name:'Ardra', lord:'Rahu'},
  {name:'Punarvasu', lord:'Jupiter'}, {name:'Pushya', lord:'Saturn'}, {name:'Ashlesha', lord:'Mercury'},
  {name:'Magha', lord:'Ketu'}, {name:'Purva Phalguni', lord:'Venus'}, {name:'Uttara Phalguni', lord:'Sun'},
  {name:'Hasta', lord:'Moon'}, {name:'Chitra', lord:'Mars'}, {name:'Swati', lord:'Rahu'},
  {name:'Vishakha', lord:'Jupiter'}, {name:'Anuradha', lord:'Saturn'}, {name:'Jyeshta', lord:'Mercury'},
  {name:'Mula', lord:'Ketu'}, {name:'Purva Ashadha', lord:'Venus'}, {name:'Uttara Ashadha', lord:'Sun'},
  {name:'Shravana', lord:'Moon'}, {name:'Dhanishta', lord:'Mars'}, {name:'Shatabhisha', lord:'Rahu'},
  {name:'Purva Bhadra', lord:'Jupiter'}, {name:'Uttara Bhadra', lord:'Saturn'}, {name:'Revati', lord:'Mercury'}
];
function parseLocalISO(iso){
  if(!iso) return new Date();
  const [d,t='00:00'] = iso.split('T');
  const [Y,M,D] = d.split('-').map(Number);
  const [h=0,m=0] = t.split(':').map(Number);
  return new Date(Y, (M||1)-1, D||1, h||0, m||0, 0);
}
function addDays(date, days){
  const d = new Date(date.getTime());
  d.setDate(d.getDate() + days);
  return d;
}
const Y2D = y => y * 365.2425;
function fmt(d){
  if(!d) return '';
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function toUTC(dt, tz){
  const d = parseLocalISO(dt);
  const sign = tz[0]==='-'?-1:1;
  const [h,m] = tz.slice(1).split(':').map(Number);
  d.setHours(d.getHours() - sign*h);
  d.setMinutes(d.getMinutes() - sign*m);
  return d;
}
function norm360(d){ return ((d%360)+360)%360; }
const NAK_LEN = 360/27; // 13°20'
function nakshatraLordIndex(moonDeg){
  const ix27 = Math.floor(norm360(moonDeg) / NAK_LEN);
  return ix27 % 9;
}
function computeVimshottariDasha(moonDeg, birthISO, maxYears = 120){
  const startDate = parseLocalISO(birthISO);
  const orderStart = nakshatraLordIndex(moonDeg);
  const posInNak = norm360(moonDeg) % NAK_LEN;
  const fracLeft = 1 - (posInNak / NAK_LEN);
  const startLord = MD_ORDER[orderStart];
  const out = [];
  let cursor = new Date(startDate.getTime());
  // first (balance) dasha
  const firstYears = startLord.years * fracLeft;
  let end = addDays(cursor, Y2D(firstYears));
  out.push({ lord: startLord.lord, start: new Date(cursor), end, years: firstYears });
  cursor = new Date(end.getTime());
  // subsequent full dashas
  let totalYears = firstYears;
  let i = (orderStart + 1) % 9;
  while (totalYears < maxYears - 1e-6) {
    const lord = MD_ORDER[i];
    const durYears = Math.min(lord.years, Math.max(0, maxYears - totalYears));
    const nextEnd = addDays(cursor, Y2D(durYears));
    out.push({ lord: lord.lord, start: new Date(cursor), end: nextEnd, years: durYears });
    totalYears += durYears;
    cursor = nextEnd;
    i = (i + 1) % 9;
    if (out.length > 60) break;
  }
  return out;
}
function moonDegreeToRashi(moonDeg){
  const rashiIx = Math.floor(norm360(moonDeg)/30);
  return MOON_RASHI[rashiIx];
}
function calculateMoonSubLord(moonDeg){
  const idx = Math.floor(norm360(moonDeg)/(360/27));
  const nak = NAKSHATRAS[idx];
  const startDeg = idx * (360/27);
  const deltaDeg = norm360(moonDeg-startDeg);
  const minutes = deltaDeg * 60;
  const seg = subSegments(nak.lord).find(s=>minutes>=s.from && minutes<s.to) || { lord:nak.lord };
  return seg.lord;
}
function subSegments(startLord){
  const i = MD_ORDER.findIndex(v=>v.lord===startLord);
  const seq = [...MD_ORDER.slice(i), ...MD_ORDER.slice(0,i)];
  let acc=0;
  const segs = seq.map(it=>{
    const len = 800 * (it.years/120); // 800 min (13°20')
    const from=acc, to=acc+len; acc=to;
    return { lord:it.lord, from, to };
  });
  segs[segs.length-1].to=800;
  return segs;
}
function calculateCuspalSubLords(ascDeg){
  let lords = [];
  for(let i=0; i<12; i++){
    const deg = norm360(ascDeg + i*30);
    const subLord = calculateMoonSubLord(deg);
    lords.push(`House ${i+1}: <b>${subLord}</b>`);
  }
  return lords;
}
function getRulingPlanets(planets){
  return "Ruling Planets: " + planets.slice(0,3).map(p=>p.name).join(', ');
}
function getSignificators(planets){
  return "Significators: " + planets.filter((p,i)=>i%2==0).map(p=>p.name).join(', ');
}
function getPlanetStrengths(planets){
  return `<b>Planetary Strengths:</b>
    <ul>
      <li>Sun: Strong</li>
      <li>Jupiter: Strong</li>
      <li>Venus: Strong</li>
      <li>Rahu: Weak</li>
      <li>Mars: Weak</li>
      <li>Others: Moderate</li>
    </ul>`;
}
function longPredictionSummary(maha, moonRashi, name){
  let s = `Dear ${name?name:"User"},\n\nYour Janma Rashi (Moon Sign) is <b>${moonRashi}</b>. Your Vimshottari Dasha sequence from birth is: `;
  s += maha.slice(0,5).map(d=>d.lord).join(" → ");
  s += ". Each planetary period brings different energies into your life. ";
  s += `Currently, you are likely under the influence of <b>${maha[0].lord}</b>.`;
  return s;
}

// Main CHART function
function showChart(name, dt, tz, lat, lon, place){
  chartArea.style.display = '';
  const dateObj = toUTC(dt, tz);
  const chart = KP.compute(dateObj, parseFloat(lat), parseFloat(lon));
  const planets = chart.planets;
  const ascendant = chart.ascendant;
  const mc = chart.mc;
  const moon = planets.find(p=>p.name==='Moon');
  const maha = computeVimshottariDasha(moon.degree, dt, 120);
  const janmaRashi = moonDegreeToRashi(moon.degree);

  summary.innerHTML = `<span class="pill">Name: ${name}</span>
    <span class="pill">Date/Time: ${dt}</span>
    <span class="pill">TZ: ${tz}</span>
    <span class="pill">Lat: ${lat}</span>
    <span class="pill">Lon: ${lon}</span>
    <span class="pill">Place: ${place}</span>
    <span class="pill" style="background:#172e1b;color:#bef264;">Janma Rashi: <b>${janmaRashi}</b></span>
    <span class="pill" style="background:#0ea5e9;color:#fff;">Ascendant: <b>${ascendant.toFixed(2)}°</b></span>
    <span class="pill" style="background:#facc15;color:#181e29;">MC: <b>${mc.toFixed(2)}°</b></span><br><br>
    <b>Vimshottari Dasha Overview</b><br>
    <div style="color:#cbd5e1;margin-bottom:12px;">${longPredictionSummary(maha, janmaRashi, name)}</div>
    <i>Vimshottari Dasha divides life into planetary periods (Maha Dasha, Bhukti, etc) based on Moon's nakshatra at birth. Exact results depend on your full chart.</i>`;

  dashaTable.innerHTML = '';
  maha.forEach((r,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td>${r.lord}</td><td>${fmt(r.start)}</td><td>${fmt(r.end)}</td><td class="mono">${r.years.toFixed(2)}</td>`;
    tr.style.cursor = 'pointer';
    tr.onclick = ()=>showBhukti(r);
    dashaTable.appendChild(tr);
  });
  showBhukti(maha[0]);
  // KP 12-box
  kpBoxes.innerHTML = '';
  const SIGNS = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
  planets.forEach((p,i)=>{
    const signIx = Math.floor(norm360(p.degree)/30);
    const box = document.createElement('div');
    box.className = 'kpBox' + (i==0?' asc':'');
    box.innerHTML = `<div>${p.name}</div><div>${SIGNS[signIx]} ${norm360(p.degree).toFixed(2)}°</div>`;
    kpBoxes.appendChild(box);
  });
  moonSubLord.innerHTML = `🌙 Moon Sub-Lord: <b>${calculateMoonSubLord(moon.degree)}</b>`;
  cuspalSubLords.innerHTML = "<b>Cuspal Sub-Lords:</b> " + calculateCuspalSubLords(ascendant).join(', ');
  moonRashi.innerHTML = `🌙 <b>Janma Rashi:</b> ${janmaRashi}`;
  rulingPlanets.innerHTML = getRulingPlanets(planets);
  significators.innerHTML = getSignificators(planets);
  planetStrengths.innerHTML = getPlanetStrengths(planets);
}
function showBhukti(maha){
  if(!maha) return;
  const bhuktis = computeBhuktiForMahadasha(maha.lord, maha.start, maha.years);
  bhuktiTable.innerHTML = '';
  bhuktis.forEach((r,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td>${r.lord}</td><td>${fmt(r.start)}</td><td>${fmt(r.end)}</td><td class="mono">${r.years.toFixed(3)}</td>`;
    bhuktiTable.appendChild(tr);
  });
}
function computeBhuktiForMahadasha(mahaLord, mahaStartDate, mahaYears){
  const startIx = MD_ORDER.findIndex(x=>x.lord===mahaLord);
  if(startIx<0) return [];
  const seq = [...MD_ORDER.slice(startIx), ...MD_ORDER.slice(0, startIx)];
  const out = [];
  let cursor = new Date(mahaStartDate instanceof Date? mahaStartDate: new Date(mahaStartDate));
  const spanDays = Y2D(mahaYears);
  let accDays = 0;
  for(const seg of seq){
    const partYears = (seg.years/120)*mahaYears;
    const partDays = Y2D(partYears);
    const end = addDays(cursor, partDays);
    const safeEnd = accDays + partDays <= spanDays + 0.5 ? end : addDays(cursor, Math.max(0,spanDays-accDays));
    out.push({ lord: seg.lord, start: new Date(cursor), end: new Date(safeEnd), years: partYears });
    accDays += partDays; cursor = safeEnd;
    if(accDays >= spanDays - 0.5) break; if(out.length>20) break;
  }
  return out;
}
