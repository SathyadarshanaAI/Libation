<script>
// Timezone select
const timezones = [
  { value:"+05:30", label:"IST (India/Sri Lanka) +05:30" },
  { value:"+06:00", label:"Bangladesh +06:00" },
  { value:"+05:45", label:"Nepal +05:45" },
  { value:"+01:00", label:"CET +01:00" },
  { value:"-05:00", label:"EST (US East) -05:00" },
  { value:"+09:00", label:"Japan +09:00" },
  { value:"+03:00", label:"Arabia +03:00" },
  { value:"+08:00", label:"China +08:00" },
  { value:"-08:00", label:"PST (US West) -08:00" },
  { value:"+00:00", label:"UTC/GMT +00:00" }
];
timezones.forEach(tz=>{
  const o = document.createElement('option');
  o.value = tz.value; o.textContent = tz.label;
  timezone.appendChild(o);
});
timezone.value = "+05:30";

// Leaflet map init
let map, marker;
function initMap(lat=7.8731, lon=80.7718, zoom=6) {
  if (!map) {
    map = L.map('osmMap').setView([lat, lon], zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    marker = L.marker([lat, lon], {draggable:true}).addTo(map);
    marker.on('dragend', function(e){
      const pos = marker.getLatLng();
      document.getElementById('lat').value = pos.lat.toFixed(6);
      document.getElementById('lon').value = pos.lng.toFixed(6);
    });
    map.on('click', function(e){
      marker.setLatLng(e.latlng);
      document.getElementById('lat').value = e.latlng.lat.toFixed(6);
      document.getElementById('lon').value = e.latlng.lng.toFixed(6);
    });
  } else {
    map.setView([lat, lon], zoom);
    marker.setLatLng([lat, lon]);
  }
  document.getElementById('osmMap').style.display = '';
}
// Place Find button logic
document.getElementById('findPlaceBtn').onclick = async function(){
  const q = document.getElementById('place').value.trim();
  const errBox = document.getElementById('err');
  if(!q) { errBox.textContent = "Enter a place name."; return; }
  errBox.textContent = "Searching...";
  // Use Nominatim search
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&addressdetails=1`;
  const res = await fetch(url).then(r=>r.json());
  if(!res.length) { errBox.textContent = "Place not found."; return; }
  // Show suggestion list if multiple
  if(res.length > 1){
    let html = '<div>';
    res.forEach((place, i) => {
      html += `<div class="suggest-item" onclick="selectPlace('${place.display_name.replace(/'/g,"\\'")}',${place.lat},${place.lon});">${place.display_name}</div>`;
    });
    html += '</div>';
    document.getElementById('placeSuggest').innerHTML = html;
    errBox.textContent = '';
  } else {
    // Only one result
    selectPlace(res[0].display_name, res[0].lat, res[0].lon);
    errBox.textContent = '';
  }
}
// Place suggestion select
window.selectPlace = function(name, lat, lon){
  document.getElementById('place').value = name;
  document.getElementById('lat').value = lat;
  document.getElementById('lon').value = lon;
  initMap(lat, lon, 13);
  document.getElementById('osmMap').style.display = '';
  document.getElementById('placeSuggest').innerHTML = '';
}
// Show map when lat/lon changes
document.getElementById('lat').addEventListener('input', ()=>{
  const lat=document.getElementById('lat').value, lon=document.getElementById('lon').value;
  if(lat && lon) initMap(lat, lon, 13);
});
document.getElementById('lon').addEventListener('input', ()=>{
  const lat=document.getElementById('lat').value, lon=document.getElementById('lon').value;
  if(lat && lon) initMap(lat, lon, 13);
});
// Show map on page load if lat/lon present
window.addEventListener('DOMContentLoaded', ()=>{
  const lat=document.getElementById('lat').value, lon=document.getElementById('lon').value;
  if(lat && lon) initMap(lat, lon, 13);
  if(typeof fromParams==="function") fromParams();
});

// Main form logic
const birthForm = document.getElementById('birthForm');
const errBox = document.getElementById('err');
birthForm.onsubmit = async function(e){
  e.preventDefault();
  errBox.textContent = '';
  let name = document.getElementById('name').value.trim();
  let date = document.getElementById('date').value;
  let time = document.getElementById('time').value;
  let tz = document.getElementById('timezone').value;
  let lat = parseFloat(document.getElementById('lat').value);
  let lon = parseFloat(document.getElementById('lon').value);
  let place = document.getElementById('place').value.trim();
  if(!name || !date || !time){
    errBox.textContent = 'Please fill all fields correctly.';
    return;
  }
  if((isNaN(lat) || isNaN(lon) || !lat || !lon) && place){
    errBox.textContent = 'Searching place...';
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}&limit=1`;
    const res = await fetch(url).then(r => r.json());
    if(!res.length){
      errBox.textContent = 'Place not found. Enter coordinates.';
      return;
    }
    lat = +res[0].lat; lon = +res[0].lon;
    document.getElementById('lat').value = lat;
    document.getElementById('lon').value = lon;
    initMap(lat, lon, 13);
  }
  if(isNaN(lat) || isNaN(lon) || !lat || !lon){
    errBox.textContent = 'Latitude/Longitude required.';
    return;
  }
  errBox.textContent = '';
  const dt = date + "T" + time;
  showChart(name, dt, tz, lat, lon, place);
};
