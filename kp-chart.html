<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KP Chart Generator — Chocolate</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
  :root{
    --bg:#1b120c; --bg2:#24160f; --line:#3a2518;
    --txt:#F8EDE3; --muted:#E6D3C5;
    --cocoa:#7B3F00; --toffee:#B36B2C; --caramel:#D0914E; --gold:#F2C14E;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,Segoe UI,Arial; color:var(--txt);
    background:radial-gradient(1200px 800px at 20% -10%, #2a1a12 0, var(--bg) 55%),
               linear-gradient(180deg,#1e120b,var(--bg) 60%);
    min-height:100vh; padding:14px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  h1{margin:2px 0 12px;text-align:center;color:var(--gold)}
  .card{
    background:linear-gradient(180deg,#25160f 0%,var(--bg2) 100%);
    border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 0 20px #2b181033;
    padding:16px; margin-bottom:16px;
  }
  label{display:block;margin:10px 0 6px;color:var(--muted);font-weight:600}
  input,textarea{
    width:100%; padding:11px 12px; font-size:15.5px;
    border-radius:12px; border:1px solid var(--line); outline:0;
    background:#1f130c; color:var(--txt); transition:.2s;
  }
  input:focus,textarea:focus{ border-color:var(--caramel);
    box-shadow:0 0 0 3px #d0914e33, inset 0 0 12px #d0914e22; background:#23160f }
  .btn{
    width:100%; margin-top:10px; cursor:pointer; border:0; border-radius:12px;
    padding:10px 18px; font-weight:800; letter-spacing:.02em; color:#2b170c;
    background:linear-gradient(90deg,var(--cocoa),var(--toffee),var(--caramel));
    box-shadow:0 8px 18px #120a06, 0 0 10px 1px #d0914e44, inset 0 0 20px #b36b2c22;
  }
  .btn:hover{filter:brightness(1.07)}
  #map{height:300px;border-radius:14px;margin-top:8px;border:1px solid var(--line);box-shadow:0 0 18px #2a1a1255}
  /* Wheel + Table */
  #wheel svg{width:100%;height:auto;max-width:540px;display:block;margin:14px auto}
  #wheel path{stroke:#3b2416}
  #wheel text{fill:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{padding:8px 10px;border-bottom:1px solid #3a2518;text-align:center}
  th{background:#2a1a12;color:var(--gold)}
  td b{color:var(--caramel)}
</style>
</head>
<body>
<div class="wrap">
  <h1>KP Chart Generator</h1>

  <!-- FORM + MAP -->
  <div class="card">
    <form id="kpForm" autocomplete="off">
      <label>Name</label>
      <input id="name" required>

      <label>Date of Birth</label>
      <input id="dob" type="date" required>

      <label>Time of Birth</label>
      <input id="tob" type="time" required>

      <label>Place of Birth</label>
      <input id="pob" placeholder="e.g. Colombo or 7.2862, 80.6316">

      <label>Pick on Map</label>
      <div id="map"></div>

      <label>Time Zone
        <button type="button" id="detectTzBtn" class="btn" style="width:auto;float:right;margin-top:-2px">Auto Detect</button>
      </label>
      <input id="timezone" placeholder="+05:30" required>

      <label>Question (optional)</label>
      <input id="question" placeholder="e.g. Career, marriage…">

      <button class="btn" type="submit">Generate Chart</button>
      <div id="status" style="margin-top:8px;color:var(--gold)"></div>
    </form>
  </div>

  <!-- OUTPUT -->
  <div class="card">
    <h2 style="margin:0 0 6px;color:var(--gold)">KP Wheel</h2>
    <div id="wheel"></div>

    <h2 style="margin:10px 0 6px;color:var(--gold)">Planet Table</h2>
    <table>
      <thead>
        <tr><th>Planet</th><th>Degree</th><th>Sign</th><th>Nakshatra</th><th>Pada</th><th>Star Lord</th><th>Sub-Lord</th></tr>
      </thead>
      <tbody id="tbl"></tbody>
    </table>

    <label style="margin-top:12px">JSON Preview</label>
    <textarea id="jsonPreview" rows="6" readonly></textarea>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---------- Map ----------
  const map = L.map('map',{zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const SL=[7.8731,80.7718]; map.setView(SL,7);
  let marker=L.marker(SL,{draggable:true}).addTo(map);
  const pob=document.getElementById('pob');
  function setPOB(lat,lon){ pob.value=`${lat.toFixed(6)}, ${lon.toFixed(6)}`; }
  map.on('click',e=>{ marker.setLatLng(e.latlng); setPOB(e.latlng.lat,e.latlng.lng); });
  marker.on('dragend',()=>{ const p=marker.getLatLng(); setPOB(p.lat,p.lng); });
  // center if coords typed
  (function(){
    const t=(pob.value||'').trim(); const m=t.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
    if(m){ const lat=+m[1],lon=+m[2]; marker.setLatLng([lat,lon]); map.setView([lat,lon],12); }
  })();

  // ---------- Auto TZ ----------
  const tz=document.getElementById('timezone');
  document.getElementById('detectTzBtn').onclick=()=>{
    try{const off=-new Date().getTimezoneOffset(); const s=off>=0?'+':'-';
      const a=Math.abs(off),h=Math.floor(a/60),m=a%60;
      tz.value=`${s}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }catch{tz.value='+05:30';}
  };
  if(!tz.value) document.getElementById('detectTzBtn').click();

  // ---------- KP helpers (demo calc) ----------
  const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
  const NAKS=['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];
  const DASHAS=[{lord:'Ketu',years:7},{lord:'Venus',years:20},{lord:'Sun',years:6},{lord:'Moon',years:10},{lord:'Mars',years:7},{lord:'Rahu',years:18},{lord:'Jupiter',years:16},{lord:'Saturn',years:19},{lord:'Mercury',years:17}];
  const NAK_LORD=Array.from({length:27},(_,i)=>DASHAS[i%9].lord);
  const mod=(a,b)=>((a%b)+b)%b, DEG_PER_NAK=360/27, DEG_PER_PADA=DEG_PER_NAK/4;
  const dms=deg=>{deg=mod(deg,360);const d=Math.floor(deg);const mf=(deg-d)*60;const m=Math.floor(mf);const s=Math.round((mf-m)*60);return `${d}° ${String(m).padStart(2,'0')}′ ${String(s).padStart(2,'0')}″`};
  const signOf=deg=>SIGNS[Math.floor(mod(deg,360)/30)];
  const nakIndex=deg=>Math.floor(mod(deg,360)/DEG_PER_NAK);
  const padaOf=deg=>{const within=mod(deg,DEG_PER_NAK);return Math.floor(within/DEG_PER_PADA)+1};
  const starLordOf=deg=>NAK_LORD[nakIndex(deg)];
  function subLordOf(deg){
    const start=NAK_LORD[nakIndex(deg)]; const idx=DASHAS.findIndex(d=>d.lord===start);
    const seq=DASHAS.slice(idx).concat(DASHAS.slice(0,idx));
    const arc=DEG_PER_NAK, parts=seq.map(d=>arc*(d.years/120));
    const w=mod(deg,DEG_PER_NAK); let acc=0;
    for(let i=0;i<parts.length;i++){ acc+=parts[i]; if(w<acc) return seq[i].lord; }
    return seq.at(-1).lord;
  }

  // ---------- Renderers ----------
  function renderTable(planets){
    const tb=document.getElementById('tbl'); tb.innerHTML='';
    planets.forEach(p=>{
      tb.insertAdjacentHTML('beforeend',`<tr>
        <td><b>${p.name}</b></td>
        <td>${dms(p.degree)}</td>
        <td>${signOf(p.degree)}</td>
        <td>${NAKS[nakIndex(p.degree)]}</td>
        <td>${padaOf(p.degree)}</td>
        <td>${starLordOf(p.degree)}</td>
        <td><b>${subLordOf(p.degree)}</b></td>
      </tr>`);
    });
  }
  function renderWheel(planets){
    const W=520,H=520,Cx=W/2,Cy=H/2,R=195; let sectors='',labels='',dots='';
    for(let i=0;i<12;i++){
      const a1=(i*30-90)*Math.PI/180,a2=((i+1)*30-90)*Math.PI/180;
      const x1=Cx+R*Math.cos(a1),y1=Cy+R*Math.sin(a1),x2=Cx+R*Math.cos(a2),y2=Cy+R*Math.sin(a2);
      sectors+=`<path d="M${Cx},${Cy} L${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} Z" fill="none" stroke="#3b2416" stroke-width="2"/>`;
    }
    for(let i=0;i<12;i++){
      const a=((i*30+15)-90)*Math.PI/180, x=Cx+(R-16)*Math.cos(a), y=Cy+(R-16)*Math.sin(a);
      labels+=`<text x="${x}" y="${y+4}" font-size="11" text-anchor="middle">${SIGNS[i]}</text>`;
    }
    planets.forEach(p=>{
      const a=(p.degree-90)*Math.PI/180, r=R-34, x=Cx+r*Math.cos(a), y=Cy+r*Math.sin(a);
      const rk=(p.name==='Rahu'||p.name==='Ketu');
      dots+=`<g><circle cx="${x}" cy="${y}" r="8" fill="#1f130c" stroke="${rk?'#F2C14E':'#D0914E'}" stroke-width="2"/>`+
             `<text x="${x}" y="${y+3}" font-size="9.5" text-anchor="middle" fill="#F8EDE3">${p.name[0]}</text></g>`;
    });
    document.getElementById('wheel').innerHTML=`<svg viewBox="0 0 ${W} ${H}"><circle cx="${Cx}" cy="${Cy}" r="${R+24}" fill="rgba(27,18,12,.9)"/>${sectors}${labels}${dots}</svg>`;
  }

  // ---------- Demo Generate ----------
  const demoPlanets=()=>[
    {name:'Sun',degree:123.456},{name:'Moon',degree:200.123},{name:'Mercury',degree:305.432},
    {name:'Venus',degree:271.111},{name:'Mars',degree:18.876},{name:'Jupiter',degree:84.333},
    {name:'Saturn',degree:342.25},{name:'Rahu',degree:45.876},{name:'Ketu',degree:225.876}
  ];
  function generate(){
    const planets=demoPlanets();
    renderTable(planets); renderWheel(planets);
    document.getElementById('jsonPreview').value=JSON.stringify({planets},null,2);
    document.getElementById('status').textContent='✓ Chart generated (demo data).';
  }
  document.getElementById('kpForm').addEventListener('submit',e=>{e.preventDefault();generate();});
  // first paint
  generate();
</script>
</body>
</html>
