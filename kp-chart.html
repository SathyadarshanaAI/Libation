<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KP Chart Generator | Chocolate Theme</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root{
      --bg:       #1b120c;   /* dark cocoa */
      --bg2:      #24160f;
      --line:     #3a2518;
      --txt:      #F8EDE3;   /* cream */
      --muted:    #E6D3C5;
      --cocoa:    #7B3F00;
      --caramel:  #D0914E;
      --toffee:   #B36B2C;
      --gold:     #F2C14E;
      --radius:   14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Segoe UI',system-ui,Arial;
      color:var(--txt);
      background:radial-gradient(1200px 800px at 20% -10%, #2a1a12 0, var(--bg) 55%),
                 linear-gradient(180deg,#1e120b,var(--bg) 60%);
      min-height:100vh;
      padding:1rem;
    }
    h1{color:var(--gold);text-align:center;margin:.5rem 0 1rem;}
    label{display:block;margin:8px 0 4px;color:var(--muted);font-weight:600;}
    input,textarea{
      width:100%;padding:10px;border-radius:12px;
      border:1px solid var(--line);background:#1f130c;color:var(--txt);
    }
    input:focus{border-color:var(--caramel);box-shadow:0 0 0 3px #d0914e33;}
    button{
      margin-top:10px;width:100%;
      background:linear-gradient(90deg,var(--cocoa),var(--toffee),var(--caramel));
      color:#2b170c;font-weight:700;border:0;border-radius:12px;padding:10px;
      cursor:pointer;box-shadow:0 0 10px #d0914e55;
    }
    button:hover{filter:brightness(1.07);}
    .form-card{
      background:linear-gradient(180deg,#25160f,var(--bg2));
      border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:0 10px 24px rgba(0,0,0,.35);
      max-width:600px;margin:0 auto 1.2rem;padding:1rem;
    }
    #map{
      height:280px;border-radius:14px;margin-top:8px;
      border:1px solid var(--line);box-shadow:0 0 14px #2a1a1255;
    }
    #wheel svg{width:100%;height:auto;max-width:540px;display:block;margin:1rem auto;}
    table{width:100%;border-collapse:collapse;margin-top:1rem;}
    th,td{padding:7px 9px;border-bottom:1px solid #3a2518;text-align:center;}
    th{background:#2a1a12;color:var(--gold);}
    td b{color:var(--caramel);}
    footer{margin-top:1.8rem;text-align:center;color:var(--muted);font-size:.9rem;}
  </style>
</head>
<body>
  <h1>KP Chart Generator</h1>
  <div class="form-card">
    <form id="kpForm">
      <label>Name</label>
      <input type="text" id="name" required>

      <label>Date of Birth</label>
      <input type="date" id="dob" required>

      <label>Time of Birth</label>
      <input type="time" id="tob" required>

      <label>Place of Birth</label>
      <input type="text" id="pob" placeholder="e.g. Colombo">

      <label>Pick on Map</label>
      <div id="map"></div>

      <label>Time Zone 
        <button type="button" id="detectTzBtn" style="float:right;margin-top:-2px;width:auto;">Auto Detect</button>
      </label>
      <input type="text" id="timezone" required placeholder="+05:30">

      <label>Question</label>
      <input type="text" id="question" placeholder="Optional">

      <button type="submit">Generate Chart</button>
      <div id="status" style="margin-top:6px;color:var(--gold);font-size:.9rem;"></div>
    </form>
  </div>

  <div id="wheel"></div>
  <table>
    <thead>
      <tr>
        <th>Planet</th><th>Degree</th><th>Sign</th><th>Nakshatra</th><th>Pada</th><th>Star Lord</th><th>Sub Lord</th>
      </tr>
    </thead>
    <tbody id="tbl"></tbody>
  </table>
  <textarea id="jsonPreview" rows="6" readonly placeholder="Preview here"></textarea>

  <footer>
    Powered by NASA Horizons • Lebetion KP Chart • 2025
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const placeInput=document.getElementById('pob');
    const tzInput=document.getElementById('timezone');
    const map=L.map('map',{zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,attribution:'© OpenStreetMap'
    }).addTo(map);
    const SL=[7.8731,80.7718]; map.setView(SL,7);
    let marker=L.marker(SL,{draggable:true}).addTo(map);
    function fillPlace(lat,lon){placeInput.value=`${lat.toFixed(6)}, ${lon.toFixed(6)}`;}
    map.on('click',e=>{marker.setLatLng(e.latlng);fillPlace(e.latlng.lat,e.latlng.lng);});
    marker.on('dragend',()=>{const p=marker.getLatLng();fillPlace(p.lat,p.lng);});
    document.getElementById('detectTzBtn').addEventListener('click',()=>{
      try{let off=-new Date().getTimezoneOffset();
        let s=off>=0?'+':'-',a=Math.abs(off),h=Math.floor(a/60),m=a%60;
        tzInput.value=`${s}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      }catch{tzInput.value='+05:30';}
    });

    // Demo chart (replace with real API)
    document.getElementById('kpForm').onsubmit=(e)=>{
      e.preventDefault();
      const planets=[
        {name:"Sun",degree:123.456},
        {name:"Moon",degree:200.123},
        {name:"Mars",degree:305.432},
        {name:"Rahu",degree:45.876},
        {name:"Ketu",degree:225.876}
      ];
      const tbody=document.getElementById('tbl');tbody.innerHTML='';
      planets.forEach(p=>{
        tbody.innerHTML+=`<tr>
          <td>${p.name}</td>
          <td>${p.degree.toFixed(2)}</td>
          <td>-</td><td>-</td><td>-</td><td>-</td><td><b>-</b></td>
        </tr>`;
      });
      document.getElementById('jsonPreview').value=JSON.stringify({planets},null,2);
      document.getElementById('status').textContent='✓ Demo chart generated';
    };
  </script>
</body>
</html>
