<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>KP Chart Generator</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root{
      --bg:#061120; --panel:#0b172b; --line:#1c2f52;
      --txt:#e7f3ff; --muted:#9cc7ff;
      --neon:#60a5fa; --neon2:#2df3c2; --neon3:#e6b2ff;
      --radius:14px;
    }
    body{
      margin:0; font-family:system-ui,Segoe UI,Arial; color:var(--txt);
      background:
        radial-gradient(1100px 700px at 20% -10%, #0c1a38 0, var(--bg) 55%),
        linear-gradient(180deg, #07142a, var(--bg) 60%);
    }
    .wrap{max-width:1100px;margin:18px auto;padding:12px}
    .card{
      background:linear-gradient(180deg,#0d1d36 0%, var(--panel) 100%);
      border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 0 20px #0e213833;
      padding:16px; margin-bottom:16px;
    }
    h1,h2{margin:8px 0 12px}
    label{display:block;margin:10px 0 6px;color:var(--muted);font-weight:600}
    input,select,textarea{
      width:100%; padding:11px 12px; font-size:15.5px;
      border-radius:12px; border:1px solid var(--line); outline:0;
      background:#0a1830; color:var(--txt);
      transition:box-shadow .2s,border-color .2s, background .2s;
    }
    input:focus,select:focus,textarea:focus{
      border-color:var(--neon2);
      box-shadow:0 0 0 3px #2df3c233, inset 0 0 12px #2df3c222;
      background:#0b1e3a;
    }
    .btn{
      appearance:none; cursor:pointer; border:0; border-radius:12px;
      padding:10px 18px; font-weight:800; letter-spacing:.02em;
      color:#07101b; text-shadow:0 0 2px #fff8;
      background:linear-gradient(90deg,var(--neon),var(--neon3),var(--neon2));
      box-shadow:0 8px 18px #02070e, 0 0 10px 1px #2df3c244, inset 0 0 20px #60a5fa22;
      transition:filter .18s, transform .05s;
    }
    .btn:hover{filter:brightness(1.12) drop-shadow(0 0 6px var(--neon3));}
    .btn:active{transform:translateY(1px);}

    #map{height:300px;border-radius:14px;border:1px solid var(--line);box-shadow:0 0 18px #0d2237;margin-top:8px}

    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px 10px;border-bottom:1px solid #1e3358}
    th{background:#0f1e37;color:#bfe1ff;font-weight:700}
    #wheel svg{width:100%;height:auto;max-width:540px;display:block;margin:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>KP Chart Generator</h2>

      <label>Name</label>
      <input id="name" placeholder="Your name">

      <label>Date of Birth</label>
      <input id="dob" type="date">

      <label>Time of Birth</label>
      <input id="tob" type="time">

      <label>Place of Birth</label>
      <input id="pob" placeholder="e.g. Colombo or 7.2862, 80.6316">

      <label>Time Zone <button id="detectTzBtn" type="button" class="btn" style="float:right;margin-top:-2px">Auto Detect</button></label>
      <input id="timezone" placeholder="+05:30">

      <!-- STREET MAP (shows at top section) -->
      <label>Pick on Map</label>
      <div id="map"></div>

      <label>Question (optional)</label>
      <input id="question" placeholder="e.g. Career, marriage…">

      <button id="genBtn" class="btn" style="margin-top:10px">Generate Chart</button>
      <div id="status" style="margin-top:8px;color:#9cc7ff">Tip: Tap/drag marker, coords will auto-fill above.</div>
    </div>

    <div class="card">
      <h2>KP Wheel</h2>
      <div id="wheel"></div>
      <h2>Planet Table</h2>
      <table>
        <thead>
          <tr><th>Planet</th><th>Degree</th><th>Sign</th><th>Nakshatra</th><th>Pada</th><th>Star Lord</th><th>Sub-Lord</th></tr>
        </thead>
        <tbody id="tbl"></tbody>
      </table>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- Auto Timezone ---
    const tzInput = document.getElementById('timezone');
    document.getElementById('detectTzBtn').addEventListener('click', ()=>{
      try{
        const off = -new Date().getTimezoneOffset(); const s = off>=0?'+':'-';
        const a=Math.abs(off), h=Math.floor(a/60), m=a%60;
        tzInput.value = `${s}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      }catch{ tzInput.value = '+05:30'; }
    });
    if(!tzInput.value) document.getElementById('detectTzBtn').click();

    // --- MAP (OpenStreetMap + Leaflet) ---
    const placeInput = document.getElementById('pob');
    const map = L.map('map',{zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const SL=[7.8731,80.7718]; map.setView(SL,7);
    let marker = L.marker(SL,{draggable:true}).addTo(map);

    function fillPlace(lat,lon){ placeInput.value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`; }
    map.on('click', e=>{ marker.setLatLng(e.latlng); fillPlace(e.latlng.lat,e.latlng.lng); });
    marker.on('dragend', ()=>{ const p=marker.getLatLng(); fillPlace(p.lat,p.lng); });

    // If user typed coords already, center there
    (function(){
      const t = (placeInput.value||'').trim();
      const m = t.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
      if(m){ const lat=+m[1], lon=+m[2]; marker.setLatLng([lat,lon]); map.setView([lat,lon],12); }
    })();

    // --- Simple demo planets for wheel/table (replace with API later) ---
    const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
    const NAKS=['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];
    const DASHAS=[{lord:'Ketu',years:7},{lord:'Venus',years:20},{lord:'Sun',years:6},{lord:'Moon',years:10},{lord:'Mars',years:7},{lord:'Rahu',years:18},{lord:'Jupiter',years:16},{lord:'Saturn',years:19},{lord:'Mercury',years:17}];
    const NAK_LORD=Array.from({length:27},(_,i)=>DASHAS[i%9].lord);
    const mod=(a,b)=>((a%b)+b)%b; const DEG_PER_NAK=360/27, DEG_PER_PADA=DEG_PER_NAK/4;
    const dms=deg=>{deg=mod(deg,360);const d=Math.floor(deg);const mF=(deg-d)*60;const m=Math.floor(mF);const s=Math.round((mF-m)*60);return `${d}° ${String(m).padStart(2,'0')}′ ${String(s).padStart(2,'0')}″`};
    const signOf=deg=>SIGNS[Math.floor(mod(deg,360)/30)];
    const nakIndex=deg=>Math.floor(mod(deg,360)/DEG_PER_NAK);
    const padaOf=deg=>{const within=mod(deg,DEG_PER_NAK);return Math.floor(within/DEG_PER_PADA)+1};
    const starLordOf=deg=>NAK_LORD[nakIndex(deg)];
    function subLordOf(deg){
      const start=NAK_LORD[nakIndex(deg)]; const idx=DASHAS.findIndex(d=>d.lord===start);
      const seq=DASHAS.slice(idx).concat(DASHAS.slice(0,idx));
      const arc=DEG_PER_NAK; const subArcs=seq.map(d=>arc*(d.years/120));
      const within=mod(deg,DEG_PER_NAK); let acc=0;
      for(let i=0;i<subArcs.length;i++){ acc+=subArcs[i]; if(within<acc) return seq[i].lord; }
      return seq.at(-1).lord;
    }

    function renderTable(planets){
      const tbody=document.getElementById('tbl'); tbody.innerHTML='';
      planets.forEach(p=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td><b>${p.name}</b></td>
          <td>${dms(p.degree)}</td>
          <td>${signOf(p.degree)}</td>
          <td>${NAKS[nakIndex(p.degree)]}</td>
          <td>${padaOf(p.degree)}</td>
          <td>${starLordOf(p.degree)}</td>
          <td><b style="color:#2df3c2">${subLordOf(p.degree)}</b></td>`;
        tbody.appendChild(tr);
      });
    }

    function renderWheel(planets){
      const W=520,H=520,Cx=W/2,Cy=H/2,R=195;
      let sectors='',labels='',dots='';
      for(let i=0;i<12;i++){
        const a1=(i*30-90)*Math.PI/180,a2=((i+1)*30-90)*Math.PI/180;
        const x1=Cx+R*Math.cos(a1),y1=Cy+R*Math.sin(a1),x2=Cx+R*Math.cos(a2),y2=Cy+R*Math.sin(a2);
        sectors+=`<path d="M${Cx},${Cy} L${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} Z" fill="none" stroke="#1a2c44" stroke-width="2"/>`;
      }
      for(let i=0;i<12;i++){
        const a=((i*30+15)-90)*Math.PI/180; const x=Cx+(R-16)*Math.cos(a), y=Cy+(R-16)*Math.sin(a);
        labels+=`<text x="${x}" y="${y+4}" font-size="11" text-anchor="middle" fill="#bfe1ff">${SIGNS[i]}</text>`;
      }
      planets.forEach(p=>{
        const a=(p.degree-90)*Math.PI/180; const r=R-34; const x=Cx+r*Math.cos(a), y=Cy+r*Math.sin(a);
        const rk=(p.name==='Rahu'||p.name==='Ketu');
        dots+=`<g><circle cx="${x}" cy="${y}" r="8" fill="#0e1626" stroke="${rk?'#e6b2ff':'#60a5fa'}" stroke-width="2"/>`+
              `<text x="${x}" y="${y+3}" font-size="9.5" text-anchor="middle" fill="#cdeafe">${p.name[0]}</text></g>`;
      });
      document.getElementById('wheel').innerHTML =
        `<svg viewBox="0 0 ${W} ${H}"><circle cx="${Cx}" cy="${Cy}" r="${R+24}" fill="rgba(7,18,34,.96)"/>${sectors}${labels}${dots}</svg>`;
    }

    // demo planets (replace with API/lib later)
    const planets=[{name:'Sun',degree:123.456},{name:'Moon',degree:200.123},{name:'Mercury',degree:305.432},{name:'Venus',degree:271.111},{name:'Mars',degree:18.876},{name:'Jupiter',degree:84.333},{name:'Saturn',degree:342.25},{name:'Rahu',degree:45.876},{name:'Ketu',degree:225.876}];

    function generate(){
      document.getElementById('status').textContent='✓ Chart generated (demo data)';
      renderTable(planets); renderWheel(planets);
    }
    document.getElementById('genBtn').addEventListener('click', generate);
    // Initial render so UI not empty
    generate();
  </script>
</body>
</html>
