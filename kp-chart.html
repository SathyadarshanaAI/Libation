<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KP Chart Generator | Lebetion</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Your site styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Leaflet (street map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <main>
    <h1>KP Chart Generator</h1>

    <form id="kpForm">
      <div class="form-row">
        <label>Name<br><input type="text" id="name" required></label>
        <label>Date of Birth<br><input type="date" id="dob" required></label>
      </div>

      <div class="form-row">
        <label>Time of Birth<br><input type="time" id="tob" required></label>
        <label>Place of Birth<br><input type="text" id="pob" required placeholder="e.g. Colombo"></label>
      </div>

      <!-- 🔽 Map lives here -->
      <label>Pick on Map</label>
      <div id="map"></div>

      <div class="form-row">
        <label>
          Time Zone<br>
          <input type="text" id="timezone" required placeholder="+05:30">
          <button type="button" id="detectTzBtn" style="margin-top:6px;">Auto Detect</button>
        </label>
        <label>Question<br><input type="text" id="question"></label>
      </div>

      <button type="submit">Generate Chart</button>
    </form>

    <div id="loading" style="display:none;">Calculating…</div>
    <div id="resultMsg"></div>

    <div class="chart-section">
      <canvas id="astroChart" width="360" height="360"></canvas>
      <div id="planetTable"></div>
    </div>

    <footer>
      <small>Powered by NASA Horizons • Lebetion KP Chart • 2025</small>
    </footer>
  </main>

  <!-- Leaflet JS BEFORE your app JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="kp-chart.js"></script>
</body>
</html>
