<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KP Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 25px #38bdf8;
      width: 350px;
    }
    .card h3 {
      color: #7dd3fc;
      margin-bottom: 10px;
    }
    iframe, audio {
      width: 100%;
    }
    textarea {
      width: 100%;
      height: 100px;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }
    button {
      margin-top: 10px;
      background: #38bdf8;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🔮 KP Life Path Dashboard</h1>
  <div class="dashboard">
    <!-- KP Sub Lord Calculator -->
    <div class="card">
      <h3>🔢 Sub Lord Calculator</h3>
      <iframe src="kp-sub-lord-calculator.html" height="260"></iframe>
    </div><!-- Voice Summary -->
<div class="card">
  <h3>🗣️ Voice Summary</h3>
  <textarea id="voiceText" placeholder="Enter your summary..."></textarea>
  <button onclick="playVoice()">🔊 Play</button>
  <audio id="voicePlayer" controls hidden></audio>
</div>

<!-- PDF Generator -->
<div class="card">
  <h3>📝 Generate PDF</h3>
  <textarea id="pdfText" placeholder="Write PDF summary here..."></textarea>
  <button onclick="downloadPDF()">📄 Download PDF</button>
</div>

  </div>  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>  <script>
    function playVoice() {
      const text = document.getElementById("voiceText").value;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      speechSynthesis.speak(utterance);
    }

    function downloadPDF() {
      const content = document.getElementById("pdfText").value;
      const element = document.createElement("div");
      element.innerHTML = `<h1>KP Report</h1><p>${content}</p>`;
      html2pdf().from(element).save("KP_Report.pdf");
    }
  </script></body>
</html>
