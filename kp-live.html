<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Live Chart - Sathyadarshana</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at center, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
    }
    h1 { margin-top: 1rem; }

    #chart {
      width: 300px;
      height: 300px;
      margin: 1.5rem auto;
      background: #0a0f1f;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 40px #38bdf8;
    }
    .planet {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    #report-output {
      background: rgba(30,41,59,0.7);
      padding: 1rem;
      border-radius: 12px;
      margin: 1rem auto;
      max-width: 420px;
      font-size: 1rem;
      opacity: 1;
      transition: opacity 0.4s ease-in-out, box-shadow 0.6s ease-in-out;
      box-shadow: 0 0 15px #0ea5e9;
    }

    button {
      margin: 0.5rem;
      padding: 0.7rem 1.5rem;
      border: none;
      font-size: 1.1rem;
      border-radius: 8px;
      background: linear-gradient(90deg, #16f0a7, #0ea5e9);
      cursor: pointer;
      color: #0f172a;
      transition: 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #16f0a7;
    }
  </style>
</head>
<body>
  <h1>KP Birth Chart (Live API)</h1>

  <div id="report-output">Select KP or Vedic Mode to view Sub Lord updates.</div>
  <div id="chart"></div>

  <button onclick="setMode('KP')">KP Mode</button>
  <button onclick="setMode('Vedic')">Vedic Mode</button>
  <button onclick="refreshPositions()">Refresh Planet Positions</button>

  <script>
    let mode = 'KP';
    const chart = document.getElementById('chart');
    const output = document.getElementById('report-output');

    let planets = [
      { name: 'Sun', color: 'yellow', degree: 30 },
      { name: 'Moon', color: 'lime', degree: 70 },
      { name: 'Mercury', color: 'cyan', degree: 140 },
      { name: 'Venus', color: 'pink', degree: 200 },
      { name: 'Mars', color: 'red', degree: 250 },
      { name: 'Jupiter', color: 'orange', degree: 310 },
      { name: 'Saturn', color: 'gray', degree: 20 },
      { name: 'Rahu', color: 'green', degree: 180 },
      { name: 'Ketu', color: 'purple', degree: 340 }
    ];

    async function fetchLivePositions() {
      try {
        const today = new Date().toISOString().split('T')[0];
        const time = new Date().toTimeString().slice(0, 5);
        const lat = 7.8731, lon = 80.7718; // default: Sri Lanka center

        const res = await fetch(`/.netlify/functions/astro?lat=${lat}&lon=${lon}&date=${today}&time=${time}`);
        const data = await res.json();

        if (data && data.data && data.data.table && data.data.table.rows) {
          planets = data.data.table.rows.map(row => ({
            name: row.entry.name,
            color: pickColor(row.entry.name),
            degree: row.cells[0].position.ecliptic.declination.decimal
          }));
        }
      } catch (err) {
        console.error("Falling back to mock planetary data.", err);
      }
      drawChart();
    }

    function pickColor(name) {
      const map = {
        Sun: 'yellow', Moon: 'lime', Mercury: 'cyan', Venus: 'pink', Mars: 'red',
        Jupiter: 'orange', Saturn: 'gray', Rahu: 'green', Ketu: 'purple'
      };
      return map[name] || '#fff';
    }

    function drawChart() {
      chart.innerHTML = '';
      const radius = 130;
      planets.forEach(p => {
        const angle = p.degree % 360;
        const x = 150 + radius * Math.cos((angle - 90) * Math.PI / 180);
        const y = 150 + radius * Math.sin((angle - 90) * Math.PI / 180);
        const el = document.createElement('div');
        el.className = 'planet';
        el.style.background = p.color;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.title = `${p.name} (${angle.toFixed(1)}°)`;
        chart.appendChild(el);
      });
    }

    function setMode(selected) {
      mode = selected;
      output.style.opacity = 0;
      setTimeout(() => {
        output.innerHTML = `
          <h2 style="color:#16f0a7;">Mode: ${mode}</h2>
          <p style="color:#7dd3fc;">Sub Lord Calculation updating (live data)…</p>
        `;
        output.style.boxShadow = "0 0 25px #16f0a7";
        output.style.opacity = 1;
        setTimeout(() => { output.style.boxShadow = "0 0 15px #0ea5e9"; }, 800);
      }, 400);

      fetchLivePositions();
    }

    function refreshPositions() {
      fetchLivePositions();
      output.innerHTML = `<h2 style="color:#38bdf8;">Mode: ${mode}</h2>
        <p style="color:#7dd3fc;">Planet positions refreshed (Live API).</p>`;
    }

    drawChart();
  </script>
</body>
</html>
