<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KP Live Astrology Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
    }
    h1 {
      margin-top: 1rem;
      font-size: 2em;
      color: #7dd3fc;
      text-shadow: 0 0 12px #38bdf8;
    }
    section {
      max-width: 800px;
      margin: 2rem auto;
      background: rgba(30,41,59,0.85);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 0 20px rgba(56,189,248,0.3);
    }
    input, button {
      margin: 0.5rem;
      padding: 0.7rem;
      border: none;
      border-radius: 0.5rem;
      width: 80%;
      font-size: 1rem;
    }
    button {
      background: linear-gradient(90deg, #16f0a7, #0ea5e9);
      color: #0f172a;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: linear-gradient(90deg, #0ea5e9, #16f0a7);
      transform: scale(1.05);
    }
    #report-output {
      margin-top: 1.5rem;
      text-align: left;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>KP Live Report (NASA Data)</h1>
  <section>
    <input type="text" id="name" placeholder="Full Name">
    <input type="date" id="dob">
    <input type="time" id="tob">
    <input type="text" id="place" placeholder="Birth Place">
    <button onclick="generateKPReport()">Generate Live KP Report</button>
    <div id="report-output"></div>
  </section>

  <script>
    async function generateKPReport() {
      const name = document.getElementById('name').value;
      const dob = document.getElementById('dob').value;
      const tob = document.getElementById('tob').value;
      const place = document.getElementById('place').value;

      document.getElementById('report-output').innerText = "Fetching NASA planetary data...";

      try {
        const res = await fetch('/.netlify/functions/nasaKP', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, dob, tob, place })
        });
        const data = await res.json();

        document.getElementById('report-output').innerHTML =
          `<h2>Live KP Report</h2>
           <p><b>Name:</b> ${name}</p>
           <p><b>Date & Time:</b> ${dob} ${tob}</p>
           <p><b>Place:</b> ${place}</p>
           <hr>
           <pre>${JSON.stringify(data.planets, null, 2)}</pre>
           <button onclick="window.open('${data.pdfUrl}', '_blank')">Download PDF</button>`;
      } catch (err) {
        document.getElementById('report-output').innerText = "Error generating report: " + err.message;
      }
    }
  </script>
</body>
</html>
