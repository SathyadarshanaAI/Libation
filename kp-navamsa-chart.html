<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KP & Navamsa Charts | SathyadarshanaAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #000);
      color: #e0f2fe;
      margin: 0;
      padding: 1em;
      text-align: center;
    }
    h1 {
      color: #7dd3fc;
      text-shadow: 0 0 12px #38bdf8;
    }
    canvas {
      display: block;
      margin: 1.5em auto;
      background: rgba(15,23,42,0.8);
      border: 1px solid #38bdf8;
      border-radius: 1em;
      box-shadow: 0 0 25px rgba(56,189,248,0.2);
    }
    button {
      margin-top: 1.2em;
      padding: 0.8em 1.5em;
      border: none;
      border-radius: 1em;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56,189,248,0.4);
      transition: 0.3s;
    }
    button:hover {
      background: #16f0a7;
      box-shadow: 0 0 25px rgba(23,240,167,0.4);
    }
  </style>
</head>
<body>
  <h1>KP Lagna Wheel & Navamsa Chart</h1>
  <canvas id="kpChart" width="400" height="400"></canvas>
  <canvas id="navamsaChart" width="400" height="400"></canvas>
  <button onclick="exportPDF()">Export as PDF (Preview)</button>

  <script>
    const planets = [
      { name: "Sun", deg: 120 },
      { name: "Moon", deg: 240 },
      { name: "Mars", deg: 45 },
      { name: "Venus", deg: 300 },
      { name: "Jupiter", deg: 10 },
    ];

    function drawKPWheel() {
      const c = document.getElementById('kpChart');
      const ctx = c.getContext('2d');
      const r = c.width/2 - 20;
      const centerX = c.width/2, centerY = c.height/2;

      ctx.clearRect(0,0,c.width,c.height);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;

      // Draw 12 houses (30° each)
      for (let i=0; i<12; i++) {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        const angle = (i * 30) * Math.PI/180;
        ctx.lineTo(centerX + r * Math.cos(angle), centerY + r * Math.sin(angle));
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(centerX, centerY, r, 0, 2*Math.PI);
      ctx.stroke();

      // Plot planets
      planets.forEach(p => {
        const angle = (p.deg-90) * Math.PI/180; // rotate to start from Ascendant
        const x = centerX + (r-30) * Math.cos(angle);
        const y = centerY + (r-30) * Math.sin(angle);
        ctx.fillStyle = '#16f0a7';
        ctx.beginPath();
        ctx.arc(x,y,5,0,2*Math.PI);
        ctx.fill();
        ctx.fillStyle = '#e0f2fe';
        ctx.fillText(p.name, x+6, y);
      });
    }

    function drawNavamsa() {
      const c = document.getElementById('navamsaChart');
      const ctx = c.getContext('2d');
      ctx.clearRect(0,0,c.width,c.height);
      ctx.strokeStyle = '#16f0a7';
      ctx.lineWidth = 2;

      // Draw diamond grid (simplified Navamsa)
      const size = 160;
      const centerX = c.width/2, centerY = c.height/2;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY-size);
      ctx.lineTo(centerX+size, centerY);
      ctx.lineTo(centerX, centerY+size);
      ctx.lineTo(centerX-size, centerY);
      ctx.closePath();
      ctx.stroke();

      // Add cross lines
      ctx.beginPath();
      ctx.moveTo(centerX-size, centerY);
      ctx.lineTo(centerX+size, centerY);
      ctx.moveTo(centerX, centerY-size);
      ctx.lineTo(centerX, centerY+size);
      ctx.stroke();

      ctx.fillStyle = '#7dd3fc';
      ctx.fillText("Navamsa (Demo)", centerX-40, centerY+size+20);
    }

    function exportPDF() {
      alert("PDF Export coming soon (Step 4: Full Report)!");
    }

    drawKPWheel();
    drawNavamsa();
  </script>
</body>
</html>
