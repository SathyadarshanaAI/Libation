<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced KP Life Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e0f2fe; margin:0; }
    main { max-width: 540px; margin: 40px auto; border:1px solid #38bdf8; padding:24px; border-radius:8px; background:rgba(30,41,59,0.94);}
    label {display:block; margin-top:12px;}
    input, select, textarea, button {width:100%; margin-top:5px; padding:10px; border-radius:6px; border:none; font-size:15px;}
    button {background:#38bdf8; color:#0f172a; font-weight:bold; margin-top:18px; cursor:pointer;}
    button:hover {background:#0ea5e9; color:#fff;}
    .message {margin-top:12px; text-align:center; font-size:1em;}
    .tariff {margin-top:16px; text-align:center; color:#fbbf24; font-size:1.1em; font-weight:bold;}
    .spinner {display:none; margin:16px auto; border: 5px solid #bae6fd; border-top: 5px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;}
    @keyframes spin {100% {transform: rotate(360deg);}}
    .error {color: #f87171; font-size:0.9em;}
    .preview-box {background:#1e293b; color:#bae6fd; border-radius:8px; padding:18px; margin-top:16px; border:1px solid #38bdf8;}
    .rating {margin-top:18px; text-align:center;}
    .rating span {font-size:2em; cursor:pointer;}
    .rating .selected {color:#fbbf24;}
  </style>
</head>
<body>
<main id="report">
  <h1 style="text-align:center;color:#38bdf8;">Advanced KP Life Prediction</h1>
  <p style="text-align:center;color:#bae6fd;">AI-powered KP life report (Premium $5)</p>
  <form id="kpForm" autocomplete="off" novalidate>
    <label>Full Name</label>
    <input type="text" id="name" required>
    <div id="error-name" class="error"></div>
    <label>Date of Birth</label>
    <input type="date" id="dob" required>
    <div id="error-dob" class="error"></div>
    <label>Time of Birth</label>
    <input type="time" id="tob" required>
    <div id="error-tob" class="error"></div>
    <label>Place of Birth</label>
    <input type="text" id="pob" placeholder="City, Country" required>
    <div id="error-pob" class="error"></div>
    <label>Gender</label>
    <select id="gender" required>
      <option value="">Select...</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    <div id="error-gender" class="error"></div>
    <label>Email (optional)</label>
    <input type="email" id="email" placeholder="Email">
    <div id="error-email" class="error"></div>
    <label>Your Question (optional)</label>
    <textarea id="userQ" placeholder="Eg: When will I get married?" rows="2"></textarea>
    <label><input type="checkbox" id="consent" required> I consent to generate my KP life prediction report ($5 Premium)</label>
    <div id="error-consent" class="error"></div>
    <button type="button" id="previewBtn">Preview Report</button>
    <button type="submit">Download KP Life PDF</button>
  </form>

  <div class="spinner" id="spinner"></div>
  <div id="resultMsg" class="message"></div>
  <div class="preview-box" id="preview" style="display:none;"></div>

  <div class="rating" id="rating" style="display:none;">
    <span data-rate="1">&#9733;</span>
    <span data-rate="2">&#9733;</span>
    <span data-rate="3">&#9733;</span>
    <span data-rate="4">&#9733;</span>
    <span data-rate="5">&#9733;</span>
    <div id="rateMsg" style="margin-top:8px;"></div>
  </div>

  <div class="tariff">Premium Life Report – $5 (One-time)</div>
</main>

<script>
function showError(id, msg){ document.getElementById('error-'+id).textContent = msg; }
function clearErrors(){ ['name','dob','tob','pob','gender','email','consent'].forEach(id=>showError(id,'')); }
function validateForm(fields){
  clearErrors(); let valid=true;
  if(!fields.name){showError('name','Name is required.'); valid=false;}
  if(!fields.dob){showError('dob','Date of birth is required.'); valid=false;}
  if(!fields.tob){showError('tob','Time of birth is required.'); valid=false;}
  if(!fields.pob){showError('pob','Place of birth is required.'); valid=false;}
  if(!fields.gender){showError('gender','Select your gender.'); valid=false;}
  if(fields.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fields.email)){
    showError('email','Invalid email address.'); valid=false;
  }
  if(!fields.consent){showError('consent','You must consent for report generation.'); valid=false;}
  return valid;
}
function getPrediction(name,userQ){
  const lines=[
    "Shows strong determination and success in career.",
    "Will face positive turning points in personal life.",
    "Radiates positivity and adapts well to change.",
    "Achieves steady financial growth with effort."
  ];
  const random=arr=>arr[Math.floor(Math.random()*arr.length)];
  return `AI Life Insights for ${name}:\n• ${random(lines)}\n• ${random(lines)}\n${userQ ? "Your Question: "+userQ : ""}`;
}
document.getElementById('previewBtn').onclick=()=>{
  const f=getFields(); if(!validateForm(f))return;
  const txt=getPrediction(f.name,f.userQ);
  document.getElementById('preview').innerHTML=`<b>Name:</b> ${f.name}<br><b>DOB:</b> ${f.dob}<br><b>TOB:</b> ${f.tob}<br><b>Place:</b> ${f.pob}<hr><pre>${txt}</pre>`;
  document.getElementById('preview').style.display="block";
  document.getElementById('rating').style.display="block";
};
function getFields(){
  return {
    name:document.getElementById('name').value.trim(),
    dob:document.getElementById('dob').value,
    tob:document.getElementById('tob').value,
    pob:document.getElementById('pob').value.trim(),
    gender:document.getElementById('gender').value,
    email:document.getElementById('email').value.trim(),
    userQ:document.getElementById('userQ').value.trim(),
    consent:document.getElementById('consent').checked
  };
}
document.getElementById('kpForm').addEventListener('submit',function(e){
  e.preventDefault();
  const f=getFields(); if(!validateForm(f))return;
  document.getElementById('spinner').style.display='block';
  setTimeout(()=>{
    const report=`Sathyadarshana KP Life Report\n\nName: ${f.name}\nDOB: ${f.dob} Time: ${f.tob}\nPlace: ${f.pob}\nGender: ${f.gender}\n\n${getPrediction(f.name,f.userQ)}\n\nTariff: $5 Premium\nGenerated: ${new Date().toLocaleString()}`;
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF(); pdf.setFontSize(12); pdf.text(report,20,30);
    pdf.save(`${f.name.replace(/\s+/g,'_')}_KP_Report.pdf`);
    document.getElementById('spinner').style.display='none';
    document.getElementById('resultMsg').style.color="green";
    document.getElementById('resultMsg').textContent="Report generated!";
  },700);
});
document.querySelectorAll('#rating span').forEach(star=>{
  star.onclick=function(){
    const rate=this.dataset.rate;
    document.querySelectorAll('#rating span').forEach(s=>s.classList.remove('selected'));
    for(let i=1;i<=rate;i++){
      document.querySelector(`#rating span[data-rate="${i}"]`).classList.add('selected');
    }
    document.getElementById('rateMsg').textContent = `You rated this report ${rate} stars.`;
  };
});
</script>
</body>
</html>
