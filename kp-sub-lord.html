<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KP Sub Lord & Sub-Sub Lord 🌌</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      max-width: 500px;
      margin: auto;
    }
    input, select, button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.8rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    .result {
      margin-top: 1.5rem;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>KP Sub Lord & Sub-Sub Lord 🌌</h2>
    <label>Enter Planetary Degree (0° to 360°):</label>
    <input type="number" id="degree" min="0" max="360" step="0.01" placeholder="e.g., 273.58" />
    
    <label>Select Language:</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="si">සිංහල</option>
      <option value="ta">தமிழ்</option>
    </select>

    <button onclick="calculate()">Calculate</button>
    <div class="result" id="output"></div>
  </div>

  <script>
    const subLords = [
      "Kethu","Venus","Sun","Moon","Mars","Rahu","Jupiter","Saturn","Mercury"
    ];

    const translations = {
      en: {
        Kethu: "Ketu", Venus: "Venus", Sun: "Sun", Moon: "Moon", Mars: "Mars",
        Rahu: "Rahu", Jupiter: "Jupiter", Saturn: "Saturn", Mercury: "Mercury",
        sub: "Sub Lord", subsub: "Sub-Sub Lord"
      },
      si: {
        Kethu: "කේතු", Venus: "ශුක්‍රයා", Sun: "සූර්යයා", Moon: "සඳ", Mars: "අඟහරු",
        Rahu: "රාහු", Jupiter: "ගුරු", Saturn: "ශනී", Mercury: "බුද", 
        sub: "උප ආධිපති", subsub: "උප උප ආධිපති"
      },
      ta: {
        Kethu: "கேது", Venus: "சுக்ரன்", Sun: "சூரியன்", Moon: "சந்திரன்", Mars: "செவ்வாய்",
        Rahu: "ராகு", Jupiter: "குரு", Saturn: "சனி", Mercury: "புதன்",
        sub: "துணை ஆண்டவன்", subsub: "துணை-துணை ஆண்டவன்"
      }
    };

    const ranges = [
      13.2, 13.2, 6.8, 13.2, 6.8, 13.2, 13.2, 13.2, 6.8
    ];

    function getLordIndex(degree) {
      let total = 0;
      for (let i = 0; i < ranges.length; i++) {
        total += ranges[i];
        if (degree <= total) return i;
      }
      return ranges.length - 1;
    }

    function calculate() {
      const deg = parseFloat(document.getElementById("degree").value);
      const lang = document.getElementById("lang").value;
      if (isNaN(deg) || deg < 0 || deg > 360) {
        document.getElementById("output").innerText = "Invalid degree!";
        return;
      }

      const subIndex = getLordIndex(deg % 120);  // 120 for Dasha cycle pattern
      const subSubIndex = getLordIndex((deg * 3) % 120); // Arbitrary pattern

      const sub = translations[lang][subLords[subIndex]];
      const subsub = translations[lang][subLords[subSubIndex]];
      const labelSub = translations[lang]["sub"];
      const labelSubSub = translations[lang]["subsub"];

      document.getElementById("output").innerHTML = `
        ${labelSub}: ${sub}<br>
        ${labelSubSub}: ${subsub}
      `;
    }
  </script>
</body>
</html>
