<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KP Sub Lord Calculator</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      padding: 20px;
    }
    input, button {
      margin: 10px 0;
      padding: 8px;
      width: 100%;
    }
    #output {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>KP Sub Lord Calculator (Manual)</h2>

  <label for="degree">Enter Planetary Degree (0° to 360°):</label>
  <input type="number" id="degree" min="0" max="360" step="0.01" />

  <button onclick="calculateSubLord()">Calculate Sub Lord</button>

  <div id="output"></div>

  <script>
    function calculateSubLord() {
      const degree = parseFloat(document.getElementById("degree").value);
      let subLord = "";

      if (degree >= 0 && degree < 13.2) subLord = "Ketu";
      else if (degree < 26.4) subLord = "Venus";
      else if (degree < 39.6) subLord = "Sun";
      else if (degree < 52.8) subLord = "Moon";
      else if (degree < 66.0) subLord = "Mars";
      else if (degree < 79.2) subLord = "Rahu";
      else if (degree < 92.4) subLord = "Jupiter";
      else if (degree < 105.6) subLord = "Saturn";
      else if (degree < 118.8) subLord = "Mercury";
      else subLord = "Unknown";

      document.getElementById("output").innerHTML =
        `<strong>Sub Lord:</strong> ${subLord}`;
    }
  </script>
</body>
</html>
