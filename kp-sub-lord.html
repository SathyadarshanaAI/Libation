<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KP Sub Lord Calculator</title>
  <style>
    body {
      background-color: #0f172a;
      color: #e0f2fe;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    input, select, button {
      margin: 0.5rem;
      padding: 0.5rem;
      font-size: 1rem;
    }
    .result {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>KP Sub Lord & Sub-Sub Lord</h2>
  <label>Enter Planetary Degree (0° to 360°):</label><br>
  <input type="number" id="degree" min="0" max="360" /><br>

  <label>Select Language:</label><br>
  <select id="language">
    <option value="English">English</option>
    <option value="Sinhala">සිංහල</option>
    <option value="Tamil">தமிழ்</option>
  </select><br>

  <button onclick="calculate()">Find Sub Lords</button>
  <button onclick="speakResult()">🔊 Speak</button>

  <div class="result" id="result"></div>

  <script>
    const subLordData = [
      { start: 0, end: 13.333, sub: "Sun", subsub: "Moon" },
      { start: 13.334, end: 26.666, sub: "Moon", subsub: "Venus" },
      { start: 26.667, end: 40, sub: "Venus", subsub: "Mercury" },
      { start: 270, end: 300, sub: "Sun", subsub: "Rahu" }, // example for test
      { start: 300, end: 330, sub: "Mars", subsub: "Jupiter" },
      { start: 330, end: 360, sub: "Jupiter", subsub: "Saturn" }
    ];

    const translations = {
      Sun: { si: "සූර්යයා", ta: "சூரியன்" },
      Moon: { si: "චන්ද්‍රයා", ta: "சந்திரன்" },
      Mars: { si: "කුජ", ta: "செவ்வாய்" },
      Mercury: { si: "බුධයා", ta: "புதன்" },
      Jupiter: { si: "ගුරු", ta: "குரு" },
      Venus: { si: "ශුක්‍රයා", ta: "சுக்ரன்" },
      Saturn: { si: "ශනි", ta: "சனி" },
      Rahu: { si: "රාහු", ta: "ராகு" },
      Ketu: { si: "කේතු", ta: "கேது" }
    };

    let lastResult = "";
    let lastLang = "en";

    function calculate() {
      const degree = parseFloat(document.getElementById("degree").value);
      const lang = document.getElementById("language").value;
      if (isNaN(degree) || degree < 0 || degree > 360) {
        document.getElementById("result").innerText = "Invalid degree.";
        return;
      }

      const match = subLordData.find(d => degree >= d.start && degree <= d.end);
      if (!match) {
        document.getElementById("result").innerText = "No data.";
        return;
      }

      const sub = match.sub;
      const subsub = match.subsub;

      let display = "";
      if (lang === "Sinhala") {
        display = `අනුධිපති: ${translations[sub].si}, උප අනුධිපති: ${translations[subsub].si}`;
        lastResult = display;
        lastLang = "si-LK";
      } else if (lang === "Tamil") {
        display = `உபநாதன்: ${translations[sub].ta}, துணை உபநாதன்: ${translations[subsub].ta}`;
        lastResult = display;
        lastLang = "ta-IN";
      } else {
        display = `Sub Lord: ${sub}, Sub-Sub Lord: ${subsub}`;
        lastResult = display;
        lastLang = "en-US";
      }

      document.getElementById("result").innerText = display;
    }

    function speakResult() {
      if (!lastResult) return;
      const msg = new SpeechSynthesisUtterance(lastResult);
      msg.lang = lastLang;
      window.speechSynthesis.speak(msg);
    }
  </script>
</body>
</html>
