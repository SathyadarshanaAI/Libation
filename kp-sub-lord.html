<!DOCTYPE html>  
<html lang="en">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
  <title>KP Sub Lord Calculator (Manual)</title>  
  <style>  
    body {  
      font-family: sans-serif;  
      background: #0f172a;  
      color: #e0f2fe;  
      padding: 20px;  
    }  
    input, button {  
      margin: 10px 0;  
      padding: 10px;  
      width: 100%;  
      border: none;  
      border-radius: 6px;  
      font-size: 1rem;  
    }  
    button {  
      background-color: #2563eb;  
      color: #fff;  
      cursor: pointer;  
    }  
    button:hover {  
      background-color: #1e40af;  
    }  
    #output {  
      margin-top: 20px;  
      background: #1e293b;  
      padding: 15px;  
      border-radius: 10px;  
      font-size: 1.1rem;  
    }  
  </style>  
</head>  
<body>  
  <h2>KP Sub Lord Calculator (Manual)</h2>  
  
  <label for="degree">Enter Planetary Degree (0° to 360°):</label>  
  <input type="number" id="degree" min="0" max="360" step="0.01" placeholder="e.g. 125.35" />  
  
  <button onclick="calculateSubLord()">Calculate Sub Lord</button>  
  
  <div id="output"></div>  
  
  <script>  
    function calculateSubLord() {
      const degree = parseFloat(document.getElementById("degree").value);
      const output = document.getElementById("output");

      if (isNaN(degree) || degree < 0 || degree > 360) {
        output.innerHTML = "❌ Please enter a degree between 0° and 360°.";
        return;
      }

      const subLords = ["Ketu", "Venus", "Sun", "Moon", "Mars", "Rahu", "Jupiter", "Saturn", "Mercury"];
      const subIndex = Math.floor((degree % 13.3333) / (13.3333 / 9));
      const subLord = subLords[subIndex];

      output.innerHTML = `
        <strong>Degree:</strong> ${degree.toFixed(2)}°<br>
        <strong>Sub Lord:</strong> ${subLord}
      `;
    }
  </script>  
</body>  
</html>
