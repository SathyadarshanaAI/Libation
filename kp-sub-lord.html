<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KP Sub-Lord Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #e0f2fe;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px #0ea5e9;
      width: 90%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #38bdf8;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background-color: #0ea5e9;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .result {
      background-color: #1e293b;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      color: #cbd5e1;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>KP Sub-Lord Calculator</h2>
    <label for="planet">Planet:</label>
    <select id="planet">
      <option>Sun</option><option>Moon</option><option>Mars</option>
      <option>Mercury</option><option>Jupiter</option>
      <option>Venus</option><option>Saturn</option>
    </select>

    <label for="degree">Degrees (0° - 30°):</label>
    <input type="number" id="degree" min="0" max="30" placeholder="E.g. 22.5" />

    <button onclick="calculate()">Calculate Sub-Lord</button>

    <div id="output" class="result"></div>
  </div>

  <script>
    function getNakshatraAndStarLord(degree) {
      if (degree < 13.2) return { nakshatra: "Ashwini", starLord: "Ketu" };
      else if (degree < 26.4) return { nakshatra: "Bharani", starLord: "Venus" };
      else return { nakshatra: "Krittika", starLord: "Sun" };
    }

    function getSubLordFromDegree(degreeInRashi, starLord) {
      const dashas = {
        Ketu: 7, Venus: 20, Sun: 6, Moon: 10,
        Mars: 7, Rahu: 18, Jupiter: 16, Saturn: 19, Mercury: 17
      };
      const totalYears = 120;
      const portionPerDasha = Object.entries(dashas).map(([lord, years]) => ({
        lord,
        portion: years / totalYears * 800
      }));

      let start = 0;
      for (const { lord, portion } of portionPerDasha) {
        const end = start + portion;
        if ((degreeInRashi * 60) >= start && (degreeInRashi * 60) < end) {
          return lord;
        }
        start = end;
      }
      return "Unknown";
    }

    function calculate() {
      const planet = document.getElementById("planet").value;
      const degree = parseFloat(document.getElementById("degree").value);
      if (isNaN(degree) || degree < 0 || degree > 30) {
        document.getElementById("output").innerText = "Please enter a valid degree (0° to 30°).";
        return;
      }

      const { nakshatra, starLord } = getNakshatraAndStarLord(degree);
      const subLord = getSubLordFromDegree(degree, starLord);

      const result = `🌠 Planet: ${planet}
📌 Degree: ${degree.toFixed(2)}°
🔯 Nakshatra: ${nakshatra}
👑 Star Lord: ${starLord}
🧙‍♂️ Sub-Lord: ${subLord}`;

      document.getElementById("output").innerText = result;
    }
  </script>
</body>
</html>
