<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KP Sub Sub-Lord Calculator</title>
  <style>
    body {
      background: #0f172a;
      color: #e0f2fe;
      font-family: sans-serif;
      padding: 20px;
    }
    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
    }
    label, input, select, button {
      display: block;
      width: 100%;
      margin-top: 10px;
    }
    button {
      background: #0ea5e9;
      color: black;
      font-weight: bold;
      padding: 10px;
      border: none;
      border-radius: 6px;
    }
    .result {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>KP Sub-Sub Lord Calculator</h2>
    <label for="planet">Planet:</label>
    <select id="planet">
      <option>Sun</option>
      <option>Moon</option>
      <option>Mars</option>
      <option>Mercury</option>
      <option>Jupiter</option>
      <option>Venus</option>
      <option>Saturn</option>
    </select>

    <label for="degree">Degree (0–30 in Sign):</label>
    <input type="number" id="degree" placeholder="E.g., 17.5" step="0.01" min="0" max="30">

    <button onclick="calculateKP()">Calculate</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    function calculateKP() {
      const planet = document.getElementById('planet').value;
      const degree = parseFloat(document.getElementById('degree').value);
      let nakshatra = '', starLord = '', subLord = '', subSubLord = '';

      if (degree >= 13.2 && degree < 26.4) {
        nakshatra = "Bharani";
        starLord = "Venus";

        // Rough example for sub + sub-sub (need accurate table later)
        if (degree < 16) {
          subLord = "Sun";
          subSubLord = "Mercury";
        } else if (degree < 20) {
          subLord = "Saturn";
          subSubLord = "Moon";
        } else {
          subLord = "Mars";
          subSubLord = "Jupiter";
        }
      } else {
        document.getElementById("result").innerText = "Try with Bharani Nakshatra (13.2°–26.4°)";
        return;
      }

      const resultText = `
🌌 Planet: ${planet}
📍 Degree: ${degree.toFixed(2)}°
🌟 Nakshatra: ${nakshatra}
🪐 Star Lord: ${starLord}
🔸 Sub Lord: ${subLord}
🔹 Sub Sub Lord: ${subSubLord}
      `;
      document.getElementById('result').innerText = resultText;
    }
  </script>
</body>
</html>
