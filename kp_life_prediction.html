<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced KP Life Prediction</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e0f2fe; margin:0; }
    main { max-width: 540px; margin: 40px auto; border:1px solid #38bdf8; padding:24px; border-radius:8px; background:rgba(30,41,59,0.94);}
    label {display:block; margin-top:12px;}
    input, select, textarea, button {width:100%; margin-top:5px; padding:10px; border-radius:6px; border:none; font-size:15px;}
    button {background:#38bdf8; color:#0f172a; font-weight:bold; margin-top:18px; cursor:pointer;}
    button:hover {background:#0ea5e9; color:#fff;}
    .message {margin-top:12px; text-align:center; font-size:1em;}
    .tariff {margin-top:16px; text-align:center; color:#fbbf24; font-size:1.1em; font-weight:bold;}
    .spinner {display:none; margin:16px auto; border: 5px solid #bae6fd; border-top: 5px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;}
    @keyframes spin {100% {transform: rotate(360deg);}}
    .error {color: #f87171;}
    .fade-out {animation: fadeOut 1.5s forwards;}
    @keyframes fadeOut {to {opacity: 0;}}
    .lang-switch {position:absolute; top:18px; right:24px;}
    @media (max-width: 600px) {
      main {margin:8px; padding:10px;}
      .lang-switch {position:static; float:right;}
    }
    .preview-box {background:#1e293b; color:#bae6fd; border-radius:8px; padding:18px; margin-top:16px; border:1px solid #38bdf8;}
    .rating {margin-top:18px; text-align:center;}
    .rating span {font-size:2em; cursor:pointer;}
    .rating .selected {color:#fbbf24;}
    footer {text-align:center; margin-top:24px; padding:12px; color:#94a3b8; font-size:0.9em;}
  </style>
</head>
<body>
<div class="lang-switch">
  <button id="langBtn" style="padding:6px 16px; border-radius:6px; border:none; background:#38bdf8; color:#0f172a;">සිංහල</button>
</div>
<main id="report">
  <h1 id="title" style="text-align:center;color:#38bdf8;">Advanced KP Life Prediction</h1>
  <p id="subtitle" style="text-align:center;color:#bae6fd;">AI-powered KP life report (Premium $5)</p>
  <form id="kpForm" autocomplete="off" novalidate>
    <label id="lblName">Full Name</label>
    <input type="text" id="name" required>
    <div id="error-name" class="error"></div>
    <label id="lblDob">Date of Birth</label>
    <input type="date" id="dob" required>
    <div id="error-dob" class="error"></div>
    <label id="lblTob">Time of Birth</label>
    <input type="time" id="tob" required>
    <div id="error-tob" class="error"></div>
    <label id="lblPob">Place of Birth</label>
    <input type="text" id="pob" placeholder="City, Country" required>
    <div id="error-pob" class="error"></div>
    <label id="lblGender">Gender</label>
    <select id="gender" required>
      <option value="">Select...</option>
      <option id="male">Male</option>
      <option id="female">Female</option>
      <option id="other">Other</option>
    </select>
    <div id="error-gender" class="error"></div>
    <label id="lblAstro">Astrologer</label>
    <select id="astro">
      <option value="">Select astrologer...</option>
      <option>Sathyadarshana</option>
      <option>Budhika</option>
      <option>Chathura</option>
      <option>Guest Astrologer</option>
    </select>
    <label id="lblEmail">Email (optional)</label>
    <input type="email" id="email" placeholder="Email">
    <div id="error-email" class="error"></div>
    <label id="lblQ">Your Question (optional)</label>
    <textarea id="userQ" placeholder="Eg: When will I get married?" rows="2"></textarea>
    <label><input type="checkbox" id="consent" required> <span id="lblConsent">I consent to generate my KP life prediction report ($5 Premium)</span></label>
    <div id="error-consent" class="error"></div>
    <button type="button" id="previewBtn">Preview Report</button>
    <button type="submit">Download KP Life PDF</button>
  </form>
  <div class="spinner" id="spinner"></div>
  <div id="resultMsg" class="message"></div>
  <div class="preview-box" id="preview" style="display:none;"></div>
  <div class="rating" id="rating" style="display:none;">
    <span data-rate="1">&#9733;</span>
    <span data-rate="2">&#9733;</span>
    <span data-rate="3">&#9733;</span>
    <span data-rate="4">&#9733;</span>
    <span data-rate="5">&#9733;</span>
    <div id="rateMsg" style="margin-top:8px;"></div>
  </div>
  <div class="tariff" id="tariff">Premium Life Report – $5 (One-time)</div>
</main>
<footer>
  © 2025 Sathyadarshana – All Rights Reserved | Concept by Anurudda | Built by Buddhi AI.  
  <strong>Unauthorized copying, resale, or distribution is strictly prohibited.</strong>
</footer>
<script>
  // (JS remains same as before, handling language toggle, validation, prediction, PDF, and rating)
</script>
</body>
</html>
