// --- Geocoding + Timezone (OpenStreetMap + TimeZoneDB demo [API KEY required, free limited]) ---
async function getLatLongAndTimezone(place) {
  // 1. Geocode
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`;
  try {
    const res = await fetch(url); const data = await res.json();
    if (data && data.length > 0) {
      const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
      // 2. Timezone (TimeZoneDB, GeoNames, or Google TimeZone API)
      // --- DEMO with TimeZoneDB (get your API key from https://timezonedb.com/api)
      const tzkey = "YOUR_TIMEZONEDB_API_KEY"; // <-- ADD your API Key
      let tz = "";
      try {
        const tzr = await fetch(`https://api.timezonedb.com/v2.1/get-time-zone?key=${tzkey}&format=json&by=position&lat=${lat}&lng=${lon}`);
        const tzd = await tzr.json();
        if (tzd && tzd.status=="OK") tz = tzd.zoneName;
      } catch(e) {}
      return { lat, lon, tz: tz || "Unknown" };
    }
  } catch (e) {}
  return { lat: "", lon: "", tz: "" };
}

document.getElementById('mapBtn').addEventListener('click', async e => {

  document.getElementById('lat').value = "...";

  const result = await getLatLongAndTimezone(place);
  document.getElementById('lat').value = result.lat;
  document.getElementById('lon').value = result.lon;
  document.getElementById('timezone').value = result.tz;
});

// --- Planetary Positions (NASA Horizons) ---
const planetList = [
  { name: "Sun", id: "10", color: "#FFD700" },
  { name: "Moon", id: "301", color: "#F5F3CE" },
  { name: "Mercury", id: "199", color: "#A9A9A9" },
  { name: "Venus", id: "299", color: "#FFB6C1" },
  { name: "Mars", id: "499", color: "#D94F4F" },
  { name: "Jupiter", id: "599", color: "#F7C873" },
  { name: "Saturn", id: "699", color: "#E5C07B" }
];
async function getPlanetLongitude(dateStr, timeStr, lat, lon, planetId) {
  const datetime = `${dateStr} ${timeStr}`;
  const params = new URLSearchParams({
    format:'json', COMMAND:`'${planetId}'`, EPHEM_TYPE:'OBSERVER',
    SITE_COORD:`'${lon},${lat},0'`, START_TIME:`'${datetime}'`, STOP_TIME:`'${datetime}'`,
    STEP_SIZE:"'1 d'", QUANTITIES:"'1,2,3,4,20'", CSV_FORMAT:'YES'
  });
  try {
    const res = await fetch(`https://ssd.jpl.nasa.gov/api/horizons.api?${params}`);
    const data = await res.json();
    if (data.result) {
      const line = data.result.split("\n").find(l => /^[0-9]/.test(l));
      if (line) return parseFloat(line.trim().split(",")[4]);
    }
  } catch(e){}
  return null;
}
async function getAllPlanets(dateStr,timeStr,lat,lon){
  const arr=[]; for(const p of planetList){const d=await getPlanetLongitude(dateStr,timeStr,lat,lon,p.id); if(d!==null) arr.push({...p,degree:d});}
  return arr;
}

// --- Draw Chart ---
function drawAstroChart(planets){
  const c=document.getElementById('astroChart'),x=c.getContext('2d');
  x.clearRect(0,0,400,400);
  x.beginPath(); x.arc(200,200,150,0,2*Math.PI); x.strokeStyle="#333"; x.lineWidth=3; x.stroke();
  for(let i=0;i<12;i++){let a=(i*30-90)*Math.PI/180;x.beginPath();x.moveTo(200,200);x.lineTo(200+150*Math.cos(a),200+150*Math.sin(a));x.strokeStyle="#aaa";x.stroke();}
  planets.forEach(p=>{let a=((p.degree%360)-90)*Math.PI/180;let px=200+130*Math.cos(a),py=200+130*Math.sin(a);
    x.beginPath();x.arc(px,py,10,0,2*Math.PI);x.fillStyle=p.color;x.fill();x.fillStyle="#222";x.font="bold 12px Arial";x.fillText(p.name,px-12,py-15);});
}

  let prompt = `
KP astrology life report, 100% detailed, in ${lang}.
Birth info: National ID: ${data.nic}, Name: ${data.name}, Gender: ${data.gender}, DOB: ${data.dob}, TOB: ${data.tob}, Place: ${data.pob}, Lat: ${data.lat}, Lon: ${data.lon}, Timezone: ${data.tz}.
Main Question: ${mainQ}
Planets: ${planetTxt}.
Tariff: ${tariff}.
Give a life-story from birth to death, analyzing all major Dasha, Bhukti and Antara periods, year by year.
Discuss key events (education, career, love, marriage, children, diseases, wealth, property, longevity, death), with KP reasoning for good/bad outcomes.
Timeline: split life into Dasha/Bhukti/Antara periods (as small as possible).
If Premium, add daily predictions for 1 year and AI guidance too.
Use narrative, with a table of events. End with a positive note. Language: ${lang}.
`;
  // --- OpenAI API call (DEMO: replace with your own key/backend/proxy!) ---
  const apiKey = "YOUR_OPENAI_API_KEY"; // <-- ADD your key/proxy!
  try {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model:"gpt-3.5-turbo",
        messages:[{role:"user",content:prompt}],
        temperature:0.7,
        max_tokens: 1500
      })
    });
    const data = await res.json();
    if(data.choices && data.choices[0]) return data.choices[0].message.content.trim();
    return "AI service unavailable right now.";
  } catch(e){
    return "AI astrology analysis unavailable (demo mode).";
  }
}

  doc.text(`${dict[currLang].lbl_q}: ${user.userQ}`,14,78);

  let y=86; doc.text("Planets:",14,y);
  planets.forEach(p=>{y+=6; doc.text(`${p.name}: ${p.degree.toFixed(2)}°`,18,y);});
  y+=9; doc.setFontSize(13); doc.setFont("helvetica","bold"); doc.text("AI Life Story:",14,y);
  doc.setFont("helvetica","normal"); doc.setFontSize(11);
  let aiLines = aiText.match(/.{1,88}/g) || [aiText];
  aiLines.forEach(l=>{y+=6; doc.text(l,14,y); if(y>280){doc.addPage();y=20;}});
  // Chart as image:
  y+=7;
  try{
    let canvas = document.getElementById('astroChart');
    let img = canvas.toDataURL("image/jpeg",1.0);
    doc.addPage();
    doc.setFontSize(16); doc.text("KP Chart",14,20);
    doc.addImage(img,"JPEG",30,30,150,150);
  }catch{}
  doc.save("KP_AI_Chart_Report.pdf");
}

// --- Form Event ---
document.getElementById('kpForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const nic=document.getElementById('nic').value.trim();
  const name=document.getElementById('name').value.trim();
  const gender=document.getElementById('gender').value;
  const dob=document.getElementById('dob').value;
  const tob=document.getElementById('tob').value;
  const pob=document.getElementById('pob').value.trim();
  const lat=document.getElementById('lat').value.trim();
  const lon=document.getElementById('lon').value.trim();
  const tz=document.getElementById('timezone').value.trim();
  const userQ=document.getElementById('userQ').value.trim();
  document.getElementById('resultMsg').textContent='Loading...';
  if(!lat || !lon || !tz || lat=="..." || lon=="..." || tz=="...") {
    document.getElementById('resultMsg').textContent='Please fetch coordinates & timezone first!';
    return;
  }
  const planets=await getAllPlanets(dob,tob,lat,lon);
  if(planets.length===0){document.getElementById('resultMsg').textContent='Planetary data unavailable';return;}
  drawAstroChart(planets);
  document.getElementById('resultMsg').textContent='AI analysis running...';
  const tariff = document.getElementById('tariffBox').innerText;
  const aiText = await getAIReport({nic,name,gender,dob,tob,pob,lat,lon,tz,userQ},currLang,userQ,planets,tariff);
  document.getElementById('aiPrediction').style.display='block';
  document.getElementById('aiPrediction').textContent=aiText;
  document.getElementById('resultMsg').textContent='Download started...';
  await exportPDF({nic,name,gender,dob,tob,pob,lat,lon,tz,userQ},planets,aiText);
  document.getElementById('resultMsg').textContent='Done! (Full detail for paid users)';
});
drawAstroChart([]);
</script>
