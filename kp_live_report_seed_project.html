<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced KP Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e0f2fe; margin:0; }
    main { max-width: 540px; margin: 40px auto; border: 1px solid #38bdf8; padding: 24px;
      border-radius: 8px; background: rgba(30,41,59,0.94); }
    h1 { color: #38bdf8; text-align:center; }
    label { margin-top: 12px; display:block; color:#bae6fd; }
    input, select, textarea, button { display: block; margin-bottom: 15px; width: 100%; padding: 8px; font-size: 15px; border-radius:5px; }
    button { background:#38bdf8; color:#0f172a; font-weight:bold; border:none; cursor:pointer; }
    button:hover { background:#0ea5e9; color:#fff; }
    #astroChart { display: block; margin: 24px auto; background: #fff; border-radius: 50%; border: 1px solid #bbb;}
    .ai-prediction { background: #112; padding:12px; margin-top:15px; border-radius:8px; }
    .tariff { text-align:center; margin-top:1em; color:#7dd3fc; font-size:0.95em; }
    .support-btn {
      position: fixed; bottom: 20px; right: 20px;
      background: #38bdf8; color: #0f172a;
      padding: 0.7rem 1rem; border-radius: 2em;
      font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #38bdf8;
    }
    .support-btn:hover { background:#0ea5e9; color:#fff; }
  </style>
</head>
<body>
<main id="report">
  <h1>Advanced KP Edition</h1>
  <p style="text-align:center; color:#bae6fd;">AI-powered KP Report with planetary charts & insights.</p>
  <form id="kpForm" autocomplete="off">
    <label>Full Name</label>
    <input type="text" id="name" required>
    <label>Date of Birth</label>
    <input type="date" id="dob" required>
    <label>Time of Birth</label>
    <input type="time" id="tob" required>
    <label>Birth Place</label>
    <input type="text" id="pob" placeholder="City, Country" required>
    <label>Gender</label>
    <select id="gender" required>
      <option value="">Select...</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    <label>Email (optional)</label>
    <input type="email" id="email" placeholder="Email">
    <label>Your Main Question</label>
    <textarea id="userQ" placeholder="Eg: When will I get married?" rows="2"></textarea>
    <label><input type="checkbox" id="consent" required> I consent to share my birth data for report generation</label>
    <button type="submit" id="downloadBtn">Download Advanced KP PDF</button>
  </form>
  <div id="resultMsg" style="text-align:center; color:#fb7185;"></div>
  <canvas id="astroChart" width="400" height="400"></canvas>
  <div id="aiPrediction" class="ai-prediction" style="display:none;"></div>
  <div class="tariff"><strong>Tariff:</strong> Premium reports $5 per user (one-time).</div>
</main>

<!-- AI Buddhi Support Button -->
<div class="support-btn" onclick="window.location.href='/ai-buddhi.html';">💬 AI Buddhi</div>

<script>
// --- Geocoding (OpenStreetMap) ---
async function getLatLong(place) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`;
  try {
    const res = await fetch(url); const data = await res.json();
    if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
  } catch (e) {}
  return { lat: 6.9271, lon: 79.8612 }; // fallback (Colombo)
}

// --- Planetary Positions (NASA Horizons) ---
const planetList = [
  { name: "Sun", id: "10", color: "#FFD700" },
  { name: "Moon", id: "301", color: "#F5F3CE" },
  { name: "Mercury", id: "199", color: "#A9A9A9" },
  { name: "Venus", id: "299", color: "#FFB6C1" },
  { name: "Mars", id: "499", color: "#D94F4F" },
  { name: "Jupiter", id: "599", color: "#F7C873" },
  { name: "Saturn", id: "699", color: "#E5C07B" }
];
async function getPlanetLongitude(dateStr, timeStr, lat, lon, planetId) {
  const datetime = `${dateStr} ${timeStr}`;
  const params = new URLSearchParams({
    format:'json', COMMAND:`'${planetId}'`, EPHEM_TYPE:'OBSERVER',
    SITE_COORD:`'${lon},${lat},0'`, START_TIME:`'${datetime}'`, STOP_TIME:`'${datetime}'`,
    STEP_SIZE:"'1 d'", QUANTITIES:"'1,2,3,4,20'", CSV_FORMAT:'YES'
  });
  try {
    const res = await fetch(`https://ssd.jpl.nasa.gov/api/horizons.api?${params}`);
    const data = await res.json();
    if (data.result) {
      const line = data.result.split("\n").find(l => /^[0-9]/.test(l));
      if (line) return parseFloat(line.trim().split(",")[4]);
    }
  } catch(e){}
  return null;
}
async function getAllPlanets(dateStr,timeStr,lat,lon){
  const arr=[]; for(const p of planetList){const d=await getPlanetLongitude(dateStr,timeStr,lat,lon,p.id); if(d!==null) arr.push({...p,degree:d});}
  return arr;
}

// --- Zodiac Sign ---
function getZodiacSign(deg){
  const s=["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
  return s[Math.floor((deg%360)/30)];
}

// --- Draw Chart ---
function drawAstroChart(planets){
  const c=document.getElementById('astroChart'),x=c.getContext('2d');
  x.clearRect(0,0,400,400);
  x.beginPath(); x.arc(200,200,150,0,2*Math.PI); x.strokeStyle="#333"; x.lineWidth=3; x.stroke();
  for(let i=0;i<12;i++){let a=(i*30-90)*Math.PI/180;x.beginPath();x.moveTo(200,200);x.lineTo(200+150*Math.cos(a),200+150*Math.sin(a));x.strokeStyle="#aaa";x.stroke();}
  planets.forEach(p=>{let a=((p.degree%360)-90)*Math.PI/180;let px=200+130*Math.cos(a),py=200+130*Math.sin(a);
    x.beginPath();x.arc(px,py,10,0,2*Math.PI);x.fillStyle=p.color;x.fill();x.fillStyle="#222";x.font="bold 12px Arial";x.fillText(p.name,px-12,py-15);});
}

// --- Form Event ---
document.getElementById('kpForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=document.getElementById('name').value.trim();
  const dob=document.getElementById('dob').value;
  const tob=document.getElementById('tob').value;
  const pob=document.getElementById('pob').value.trim();
  const coords=await getLatLong(pob);
  const planets=await getAllPlanets(dob,tob,coords.lat,coords.lon);
  if(planets.length===0){document.getElementById('resultMsg').textContent='Planetary data unavailable';return;}
  drawAstroChart(planets);
  document.getElementById('resultMsg').style.color="green";
  document.getElementById('resultMsg').textContent='Report generated! (Download will start)';
});
drawAstroChart([]);
</script>
</body>
</html>
