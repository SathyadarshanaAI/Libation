<script>
// --- Geocoding (OpenStreetMap fallback) ---
async function getLatLong(place) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data && data.length > 0) {
      return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
    }
  } catch (e) {
    console.error("Geocode error", e);
  }
  return { lat: 6.9271, lon: 79.8612 }; // Default: Colombo
}

// --- Planetary Positions via Horizons Proxy (CORS Safe) ---
const planetList = [
  { name: "Sun", id: "10", color: "#FFD700" },
  { name: "Moon", id: "301", color: "#F5F3CE" },
  { name: "Mercury", id: "199", color: "#A9A9A9" },
  { name: "Venus", id: "299", color: "#FFB6C1" },
  { name: "Mars", id: "499", color: "#D94F4F" },
  { name: "Jupiter", id: "599", color: "#F7C873" },
  { name: "Saturn", id: "699", color: "#E5C07B" }
];

async function getPlanetLongitude(dateStr, timeStr, lat, lon, planetId) {
  const params = new URLSearchParams({
    COMMAND: `'${planetId}'`,
    EPHEM_TYPE: 'OBSERVER',
    SITE_COORD: `'${lon},${lat},0'`,
    START_TIME: `'${dateStr} ${timeStr}'`,
    STOP_TIME: `'${dateStr} ${timeStr}'`,
    STEP_SIZE: "'1 d'",
    QUANTITIES: "'1,2,3,4,20'",
    CSV_FORMAT: 'YES'
  });

  try {
    const res = await fetch(`/.netlify/functions/horizons?${params.toString()}`);
    const data = await res.json();
    if (data.result) {
      const line = data.result.split("\n").find(l => /^[0-9]/.test(l));
      if (line) return parseFloat(line.trim().split(",")[4]);
    }
  } catch (e) {
    console.error("Horizons error", e);
  }
  return null;
}

async function getAllPlanets(dateStr, timeStr, lat, lon) {
  const arr = [];
  for (const p of planetList) {
    const deg = await getPlanetLongitude(dateStr, timeStr, lat, lon, p.id);
    if (deg !== null) arr.push({ ...p, degree: deg });
  }
  return arr;
}

// --- Draw KP Chart ---
function drawAstroChart(planets) {
  const c = document.getElementById('astroChart');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 400, 400);

  // Outer circle
  ctx.beginPath();
  ctx.arc(200, 200, 150, 0, 2 * Math.PI);
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 3;
  ctx.stroke();

  // 12 houses
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(200, 200);
    ctx.lineTo(200 + 150 * Math.cos(a), 200 + 150 * Math.sin(a));
    ctx.strokeStyle = "#aaa";
    ctx.stroke();
  }

  // Planets
  planets.forEach(p => {
    const a = ((p.degree % 360) - 90) * Math.PI / 180;
    const x = 200 + 130 * Math.cos(a);
    const y = 200 + 130 * Math.sin(a);
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, 2 * Math.PI);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.fillStyle = "#222";
    ctx.font = "bold 12px Arial";
    ctx.fillText(p.name, x - 15, y - 15);
  });
}

// --- Form Submit ---
document.getElementById('kpForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const dob = document.getElementById('dob').value;
  const tob = document.getElementById('tob').value;
  const pob = document.getElementById('pob').value.trim();

  document.getElementById('resultMsg').style.color = "#7dd3fc";
  document.getElementById('resultMsg').textContent = "Generating report...";

  const coords = await getLatLong(pob);
  const planets = await getAllPlanets(dob, tob, coords.lat, coords.lon);

  if (planets.length === 0) {
    document.getElementById('resultMsg').style.color = "red";
    document.getElementById('resultMsg').textContent = "Planetary data unavailable.";
    return;
  }

  drawAstroChart(planets);
  document.getElementById('resultMsg').style.color = "green";
  document.getElementById('resultMsg').textContent = "Report generated!";
});
drawAstroChart([]);
</script>
