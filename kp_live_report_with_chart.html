<!DOCTYPE html>
<html>
<head>
  <title>KP Live Report with NASA Ephemeris & Chart</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif;}
    main { max-width: 500px; margin: 40px auto; border: 1px solid #ccc; padding: 24px; border-radius: 8px;}
    .message { margin-top: 15px; }
    input, button { display: block; margin-bottom: 15px; width: 100%; padding: 8px; }
    #astroChart { display: block; margin: 24px auto; background: #fff; border-radius: 50%; border: 1px solid #bbb;}
  </style>
</head>
<body>
<main id="report">
  <h1>KP Live Report</h1>
  <form id="kpForm" autocomplete="off">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="date" id="dob" required>
    <input type="time" id="tob" required>
    <input type="text" id="pob" placeholder="Birth Place" required>
    <button type="submit" id="downloadBtn">Download KP PDF</button>
  </form>
  <div class="message" id="resultMsg" style="color: rgb(251, 113, 133);"></div>
  <canvas id="astroChart" width="400" height="400"></canvas>
</main>
<script>
// 1. Geocoding: place name to lat/lon (OpenStreetMap Nominatim)
async function getLatLong(place) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`;
  try {
    const response = await fetch(url);
    const data = await response.json();
    if (data && data.length > 0) {
      return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
    } else {
      return { lat: 6.9271, lon: 79.8612 }; // Colombo fallback
    }
  } catch (err) {
    return { lat: 6.9271, lon: 79.8612 }; // fallback
  }
}

// 2. NASA Horizons API for planetary longitude
const planetList = [
  { name: "Sun", id: "10", color: "#FFD700" },
  { name: "Moon", id: "301", color: "#F5F3CE" },
  { name: "Mercury", id: "199", color: "#A9A9A9" },
  { name: "Venus", id: "299", color: "#FFB6C1" },
  { name: "Mars", id: "499", color: "#D94F4F" },
  { name: "Jupiter", id: "599", color: "#F7C873" },
  { name: "Saturn", id: "699", color: "#E5C07B" },
  { name: "Uranus", id: "799", color: "#7FFFD4" },
  { name: "Neptune", id: "899", color: "#5F9EA0" },
  { name: "Pluto", id: "999", color: "#B8860B" }
];
async function getPlanetLongitude(dateStr, timeStr, lat, lon, planetId) {
  // NASA expects UTC; for demo keep as local. For production, convert to UTC!
  const elevation = 0;
  const datetime = `${dateStr} ${timeStr}`;
  const params = new URLSearchParams({
    format: 'json',
    COMMAND: `'${planetId}'`,
    EPHEM_TYPE: 'OBSERVER',
    SITE_COORD: `'${lon},${lat},${elevation}'`,
    START_TIME: `'${datetime}'`,
    STOP_TIME: `'${datetime}'`,
    STEP_SIZE: "'1 d'",
    QUANTITIES: "'1,2,3,4,20,23,24,29,36,38,39,40,41'",
    CSV_FORMAT: 'YES'
  });
  const url = `https://ssd.jpl.nasa.gov/api/horizons.api?${params.toString()}`;
  try {
    const response = await fetch(url);
    const data = await response.json();
    // Parse longitude from CSV lines in "result"
    if (data.result) {
      const lines = data.result.split("\n");
      for (let l of lines) {
        if (l.match(/^[0-9]/)) {
          const fields = l.trim().split(",");
          const longitude = parseFloat(fields[4]); // 5th field: ObsEcLon
          return longitude;
        }
      }
    }
    return null;
  } catch (e) { return null; }
}
async function getAllPlanets(dateStr, timeStr, lat, lon) {
  const results = [];
  for (const p of planetList) {
    const degree = await getPlanetLongitude(dateStr, timeStr, lat, lon, p.id);
    results.push({ name: p.name, degree, color: p.color });
  }
  return results.filter(p => p.degree !== null);
}

// 3. Zodiac sign lookup
function getZodiacSign(degree) {
  const signs = [
    "Aries", "Taurus", "Gemini", "Cancer", "Leo", "Virgo",
    "Libra", "Scorpio", "Sagittarius", "Capricorn", "Aquarius", "Pisces"
  ];
  return signs[Math.floor(((degree % 360) / 30))];
}

// 4. Chart drawing (2D, Canvas)
function drawAstroChart(planets) {
  const canvas = document.getElementById('astroChart');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 400, 400);

  // Circle
  ctx.beginPath();
  ctx.arc(200, 200, 150, 0, 2 * Math.PI);
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Zodiac segments
  for (let i = 0; i < 12; i++) {
    let angle = (i * 30 - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(200, 200);
    ctx.lineTo(200 + 150 * Math.cos(angle), 200 + 150 * Math.sin(angle));
    ctx.strokeStyle = "#aaa";
    ctx.stroke();

    // Zodiac label
    ctx.save();
    ctx.translate(200, 200);
    ctx.rotate(angle + Math.PI / 12);
    ctx.textAlign = "center";
    ctx.font = "bold 13px Arial";
    ctx.fillStyle = "#333";
    ctx.fillText(getZodiacSign(i * 30 + 15), 0, -120);
    ctx.restore();
  }

  // Planets
  planets.forEach(p => {
    let angle = ((p.degree % 360) - 90) * Math.PI / 180;
    let x = 200 + 130 * Math.cos(angle);
    let y = 200 + 130 * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 11, 0, 2 * Math.PI);
    ctx.fillStyle = p.color || "#e74c3c";
    ctx.fill();
    ctx.font = "bold 12px Arial";
    ctx.fillStyle = "#222";
    ctx.fillText(p.name, x, y - 17);
    // Degree
    ctx.font = "10px Arial";
    ctx.fillStyle = "#444";
    ctx.fillText(p.degree !== undefined ? p.degree.toFixed(1) + "°" : "-", x, y + 21);
  });
}

// 5. PDF export with chart
async function downloadPDFwithChart(user, planets) {
  // Chart to image
  const canvas = document.getElementById('astroChart');
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation: "portrait", unit: "pt", format: "a4"});
  // Branding/Header
  pdf.setFontSize(18);
  pdf.text("Sathyadarshana KP Astrology Report", 40, 40);
  pdf.setFontSize(12);
  pdf.text("Powered by SathyadarshanaAI | www.sathyadarshana-ai.netlify.app", 40, 60);
  pdf.setLineWidth(0.5);
  pdf.line(40, 68, 555, 68);
  // User info
  pdf.setFontSize(12);
  pdf.text(`Name: ${user.name}`, 40, 90);
  pdf.text(`DOB: ${user.dob}`, 220, 90);
  pdf.text(`TOB: ${user.tob}`, 340, 90);
  pdf.text(`Place: ${user.pob}`, 40, 110);

  // Chart
  pdf.addImage(imgData, 'PNG', 80, 130, 400, 400);

  // Table
  pdf.setFontSize(11);
  let y = 550;
  pdf.text("Planet", 80, y);
  pdf.text("Degree", 160, y);
  pdf.text("Zodiac", 240, y);
  planets.forEach((p, idx) => {
    pdf.text(p.name, 80, y + 20 + idx * 18);
    pdf.text(p.degree !== undefined ? p.degree.toFixed(2) + "°" : "-", 160, y + 20 + idx * 18);
    pdf.text(getZodiacSign(p.degree), 240, y + 20 + idx * 18);
  });

  // Footer
  pdf.setFontSize(10);
  pdf.text("Tariff: Premium Service", 40, 800);
  pdf.text("Report Generated: " + new Date().toLocaleString(), 40, 814);

  pdf.save("KP_Report_Chart.pdf");
}

// 6. Main event
document.getElementById('kpForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const dob = document.getElementById('dob').value;
  const tob = document.getElementById('tob').value;
  const pob = document.getElementById('pob').value.trim();

  document.getElementById('resultMsg').style.color = "#888";
  document.getElementById('resultMsg').textContent = 'Generating report...';

  // 1. Geocode
  const coords = await getLatLong(pob);

  // 2. Get all graha longitudes
  const planets = await getAllPlanets(dob, tob, coords.lat, coords.lon);

  if (planets.length === 0) {
    document.getElementById('resultMsg').style.color = "red";
    document.getElementById('resultMsg').textContent = 'Could not get planetary data. Try again.';
    return;
  }

  // 3. Draw chart
  drawAstroChart(planets);

  // 4. PDF download
  await downloadPDFwithChart({ name, dob, tob, pob }, planets);

  document.getElementById('resultMsg').style.color = "green";
  document.getElementById('resultMsg').textContent = 'Report generated and downloaded!';
});

// Initial empty chart
drawAstroChart([]);
</script>
</body>
</html>
