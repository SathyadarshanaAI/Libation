<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sathyadarshana Digital Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.png">
  <style>
    body {margin:0; background:#0f172a; color:#e0f2fe; font-family:'Segoe UI',Arial,sans-serif;}
    header {text-align:center; padding:2rem 0 0.5rem 0;}
    header h1 {color:#38bdf8;}
    .home-btn {
      position:fixed; top:1.2rem; left:1.2rem; background:#38bdf8; color:#0f172a;
      padding:0.5rem 1rem; border-radius:1.5rem; font-size:1.1em; font-weight:bold;
      text-decoration:none; z-index:30; box-shadow:0 2px 12px #0f172a44; border:none; transition:background 0.2s; cursor:pointer;
    }
    .home-btn:hover {background:#0ea5e9; color:#e0f2fe;}
    .container {max-width: 820px; margin:2rem auto 2.7rem auto; background:#1e293b; border-radius:1.2rem; padding:2.2rem 1.5rem 2.5rem 1.5rem; box-shadow:0 4px 24px #0f172a55;}
    .search-row {display:flex; flex-wrap:wrap; gap:0.7em; align-items:center; margin-bottom:1.4em;}
    .search-row input[type="text"] {flex:1; font-size:1.08em; padding:0.62em 1em; border-radius:0.5em; border:none; background:#334155; color:#e0f2fe;}
    .search-row button, .filter-btn, .book-btn {
      font-size:1em; padding:0.53em 1.1em; border-radius:0.5em; border:none; background:#38bdf8; color:#0f172a; font-weight:bold; cursor:pointer; transition:background 0.2s;
    }
    .search-row button:hover, .filter-btn:hover, .book-btn:hover {background:#0ea5e9; color:#fff;}
    .filters {margin-bottom:1em; display:flex; flex-wrap:wrap; gap:0.7em;}
    .filter-btn.active {background:#fbbf24; color:#0f172a;}
    .section-title {color:#bae6fd; margin:2em 0 0.6em 0; font-size:1.15em;}
    .featured-list, .book-list, .fav-list {display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1.1em;}
    .book-card {
      background:rgba(8,47,73,0.91); border-radius:0.8em; box-shadow:0 0 10px #38bdf822; padding:1em;
      display:flex; flex-direction:column; align-items:flex-start; min-height:120px; position:relative;
    }
    .book-card .book-title {color:#38bdf8; font-weight:bold; font-size:1.05em;}
    .book-card .book-author {color:#94a3b8; font-size:0.97em;}
    .book-card .lang {position:absolute; top:0.6em; right:1em; background:#fbbf24; color:#0f172a; border-radius:0.5em; font-size:0.93em; padding:0.1em 0.7em;}
    .book-btn {margin-top:0.8em;}
    .add-book-row {margin-top:2em; background:rgba(56,189,248,0.08); border-radius:0.6em; padding:1em;}
    .add-book-row input {font-size:1em; padding:0.5em; border-radius:0.4em; border:none; margin-right:0.5em; background:#334155; color:#e0f2fe;}
    .add-book-row button {font-size:1em;}
    .fav-list {margin-top:1.4em;}
    .empty-msg {color:#fbbf24; text-align:center; margin:1.5em 0;}
    @media (max-width:600px){
      .container{padding:1.1rem 0.4rem 1.2rem 0.4rem;}
      .search-row {flex-direction:column; gap:0.5em;}
      .filters {flex-direction:column;}
    }
  </style>
</head>
<body>
  <a href="index.html" class="home-btn" title="Go Home">🏠 Home</a>
  <header>
    <h1>📚 Sathyadarshana Digital Library</h1>
    <div style="color:#bae6fd; margin-bottom:1.2em;">Global eBooks, Sacred Texts, and Knowledge Archives</div>
  </header>
  <div class="container">
    <!-- Search and Filters -->
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search books, author, or subject...">
      <button onclick="searchBooks()">🔍 Search</button>
      <button onclick="showFeatured()">🌟 Featured</button>
      <button onclick="showFavorites()">💖 My Favorites</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="filterLang('all',this)">All</button>
      <button class="filter-btn" onclick="filterLang('si',this)">සිංහල</button>
      <button class="filter-btn" onclick="filterLang('en',this)">English</button>
      <button class="filter-btn" onclick="filterLang('ta',this)">தமிழ்</button>
      <button class="filter-btn" onclick="filterCat('all',this)">All Categories</button>
      <button class="filter-btn" onclick="filterCat('spirituality',this)">Spirituality</button>
      <button class="filter-btn" onclick="filterCat('buddhism',this)">Buddhism</button>
      <button class="filter-btn" onclick="filterCat('ayurveda',this)">Ayurveda</button>
      <button class="filter-btn" onclick="filterCat('novel',this)">Novels</button>
      <button class="filter-btn" onclick="filterCat('science',this)">Science</button>
    </div>
    <!-- Book Results -->
    <div id="bookResults" class="book-list"></div>
    <!-- Featured Books -->
    <div id="featured" class="featured-list" style="display:none;"></div>
    <!-- Favorites -->
    <div id="favorites" class="fav-list" style="display:none;"></div>
    <!-- Add Book Option -->
    <div class="add-book-row">
      <input type="text" id="addBookTitle" placeholder="Suggest a Book Title">
      <input type="text" id="addBookLink" placeholder="Book Link (optional)">
      <button onclick="suggestBook()">Suggest Book</button>
      <span id="addBookMsg" style="margin-left:1em; color:#38bdf8;"></span>
    </div>
    <!-- AI Recommendations (demo) -->
    <div class="section-title">🤖 AI Recommendations (Demo)</div>
    <div id="aiRecs" class="book-list"></div>
  </div>
  <script>
    // --- Sample Data (replace with backend/books API as needed)
    const books = [
      {title:"Dhammapada", author:"Buddha", lang:"si", cat:"buddhism", link:"https://www.sacred-texts.com/bud/sbe10/index.htm"},
      {title:"Bhagavad Gita", author:"Vyasa", lang:"en", cat:"spirituality", link:"https://www.sacred-texts.com/hin/gita/index.htm"},
      {title:"Ayurveda Secrets", author:"Dr. Senanayake", lang:"si", cat:"ayurveda", link:"https://archive.org/details/ayurvedabook"},
      {title:"Sivananda Yoga", author:"Sivananda", lang:"en", cat:"spirituality", link:"https://www.sivananda.org/publications"},
      {title:"නිම්නේ මනරම් නවකතාව", author:"අනුරද්ද", lang:"si", cat:"novel", link:"https://archive.org/details/namana-novel"},
      {title:"The Selfish Gene", author:"Richard Dawkins", lang:"en", cat:"science", link:"https://archive.org/details/TheSelfishGene"},
      {title:"திருக்குறள்", author:"திருவள்ளுவர்", lang:"ta", cat:"spirituality", link:"https://ta.wikisource.org/wiki/திருக்குறள்"},
      {title:"Mahavamsa", author:"Mahanama", lang:"en", cat:"buddhism", link:"https://www.sacred-texts.com/bud/mahavamsa/index.htm"}
    ];
    const featuredBooks = [
      {title:"Dhammapada", author:"Buddha", lang:"si", cat:"buddhism", link:"https://www.sacred-texts.com/bud/sbe10/index.htm"},
      {title:"Bhagavad Gita", author:"Vyasa", lang:"en", cat:"spirituality", link:"https://www.sacred-texts.com/hin/gita/index.htm"},
      {title:"Mahavamsa", author:"Mahanama", lang:"en", cat:"buddhism", link:"https://www.sacred-texts.com/bud/mahavamsa/index.htm"},
    ];
    const aiRecs = [
      {title:"What the Buddha Taught", author:"Walpola Rahula", lang:"en", cat:"buddhism", link:"https://archive.org/details/whatthebuddhataught"},
      {title:"බුදු දහම", author:"අනෝම", lang:"si", cat:"buddhism", link:"https://archive.org/details/budu-dahama"}
    ];
    // --- State
    let currentLang = 'all', currentCat = 'all';
    // --- Render Book List
    function renderBooks(list, targetId){
      const el = document.getElementById(targetId);
      if(!list.length) { el.innerHTML = `<div class="empty-msg">No books found.</div>`; return; }
      let html = '';
      list.forEach(b=>{
        html += `<div class="book-card">
          <span class="lang">${b.lang == 'si' ? 'සිං' : b.lang == 'ta' ? 'தமிழ்' : 'EN'}</span>
          <div class="book-title">${b.title}</div>
          <div class="book-author">${b.author}</div>
          <a href="${b.link}" target="_blank" class="book-btn">Read</a>
          <button class="book-btn" onclick="addFavorite('${b.title.replace(/'/g,"\\'")}')">💖</button>
        </div>`;
      });
      el.innerHTML = html;
    }
    function searchBooks(){
      let q = document.getElementById('searchInput').value.trim().toLowerCase();
      let res = books.filter(b=>
        (currentLang=='all'||b.lang==currentLang) &&
        (currentCat=='all'||b.cat==currentCat) &&
        (b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q))
      );
      document.getElementById('featured').style.display = 'none';
      document.getElementById('favorites').style.display = 'none';
      renderBooks(res, 'bookResults');
    }
    function filterLang(lang,btn){
      currentLang = lang;
      Array.from(document.querySelectorAll('.filter-btn')).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      searchBooks();
    }
    function filterCat(cat,btn){
      currentCat = cat;
      Array.from(document.querySelectorAll('.filter-btn')).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      searchBooks();
    }
    function showFeatured(){
      document.getElementById('featured').style.display = 'grid';
      document.getElementById('favorites').style.display = 'none';
      document.getElementById('bookResults').innerHTML = '';
      renderBooks(featuredBooks, 'featured');
    }
    function addFavorite(title){
      let favs = JSON.parse(localStorage.getItem('favBooks')||'[]');
      if(!favs.includes(title)) favs.push(title);
      localStorage.setItem('favBooks', JSON.stringify(favs));
      alert('Added to favorites!');
    }
    function showFavorites(){
      let favs = JSON.parse(localStorage.getItem('favBooks')||'[]');
      let favBooks = books.filter(b=>favs.includes(b.title));
      document.getElementById('favorites').style.display = 'grid';
      document.getElementById('featured').style.display = 'none';
      document.getElementById('bookResults').innerHTML = '';
      renderBooks(favBooks, 'favorites');
    }
    function suggestBook(){
      let t = document.getElementById('addBookTitle').value.trim();
      let l = document.getElementById('addBookLink').value.trim();
      if(!t) {document.getElementById('addBookMsg').textContent="Enter book title!"; return;}
      document.getElementById('addBookMsg').textContent="Thank you! We'll review it.";
      document.getElementById('addBookTitle').value='';
      document.getElementById('addBookLink').value='';
    }
    // --- Render AI Recommendations
    renderBooks(aiRecs, 'aiRecs');
    // --- Initial load
    renderBooks(books, 'bookResults');
  </script>
</body>
</html>
