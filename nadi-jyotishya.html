<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nadi Jyotishya | Sathyadarshana</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
      overflow-x: hidden;
    }
    h1 {
      margin-top: 1rem;
      font-size: 2em;
      color: #7dd3fc;
      text-shadow: 0 0 12px #38bdf8;
    }
    .container {
      max-width: 700px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: rgba(30,41,59,0.8);
      border-radius: 1rem;
      box-shadow: 0 0 25px rgba(56,189,248,0.4);
      text-align: left;
    }
    label {
      display: block;
      margin-top: 1em;
      color: #7dd3fc;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 0.7em;
      margin-top: 0.5em;
      border-radius: 0.5em;
      border: none;
      font-size: 1em;
    }
    input {
      background: #1e293b;
      color: #e0f2fe;
      box-shadow: 0 0 8px #38bdf822;
    }
    button {
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1.5em;
      box-shadow: 0 0 12px #38bdf888;
      transition: all 0.3s ease-in-out;
    }
    button:hover {
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      color: #0f172a;
      transform: scale(1.05);
    }
    #result {
      margin-top: 1.5em;
      padding: 1rem;
      background: rgba(2,6,23,0.6);
      border-radius: 0.5em;
      box-shadow: 0 0 12px #38bdf855;
      display: none;
    }
    #lang-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 15px #0ea5e9;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <h1>Nadi Jyotishya</h1>
  <div class="container">
    <p>Ancient Nadi scriptures, KP astrology, and NASA data combined for deep insights into your past, present, and future with Buddhi AI.</p>
    
    <!-- Palmistry Upload -->
    <label for="handImage">Palm Image</label>
    <input type="file" id="handImage" accept="image/*">
    
    <!-- Nadi Details -->
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" required>
    
    <label for="time">Time of Birth</label>
    <input type="time" id="time" required>
    
    <label for="place">Place of Birth</label>
    <input type="text" id="place" placeholder="e.g., Anuradhapura" required>
    
    <button id="nadiBtn">Search Nadi Record</button>
    <div id="result"></div>
  </div>

  <!-- Language Globe -->
  <div id="google_translate_element" style="display:none;"></div>
  <button id="lang-btn">🌐</button>

  <script>
    // Disable right-click and shortcuts
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && ['c','u','s'].includes(e.key.toLowerCase())) e.preventDefault();
    });

    // Display placeholder results
    document.getElementById('nadiBtn').addEventListener('click', () => {
      const dob = document.getElementById('dob').value;
      const time = document.getElementById('time').value;
      const place = document.getElementById('place').value;
      const resultBox = document.getElementById('result');
      
      if (!dob || !time || !place) {
        resultBox.style.display = "block";
        resultBox.innerHTML = "<p style='color:#f87171'>Please fill out all fields.</p>";
        return;
      }

      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <p style="color:#7dd3fc">Buddhi AI analyzing Nadi data...</p>
        <p>Date: ${dob} | Time: ${time} | Place: ${place}</p>
        <p style="margin-top:0.5em; color:#cbd5e1;">Combining KP, NASA, and palmistry data for predictions...</p>
      `;
    });

    // Palmistry upload placeholder
    document.getElementById('handImage').addEventListener('change', function(e) {
      if(e.target.files && e.target.files[0]) {
        alert('Palmistry image uploaded! (AI analysis coming soon.)');
      }
    });

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,si,ta',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
    document.getElementById('lang-btn').addEventListener('click', () => {
      document.querySelector('.goog-te-gadget-simple').click();
    });
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
