<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA Linked Astrology Chart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #0f172a;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .form-card {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    input, select, button {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.75rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
    }
    button {
      background-color: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #2563eb;
    }
    #output {
      margin-top: 1.5rem;
      background-color: #0f172a;
      padding: 1rem;
      border-radius: 0.5rem;
    }
    #errorMessage {
      color: #f87171;
      font-size: 0.9rem;
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>🔭 NASA Linked Astrology Chart</h2>
    <input type="text" id="name" placeholder="Name" required />
    <input type="date" id="dob" required />
    <input type="time" id="birthTime" required />
    <input type="text" id="location" placeholder="Birthplace (City)" required />
    <button onclick="generateChart()">🪐 Generate Chart</button>
    <div id="errorMessage"></div>
    <div id="output"></div>
  </div>

  <script>
    async function generateChart() {
      const name = document.getElementById('name').value;
      const dob = document.getElementById('dob').value;
      const birthTime = document.getElementById('birthTime').value;
      const location = document.getElementById('location').value;

      const output = document.getElementById('output');
      const errorMessage = document.getElementById('errorMessage');
      output.innerHTML = '⏳ Loading NASA data...';
      errorMessage.innerText = '';

      try {
        // --- NASA dummy endpoint (replace with real one) ---
        const nasaUrl = `https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY`;

        const res = await fetch(nasaUrl);
        if (!res.ok) throw new Error('NASA API connection failed');
        const data = await res.json();

        // --- Example output (replace with actual astrology logic) ---
        output.innerHTML = `
          <strong>Name:</strong> ${name}<br>
          <strong>DOB:</strong> ${dob}<br>
          <strong>Time:</strong> ${birthTime}<br>
          <strong>Location:</strong> ${location}<br><br>
          ✅ NASA data received: ${data.title}
        `;
      } catch (err) {
        output.innerHTML = '';
        errorMessage.innerText = '❌ NASA API Error: ' + err.message;
      }
    }
  </script>

</body>
</html>
