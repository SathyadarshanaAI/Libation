<script>
const nakshatras = [
  { name: "Ashwini", ruler: "Ketu" }, { name: "Bharani", ruler: "Venus" },
  { name: "Krittika", ruler: "Sun" }, { name: "Rohini", ruler: "Moon" },
  { name: "Mrigashira", ruler: "Mars" }, { name: "Ardra", ruler: "Rahu" },
  { name: "Punarvasu", ruler: "Jupiter" }, { name: "Pushya", ruler: "Saturn" },
  { name: "Ashlesha", ruler: "Mercury" }, { name: "Magha", ruler: "Ketu" },
  { name: "Purva Phalguni", ruler: "Venus" }, { name: "Uttara Phalguni", ruler: "Sun" },
  { name: "Hasta", ruler: "Moon" }, { name: "Chitra", ruler: "Mars" },
  { name: "Swati", ruler: "Rahu" }, { name: "Vishakha", ruler: "Jupiter" },
  { name: "Anuradha", ruler: "Saturn" }, { name: "Jyeshtha", ruler: "Mercury" },
  { name: "Mula", ruler: "Ketu" }, { name: "Purva Ashadha", ruler: "Venus" },
  { name: "Uttara Ashadha", ruler: "Sun" }, { name: "Shravana", ruler: "Moon" },
  { name: "Dhanishta", ruler: "Mars" }, { name: "Shatabhisha", ruler: "Rahu" },
  { name: "Purva Bhadrapada", ruler: "Jupiter" }, { name: "Uttara Bhadrapada", ruler: "Saturn" },
  { name: "Revati", ruler: "Mercury" }
];
const subLords = ["Ketu","Venus","Sun","Moon","Mars","Rahu","Jupiter","Saturn","Mercury"];

function calcKP(degree) {
  // Normalize degree (0-360)
  const d = degree % 360;
  const nakIndex = Math.floor(d / 13.3333); 
  const nakshatra = nakshatras[nakIndex];

  // Sub Lord: Each nakshatra is divided into 9 parts (each ~1.48°)
  const nakStart = nakIndex * 13.3333;
  const withinNak = d - nakStart;
  const subIndex = Math.floor((withinNak / 13.3333) * 9);
  const subLord = subLords[subIndex] || "Unknown";

  return { nakshatra: nakshatra.name, starLord: nakshatra.ruler, subLord };
}

// Simulated planet degrees
const planets = [
  { name: "Sun", deg: 120.5 },
  { name: "Moon", deg: 240.1 },
  { name: "Mars", deg: 45.2 },
  { name: "Venus", deg: 300.3 },
  { name: "Jupiter", deg: 10.9 }
];

form.addEventListener('submit', function(e){
  e.preventDefault();
  reportBox.style.display = "block";
  kpTable.innerHTML = planets.map(p => {
    const kp = calcKP(p.deg);
    return `<tr>
      <td>${p.name}</td>
      <td>${p.deg.toFixed(2)}°</td>
      <td>${kp.nakshatra}</td>
      <td>${kp.starLord}</td>
      <td>${kp.subLord}</td>
    </tr>`;
  }).join('');
});
</script>
