<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Live Report (NASA Data)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
      padding: 30px;
    }
    h1 {
      font-size: 2em;
      color: #7dd3fc;
    }
    input, button {
      margin: 8px;
      padding: 10px;
      border-radius: 5px;
      border: none;
      font-size: 1em;
    }
    button {
      background: linear-gradient(to right, #00f5a0, #00d9f5);
      cursor: pointer;
    }
    button:hover { opacity: 0.8; }
    #output {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      min-height: 120px;
      text-align: left;
    }
    .watermark {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 12px;
      opacity: 0.15;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <h1>KP Live Report (NASA Data)</h1>
  <div>
    <input type="text" id="name" placeholder="Enter Name">
    <input type="date" id="dob">
    <input type="time" id="tob">
    <input type="text" id="pob" placeholder="Place of Birth">
    <button onclick="generateKPReport()">Generate Live KP Report</button>
  </div>

  <div id="output">Enter your birth details and click Generate.</div>
  <button id="downloadBtn" style="display:none;" onclick="downloadPDF()">Download PDF</button>
  <div class="watermark">Sathyadarshana.com | KP Live Report</div>

  <script>
    async function generateKPReport() {
      const name = document.getElementById("name").value;
      const dob = document.getElementById("dob").value;
      const tob = document.getElementById("tob").value;
      const pob = document.getElementById("pob").value;

      document.getElementById("output").innerText = "Fetching live planetary positions...";

      try {
        const res = await fetch('/.netlify/functions/nasaEphemeris', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dob, tob, pob })
        });
        const data = await res.json();

        if (data.error) {
          document.getElementById("output").innerText = "Failed to fetch planetary data.";
          return;
        }

        const planetList = Object.entries(data.data)
          .map(([planet, pos]) => `<li><b>${planet}:</b> ${pos}</li>`)
          .join("");

        document.getElementById("output").innerHTML = `
          <h3>KP Live Planetary Positions</h3>
          <p><b>Name:</b> ${name}</p>
          <p><b>DOB:</b> ${dob} | <b>TOB:</b> ${tob}</p>
          <p><b>Place:</b> ${pob}</p>
          <ul>${planetList}</ul>
        `;

        document.getElementById("downloadBtn").style.display = "inline-block";
      } catch (err) {
        document.getElementById("output").innerText = "Error fetching data.";
      }
    }

    function downloadPDF() {
      alert("PDF generation with watermark will be added next!");
    }
  </script>
</body>
</html>
