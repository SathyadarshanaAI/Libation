[build]
  publish = "./"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ✅ This fixes direct URL access like /quantom/chart.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
on:
  push:
    paths:
      - 'index.html'
      - 'astrology-hub.html'
      - 'astrology.html'
      - 'quamtem/**'
      - '.github/workflows/netlify.yml'
      - 'assets/**'
