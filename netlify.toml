[build]
  publish = "./"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ✅ This fixes direct URL access like /quantom/chart.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
