<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Screen Palm Scanner | SathyadarshanaAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      z-index: 3;
    }
    button {
      padding: 10px 18px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #16f0a7;
    }
  </style>
</head>
<body>
  <video id="camera" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="controls">
    <button id="toggleFlash">Flash On</button>
    <button id="switchHand">Switch Hand</button>
    <button id="capture">Capture</button>
  </div>
  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    let stream = null;
    let useRightHand = false;
    let flashOn = false;
    let track;

    // Resize canvas to match window
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawOverlay();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2 + 50;
      const fingerSpacing = 60;
      const handHeight = 180;
      const wristHeight = 40;

      // Draw 5 vertical finger guides
      for (let i = -2; i <= 2; i++) {
        const x = centerX + i * fingerSpacing;
        ctx.beginPath();
        ctx.moveTo(x, centerY - handHeight);
        ctx.lineTo(x, centerY);
        ctx.stroke();
      }

      // Draw wrist line (rounded rectangle)
      const rectWidth = fingerSpacing * 5;
      const rectHeight = wristHeight;
      ctx.beginPath();
      ctx.moveTo(centerX - rectWidth/2, centerY);
      ctx.lineTo(centerX + rectWidth/2, centerY);
      ctx.lineTo(centerX + rectWidth/2, centerY + rectHeight);
      ctx.lineTo(centerX - rectWidth/2, centerY + rectHeight);
      ctx.closePath();
      ctx.stroke();

      if (useRightHand) {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.restore();
      }
    }

    async function startCamera() {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
      resizeCanvas();
    }

    document.getElementById('switchHand').onclick = () => {
      useRightHand = !useRightHand;
      drawOverlay();
    };

    document.getElementById('toggleFlash').onclick = async () => {
      if (!track) return;
      const capabilities = track.getCapabilities();
      if (capabilities.torch) {
        flashOn = !flashOn;
        await track.applyConstraints({ advanced: [{ torch: flashOn }] });
        document.getElementById('toggleFlash').textContent = flashOn ? 'Flash Off' : 'Flash On';
      } else {
        alert("Flash not supported on this device.");
      }
    };

    document.getElementById('capture').onclick = () => {
      const capCanvas = document.createElement('canvas');
      capCanvas.width = video.videoWidth;
      capCanvas.height = video.videoHeight;
      const capCtx = capCanvas.getContext('2d');
      capCtx.drawImage(video, 0, 0, capCanvas.width, capCanvas.height);
      const imgData = capCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = imgData;
      link.download = "palm-capture.png";
      link.click();
    };

    startCamera();
  </script>
</body>
</html>
