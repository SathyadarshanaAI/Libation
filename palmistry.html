<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palmistry Scanner | Sathyadarshana</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
      padding: 2em;
      min-height: 100vh;
    }
    h1 {
      font-size: 2.2em;
      color: #7dd3fc;
      text-shadow: 0 0 12px #38bdf8;
      margin-bottom: 0.5em;
    }
    p {
      font-size: 1em;
      max-width: 600px;
      margin: 0 auto 1.5em;
      line-height: 1.6;
    }
    #scanner {
      position: relative;
      width: 360px;
      height: 280px;
      margin: 0 auto;
      border-radius: 1em;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(56,189,248,0.4);
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1em;
    }
    canvas.overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .btn-group {
      margin-top: 1.5em;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1em;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      padding: 0.8em 1.6em;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 0.8em;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(125,211,252,0.4);
    }
    button:hover {
      background: #16f0a7;
      transform: scale(1.05);
    }
    #capturePreview {
      margin-top: 2em;
      max-width: 360px;
      border-radius: 1em;
      display: none;
      box-shadow: 0 0 15px rgba(56,189,248,0.3);
    }
    footer {
      margin-top: 3em;
      font-size: 0.9em;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>Palmistry Scanner</h1>
  <p>
    Spread your fingers and place your <strong>Left or Right hand</strong> in front of the camera.<br>
    Align with the grid overlay so lines like <em>Manikanda Rekha</em> are visible.<br>
    Capture each hand for AI analysis (future Seed Engine integration).
  </p>

  <div id="scanner">
    <video id="video" autoplay playsinline></video>
    <canvas class="overlay" id="overlay"></canvas>
  </div>

  <div class="btn-group">
    <button id="startCamera">Start Camera</button>
    <button id="captureLeft" disabled>Capture Left Hand</button>
    <button id="captureRight" disabled>Capture Right Hand</button>
    <button id="reset" disabled>Reset</button>
  </div>

  <img id="capturePreview" alt="Palm Capture Preview" />

  <footer>© 2025 SathyadarshanaAI | Powered by Buddhi</footer>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const startBtn = document.getElementById('startCamera');
    const leftBtn = document.getElementById('captureLeft');
    const rightBtn = document.getElementById('captureRight');
    const resetBtn = document.getElementById('reset');
    const preview = document.getElementById('capturePreview');
    let stream = null;

    // Draw guide grid (finger spread + palm center)
    function drawOverlay() {
      overlay.width = video.clientWidth;
      overlay.height = video.clientHeight;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.strokeStyle = 'rgba(56,189,248,0.7)';
      ctx.lineWidth = 1.5;

      // Vertical finger lines
      for (let i = 1; i < 5; i++) {
        const x = (overlay.width / 5) * i;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, overlay.height);
        ctx.stroke();
      }
      // Horizontal palm lines
      for (let i = 1; i < 4; i++) {
        const y = (overlay.height / 4) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(overlay.width, y);
        ctx.stroke();
      }

      // Center circle (palm center)
      ctx.beginPath();
      ctx.arc(overlay.width / 2, overlay.height * 0.65, 30, 0, 2 * Math.PI);
      ctx.stroke();
      requestAnimationFrame(drawOverlay);
    }

    // Camera start
    startBtn.onclick = async () => {
      if (stream) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        leftBtn.disabled = false;
        rightBtn.disabled = false;
        resetBtn.disabled = false;
        startBtn.disabled = true;
        drawOverlay();
      } catch (err) {
        alert("Camera not accessible or permission denied!");
      }
    };

    // Capture function
    function captureHand(label) {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const cctx = canvas.getContext('2d');
      cctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      preview.src = canvas.toDataURL('image/png');
      preview.style.display = 'block';
      alert(`${label} Hand captured! (AI analysis coming soon)`);
    }

    leftBtn.onclick = () => captureHand('Left');
    rightBtn.onclick = () => captureHand('Right');

    resetBtn.onclick = () => {
      preview.style.display = 'none';
      preview.src = "";
    };
  </script>
</body>
</html>
