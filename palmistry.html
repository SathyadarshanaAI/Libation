<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <title>Palmistry AI – Lebetion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Palmistry AI – Modern Single Page Demo">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, #131a2c, #06090d 90%);
      color: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .topbar {
      width: 100vw;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background: rgba(16,21,35,0.88);
      box-shadow: 0 2px 18px #16f0a72b;
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 0.7em 1.2em;
      gap: 0.5em;
    }
    .topbar button {
      background: linear-gradient(90deg, #16f0a7, #38bdf8);
      border: none;
      border-radius: 8px;
      color: #18181b;
      font-weight: 700;
      font-size: 1em;
      padding: 0.55em 1.2em;
      margin-left: 0.2em;
      cursor: pointer;
      box-shadow: 0 2px 12px #16f0a733;
      transition: background .16s, color .16s, transform .10s;
      outline: none;
    }
    .topbar button:hover {
      background: linear-gradient(90deg, #38bdf8, #16f0a7);
      color: #fff;
      transform: scale(1.07);
    }
    .main-card {
      background: rgba(22,28,44,0.9);
      border-radius: 1.3em;
      margin-top: 3.5em;
      box-shadow: 0 0 32px #38bdf855;
      padding: 2.2em 1.5em 2.8em 1.5em;
      width: 95vw;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 430px;
      position: relative;
    }
    .main-card h1 {
      font-size: 1.45em;
      letter-spacing: 0.03em;
      margin-bottom: 1.6em;
      color: #16f0a7;
      text-shadow: 0 0 10px #16f0a755;
    }
    .palmistry-area {
      position:relative;
      width: 280px;
      height: 360px;
      background: #1a2233;
      border-radius: 18px;
      box-shadow: 0 0 24px #16f0a74a;
      overflow:hidden;
      margin-bottom: 1.2em;
      margin-top: 0.2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay-img {
      position: absolute;
      left: 0; top: 0; width: 100%; height: 100%;
      opacity: 0.41;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      transition: opacity 0.22s;
    }
    .placeholder-text {
      position: absolute;
      left: 0; top: 50%; width: 100%;
      transform: translateY(-50%);
      color: #bae6fd;
      text-align: center;
      font-size: 1.08em;
      opacity: 0.8;
      z-index: 1;
      pointer-events: none;
    }
    .footer {
      margin-top: 3em;
      color: #16f0a7;
      font-size: 1.01em;
      text-align: center;
      letter-spacing: .01em;
      opacity: 0.92;
    }
    @media (max-width: 500px) {
      .main-card {
        padding: 1em 0.18em 2em 0.18em;
        min-height: 340px;
        margin-top: 2.4em;
      }
      .palmistry-area { width: 95vw; max-width: 98vw; height: 55vw; min-height: 200px;}
      .main-card h1 { font-size: 1.09em; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button onclick="goHome()">🏠 Home</button>
    <button onclick="translatePage()">🌐 Language</button>
  </div>
  <div class="main-card">
    <h1>Palmistry AI Overlay Demo</h1>
    <div class="palmistry-area">
      <!-- Overlay template (ghost hand) -->
      <img src="https://i.ibb.co/1K7K0gF/palm-overlay-demo.png" alt="Ghost Hand Overlay" class="overlay-img" />
      <div class="placeholder-text">🖐️ Place your palm here to match the guide</div>
    </div>
  </div>
  <div class="footer">
    <div style="font-size:.98em; color:#fbc02d; margin-bottom:8px;">
      🛡️ HIGH COPYRIGHT – Lebetion | Sathyadarshana 2025
    </div>
    Palmistry overlay UI – Demo<br>
    <span style="color:#bae6fd;">Modern, minimal, SaaS-ready</span>
  </div>
  <script>
    function goHome() {
      window.location.href = '/'; // Change this to your actual home page if needed
    }
    function translatePage() {
      alert('Language/Translate feature coming soon!');
      // Google Translate or similar integration goes here
    }
  </script>
</body>
</html>
