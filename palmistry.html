<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Palmistry Scanner | Sathyadarshana</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
      overflow-x: hidden;
    }
    h1 {
      margin-top: 1rem;
      font-size: 2em;
      color: #7dd3fc;
      text-shadow: 0 0 12px #38bdf8;
    }
    .container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 1rem;
      box-shadow: 0 0 25px rgba(56,189,248,0.4);
    }
    input[type="file"] {
      display: block;
      margin: 1rem auto;
      background: #1e293b;
      padding: 0.7rem;
      border-radius: 0.5rem;
      color: #e0f2fe;
      cursor: pointer;
      box-shadow: 0 0 8px #38bdf822;
    }
    button {
      display: block;
      width: 80%;
      margin: 1rem auto;
      padding: 1rem;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      color: white;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 12px #38bdf877;
      transition: all 0.3s ease-in-out;
    }
    button:hover {
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      color: #0f172a;
      transform: scale(1.05);
    }
    #result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 0.5rem;
      background: rgba(2, 6, 23, 0.6);
      box-shadow: 0 0 12px #38bdf855;
      display: none;
    }
    #lang-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 15px #0ea5e9;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <h1>Palmistry Analysis</h1>
  <div class="container">
    <p>Upload a clear image of your palm for AI-based Buddhi analysis (future integration).</p>
    <input type="file" id="palmImage" accept="image/*">
    <button onclick="analyzePalm()">Analyze Palm</button>
    <div id="result"></div>
  </div>

  <!-- Language Globe -->
  <div id="google_translate_element" style="display:none;"></div>
  <button id="lang-btn">🌐</button>

  <script>
    // Disable right-click and shortcuts
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && ['c','u','s'].includes(e.key.toLowerCase())) e.preventDefault();
    });

    function analyzePalm() {
      const file = document.getElementById('palmImage').files[0];
      const result = document.getElementById('result');
      if (!file) {
        result.style.display = "block";
        result.innerHTML = "<p style='color:#f87171'>Please upload a palm image first.</p>";
        return;
      }
      result.style.display = "block";
      result.innerHTML = `
        <p style='color:#7dd3fc'>Palmistry analysis in progress... (AI Buddhi integration coming soon)</p>
      `;
    }

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,si,ta',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
    document.getElementById('lang-btn').addEventListener('click', () => {
      document.querySelector('.goog-te-gadget-simple').click();
    });
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
