<!DOCTYPE html><html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KP – Chart (Integrated)</title>  <!-- Leaflet CSS -->  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous"/>  <style>
    :root{--bg:#0f172a;--txt:#e0f2fe;--muted:#93c5fd;--card:#0b1220;--line:#1e293b;--accent:#60a5fa;--accent2:#2df3c2}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial}
    a{color:#7dd3fc;text-decoration:none}
    .wrap{max-width:1100px;margin:18px auto;padding:12px}
    .topbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
    .btn, .chip{background:#0b1220;border:1px solid var(--line);padding:8px 12px;border-radius:10px;color:#cdeafe;cursor:pointer}
    .btn:hover{border-color:var(--accent)}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
    @media (max-width:940px){ .grid{grid-template-columns:1fr} }
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    .card h2{margin:6px 0 12px}
    #map{height:260px;border:1px solid var(--line);border-radius:10px}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.8px}
    th,td{border-bottom:1px solid #223149;padding:8px 10px;text-align:left}
    th{color:#bfe1ff;font-weight:600;background:#121b2a}
    .status{color:var(--muted);font-size:14px;margin-top:8px}
    .pill{display:inline-block;border:1px solid var(--line);background:#091426;border-radius:999px;padding:6px 10px;margin-top:8px}
    .pill.ok{border-color:#22c55e}
    #wheel svg{width:100%;height:auto;max-width:460px;display:block;margin:auto}
    textarea{width:100%;min-height:120px;background:#0c1728;color:#cdeafe;border:1px solid var(--line);border-radius:10px;padding:10px}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 16px}
    .kv div b{color:#bfe1ff}
  </style></head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div style="display:flex;gap:8px;align-items:center">
        <a class="btn" href="./index.html">← Home</a>
        <button class="btn" id="btnStart">⟲ Start / Change data</button>
        <button class="btn" id="btnReset">✦ Reset saved</button>
      </div>
      <div class="chip" id="chipStatus">Loading…</div>
    </div><div class="grid">
  <!-- LEFT: MAP + META -->
  <div class="card">
    <h2>Location & Details</h2>
    <div id="map"></div>
    <div class="kv" style="margin-top:12px">
      <div><b>Name</b></div><div id="kvName">—</div>
      <div><b>Date/Time</b></div><div id="kvDT">—</div>
      <div><b>Latitude</b></div><div id="kvLat">—</div>
      <div><b>Longitude</b></div><div id="kvLon">—</div>
    </div>
    <div class="status" id="locStatus"></div>
  </div>

  <!-- RIGHT: WHEEL + TABLE -->
  <div class="card">
    <h2>KP Wheel</h2>
    <div id="wheel"></div>
    <h2 style="margin-top:18px">Planet Table</h2>
    <table>
      <thead>
        <tr>
          <th>Planet</th>
          <th>Degree</th>
          <th>Sign</th>
          <th>Nakshatra</th>
          <th>Pada</th>
          <th>Star Lord</th>
          <th>Sub-Lord</th>
        </tr>
      </thead>
      <tbody id="tbl"></tbody>
    </table>
    <h3 style="margin:14px 0 6px">JSON Preview</h3>
    <textarea id="jsonPreview" readonly></textarea>
  </div>
</div>

  </div>  <!-- Leaflet JS -->  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>  <script>
    // ======= 0) Controls / navigation =======
    document.getElementById('btnStart').onclick = ()=> location.href = './index.html' in window ? './index.html' : './kp-start.html';
    document.getElementById('btnReset').onclick = ()=>{ localStorage.removeItem('kp_name');localStorage.removeItem('kp_dt');localStorage.removeItem('kp_lat');localStorage.removeItem('kp_lon'); location.reload(); };

    const chip = document.getElementById('chipStatus');
    const chipMsg = (t, ok=false)=>{ chip.textContent=t; chip.className = 'chip' + (ok? ' pill ok':''); }

    // ======= 1) Load saved inputs from Start page =======
    const NM = localStorage.getItem('kp_name') || '';
    const DT = localStorage.getItem('kp_dt') || '';
    const LAT = parseFloat(localStorage.getItem('kp_lat'));
    const LON = parseFloat(localStorage.getItem('kp_lon'));

    const okLoc = Number.isFinite(LAT) && Number.isFinite(LON);
    document.getElementById('kvName').textContent = NM || '—';
    document.getElementById('kvDT').textContent = DT || '—';
    document.getElementById('kvLat').textContent = okLoc ? LAT.toFixed(6) : '—';
    document.getElementById('kvLon').textContent = okLoc ? LON.toFixed(6) : '—';

    if(!NM || !DT || !okLoc){
      chipMsg('Missing inputs — click “Start / Change data”.');
      document.getElementById('locStatus').textContent = 'Tip: Open the Start page, fill Name + Date/Time + Lat,Lon, and it will return here.';
    }else{
      chipMsg('Loaded from Start ✓', true);
    }

    // ======= 2) Map (Leaflet) =======
    const map = L.map('map',{ zoomControl:true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    let marker;
    if(okLoc){
      map.setView([LAT,LON], 11);
      marker = L.marker([LAT,LON], { draggable:false }).addTo(map);
    }else{
      map.setView([7.8731,80.7718], 7); // Sri Lanka default
      marker = L.marker([7.8731,80.7718]).addTo(map);
    }

    // ======= 3) Astro helpers (Signs, Nakshatras, Lords, Sub-Lords) =======
    const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
    const NAKS  = ['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];
    const DASHAS = [
      {lord:'Ketu', years:7}, {lord:'Venus', years:20}, {lord:'Sun', years:6}, {lord:'Moon', years:10},
      {lord:'Mars', years:7}, {lord:'Rahu', years:18}, {lord:'Jupiter', years:16}, {lord:'Saturn', years:19}, {lord:'Mercury', years:17}
    ];
    // Map 27 nakshatras -> star lords (repeat Vimshottari sequence)
    const NAK_LORD = Array.from({length:27},(_,i)=>DASHAS[i%9].lord);

    const mod=(a,b)=>((a%b)+b)%b;
    const DEG_PER_NAK = 360/27;      // 13°20′
    const DEG_PER_PADA = DEG_PER_NAK/4; // 3°20′

    function dms(deg){
      deg = mod(deg,360);
      const d = Math.floor(deg);
      const mFloat = (deg-d)*60; const m = Math.floor(mFloat);
      const s = Math.round((mFloat-m)*60);
      return `${d}° ${String(m).padStart(2,'0')}′ ${String(s).padStart(2,'0')}″`;
    }
    function signOf(deg){ return SIGNS[Math.floor(mod(deg,360)/30)]; }
    function nakIndex(deg){ return Math.floor(mod(deg,360)/DEG_PER_NAK); }
    function padaOf(deg){ const within = mod(deg,DEG_PER_NAK); return Math.floor(within/DEG_PER_PADA)+1; }
    function starLordOf(deg){ return NAK_LORD[nakIndex(deg)]; }
    function subLordOf(deg){
      // Proportional subdivision of the nakshatra by dasha years/120
      const nIdx = nakIndex(deg);
      const startLord = NAK_LORD[nIdx];
      const startIdx = DASHAS.findIndex(d=>d.lord===startLord);
      const rotated = DASHAS.slice(startIdx).concat(DASHAS.slice(0,startIdx));
      const arc = DEG_PER_NAK; // total arc per nakshatra
      const subArcs = rotated.map(d => arc*(d.years/120));
      const within = mod(deg,DEG_PER_NAK);
      let acc = 0;
      for(let i=0;i<subArcs.length;i++){
        acc += subArcs[i];
        if(within < acc) return rotated[i].lord;
      }
      return rotated[rotated.length-1].lord; // fallback edge
    }

    // ======= 4) Simple demo planets (replace with real API/library later) =======
    const demoPlanets = [
      { name:'Sun',    degree: 123.456 },
      { name:'Moon',   degree: 200.123 },
      { name:'Mercury',degree: 305.432 },
      { name:'Venus',  degree: 271.111 },
      { name:'Mars',   degree: 18.876  },
      { name:'Jupiter',degree: 84.333  },
      { name:'Saturn', degree: 342.250 },
      { name:'Rahu',   degree: 45.876  },
      { name:'Ketu',   degree: 225.876 }
    ];

    // ======= 5) Render table =======
    function renderTable(planets){
      const tbody = document.getElementById('tbl');
      tbody.innerHTML = '';
      planets.forEach(p=>{
        const si = signOf(p.degree);
        const nIdx = nakIndex(p.degree);
        const nak = NAKS[nIdx];
        const pada = padaOf(p.degree);
        const sLord = starLordOf(p.degree);
        const sub = subLordOf(p.degree);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><b>${p.name}</b></td>
                        <td>${dms(p.degree)}</td>
                        <td>${si}</td>
                        <td>${nak}</td>
                        <td>${pada}</td>
                        <td>${sLord}</td>
                        <td><b style="color:var(--accent2)">${sub}</b></td>`;
        tbody.appendChild(tr);
      });
    }

    // ======= 6) Render wheel (simple 12-sector zodiac with planet dots) =======
    function renderWheel(planets){
      const W=520,H=520,Cx=W/2,Cy=H/2,R=190;
      let sectors='',labels='',planDots='';
      // 12 sign sectors
      for(let i=0;i<12;i++){
        const a1=(i*30-90)*Math.PI/180, a2=((i+1)*30-90)*Math.PI/180;
        const x1=Cx+R*Math.cos(a1), y1=Cy+R*Math.sin(a1), x2=Cx+R*Math.cos(a2), y2=Cy+R*Math.sin(a2);
        sectors += `\n  <path d="M${Cx},${Cy} L${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} Z" fill="none" stroke="#1a2c44" stroke-width="2"/>`;
      }
      // Sign labels
      for(let i=0;i<12;i++){
        const a=((i*30+15)-90)*Math.PI/180; const x=Cx+(R-16)*Math.cos(a), y=Cy+(R-16)*Math.sin(a);
        labels += `\n  <text x="${x}" y="${y+4}" font-size="11" text-anchor="middle" fill="#bfe1ff">${SIGNS[i]}</text>`;
      }
      // Planet dots
      planets.forEach(p=>{
        const a=(p.degree-90)*Math.PI/180; const r=R-36; const x=Cx+r*Math.cos(a), y=Cy+r*Math.sin(a);
        planDots += `\n  <g>\n    <circle cx="${x}" cy="${y}" r="8" fill="#0e1626" stroke="${p.name==='Rahu'||p.name==='Ketu'?'#e6b2ff':'#60a5fa'}" stroke-width="2"/>\n    <text x="${x}" y="${y+3}" font-size="9.5" text-anchor="middle" fill="#cdeafe">${p.name[0]}</text>\n  </g>`;
      });

      const svg = `\n<svg viewBox="0 0 ${W} ${H}">\n  <defs>\n    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>\n  </defs>\n  <circle cx="${Cx}" cy="${Cy}" r="${R+24}" fill="rgba(7,18,34,0.96)" filter="url(#glow)"/>\n  ${sectors}\n  ${labels}\n  ${planDots}\n</svg>`;
      document.getElementById('wheel').innerHTML = svg;
    }

    // ======= 7) Boot =======
    (function init(){
      renderTable(demoPlanets);
      renderWheel(demoPlanets);
      document.getElementById('jsonPreview').value = JSON.stringify({planets: demoPlanets}, null, 2);
    })();
  </script></body>
</html>
