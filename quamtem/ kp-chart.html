<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birth Details Entry – Sathyadarshana</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { background: #161926; color: #e2e8ff; font-family: sans-serif; margin: 0; }
    .main { max-width: 500px; margin: auto; padding: 2em; }
    form { display: flex; flex-direction: column; gap: 1em; }
    label { display: flex; flex-direction: column; font-size: 1em; }
    .error { color: #ff5b5b; font-weight: 700; }
    #map { height: 250px; border-radius: 0.7em; margin-top: 1em; }
  </style>
</head>
<body>
  <main class="main">
    <h1>Birth Details</h1>
    <form id="birthForm">
      <label>Birth Date <input type="date" name="date" required></label>
      <label>Birth Time <input type="time" name="time" required></label>
      <label>Latitude <input type="number" step="0.0001" name="lat" id="lat" required placeholder="Ex: 7.1"></label>
      <label>Longitude <input type="number" step="0.0001" name="lon" id="lon" required placeholder="Ex: 79.9"></label>
      <button type="submit">Submit</button>
    </form>
    <div id="map"></div>
    <div id="status"></div>
  </main>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Simple map picker for latitude/longitude
    const map = L.map('map').setView([7.1, 79.9], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    map.on('click', function(e) {
      if (marker) map.removeLayer(marker);
      marker = L.marker(e.latlng).addTo(map);
      document.getElementById('lat').value = e.latlng.lat.toFixed(4);
      document.getElementById('lon').value = e.latlng.lng.toFixed(4);
    });

    document.getElementById('birthForm').onsubmit = function(e) {
      e.preventDefault();
      const fd = new FormData(this);
      const date = fd.get('date');
      const time = fd.get('time');
      const lat = fd.get('lat');
      const lon = fd.get('lon');
      const status = document.getElementById('status');
      if (!date || !time || !lat || !lon) {
        status.innerHTML = "<div class='error'>All fields are required!</div>";
        return;
      }
      status.innerHTML = "<div>Birth data submitted!</div>";
      // Here you can call your API or process the data as needed
    };
  </script>
</body>
</html>
