<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KP Chart Generator – Gold Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    :root {
      --main-bg: #13151f;
      --panel-bg: #191b2b;
      --accent: #ffd700;
      --accent2: #1cfafa;
      --serenity: #e2f0ff;
      --chakra: linear-gradient(90deg,#ffd700,#f3e8c7,#fffce0,#fae3a8);
    }
    html,body { background:var(--main-bg); color:var(--serenity); font-family:'Segoe UI',Arial,sans-serif; margin:0; min-height:100vh; }
    .wrap { max-width:540px; margin:32px auto; padding:24px 16px 16px 16px; background:var(--panel-bg); border-radius:20px; box-shadow:0 0 44px 0 #1e222f; }
    h2 { font-weight:700; letter-spacing:0.03em; font-size:1.34rem; margin-top:0; color:var(--accent); text-shadow:0 0 10px #ffd70080;}
    label { display:block; margin:8px 0 4px; font-size:1rem; color:var(--accent2);}
    input, select, textarea {
      width:100%; padding:9px 12px; border-radius:8px;
      border:1.5px solid #32364d; background:#191b2b; color:var(--serenity);
      font-size:1rem; margin-bottom:10px; outline:none;
      transition: box-shadow .18s, border .18s;
    }
    input:focus, select:focus, textarea:focus {
      border:1.5px solid var(--accent);
      box-shadow:0 0 8px 1px var(--accent);
    }
    button {
      background: var(--chakra); color:#1d202e; border:0; border-radius:11px;
      padding:10px 22px; margin:10px 0; cursor:pointer;
      font-weight:700; letter-spacing:0.04em; font-size:1.08rem;
      box-shadow:0 0 14px 1px #ffd70090,0 2px 8px #181818;
      text-shadow:0 0 2px #fff5; transition:filter .18s;
    }
    button:hover { filter:brightness(1.2) drop-shadow(0 0 6px var(--accent)); }
    #map { height: 150px; width:97%; border-radius:11px; margin:13px auto 14px auto; box-shadow:0 0 14px 2px #463c23; min-width:170px; max-width:420px; background:#232547; display:block; }
    .row { display:flex; gap:10px; }
    .row > div { flex:1; }
    .status { font-size:14px; color:var(--accent2); margin-top:7px; min-height:20px;}
    table { width:100%; border-collapse:collapse; margin-top:14px; background:rgba(22,24,41,0.94); border-radius:10px; box-shadow:0 0 7px #232c41; }
    th,td { border-bottom:1px solid #38333a; padding:7px 2px; font-size:0.97rem; }
    th { color:var(--accent); font-weight:700; background:rgba(20,16,6,0.9); }
    td { color:var(--serenity); }
    .chart-section { margin:22px 0 0 0; }
    #wheel { display:flex; justify-content:center; margin: 18px 0 0 0; }
    textarea { width:100%; background:#22223b; color:#ffd700; border-radius:8px; border:1.5px solid #1b2b4a; padding:7px; margin-top:13px; font-size:0.98rem;}
    .gold-glow { filter:drop-shadow(0 0 7px #ffd70077); }
    .rasi-label { font-weight:700; letter-spacing:.05em; font-size:1.01rem; fill:var(--accent); text-shadow:0 0 5px #fff2;}
    .form-glow { background:rgba(20,18,27,0.96); box-shadow:0 0 18px 4px #ffd70060,0 0 4px 1px #262b34; border-radius:13px; padding:16px 10px 7px 10px; margin-bottom:18px; transition:box-shadow .24s;}
    .form-glow:focus-within { box-shadow:0 0 25px 5px var(--accent2); }
    @media (max-width:600px) {
      .wrap {padding:2px;}
      .row { flex-direction:column; gap:4px;}
      #wheel svg { width:98vw !important; height:auto !important;}
      #map {height:100px;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>KP Chart Generator <span style="font-size:1rem;color:#fffbe5;text-shadow:0 0 2px #ffd70080;" >– Gold Edition</span></h2>
    <div class="form-glow">
      <form id="kpForm" autocomplete="off">
        <label>Name</label>
        <input type="text" id="name" required>
        <div class="row">
          <div>
            <label>Date of Birth</label>
            <input type="date" id="dob" required>
          </div>
          <div>
            <label>Time of Birth</label>
            <input type="time" id="tob" required>
          </div>
        </div>
        <label>Place of Birth</label>
        <input type="text" id="pob" placeholder="e.g. Colombo">
        <div class="row">
          <div>
            <label>Latitude</label>
            <input type="number" id="lat" step="0.0001" required placeholder="Click on map or enter">
          </div>
          <div>
            <label>Longitude</label>
            <input type="number" id="lon" step="0.0001" required placeholder="Click on map or enter">
          </div>
        </div>
        <label>Time Zone 
          <button type="button" id="detectTzBtn" style="float:right;margin-top:-2px;">Auto Detect</button>
        </label>
        <input type="text" id="timezone" required placeholder="+05:30">
        <button type="submit">Generate Chart</button>
        <div class="status" id="status"></div>
      </form>
    </div>
    <div id="map"></div>
    <div class="chart-section">
      <div id="wheel"></div>
      <table>
        <thead>
          <tr>
            <th>Planet</th><th>Degree</th><th>Sign</th><th>Nakshatra</th><th>Pada</th><th>Star Lord</th><th>Sub-Lord</th>
          </tr>
        </thead>
        <tbody id="tbl"></tbody>
      </table>
      <textarea id="jsonPreview" rows="6" readonly placeholder="Preview will appear here"></textarea>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // --- STREET MAP ---
    let marker = null;
    function initMap(){
      const map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: true,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        tap: false
      }).setView([20, 0], 2);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18
      }).addTo(map);

      setTimeout(() => {
        map.flyTo([7.1, 79.9], 7, { animate: true, duration: 2.2 });
      }, 600);

      map.on('click', function(e) {
        if (marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
        map.flyTo(e.latlng, 15, { animate: true, duration: 1.5 });
        document.getElementById('lat').value = e.latlng.lat.toFixed(4);
        document.getElementById('lon').value = e.latlng.lng.toFixed(4);
      });
    }
    window.addEventListener('DOMContentLoaded',initMap);

    // --- TIMEZONE AUTO-DETECT ---
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('detectTzBtn').onclick = function() {
        try {
          let offset = -new Date().getTimezoneOffset();
          let sign = offset >= 0 ? '+' : '-';
          let absOffset = Math.abs(offset);
          let hr = Math.floor(absOffset / 60);
          let min = absOffset % 60;
          let tz = `${sign}${String(hr).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
          document.getElementById('timezone').value = tz;
        } catch {
          document.getElementById('timezone').value = '+05:30';
        }
      };
    });

    // --- KP CHART LOGIC (demo only, replace with API or calculations for real chart) ---
    const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
    const NAKS = ['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];
    const DASHAS = [
      {lord:'Ketu', years:7}, {lord:'Venus', years:20}, {lord:'Sun', years:6}, {lord:'Moon', years:10},
      {lord:'Mars', years:7}, {lord:'Rahu', years:18}, {lord:'Jupiter', years:16}, {lord:'Saturn', years:19}, {lord:'Mercury', years:17}
    ];
    const NAK_LORD = (()=>{const list=[];let idx=0;for(let i=0;i<27;i++){list.push(DASHAS[idx%9].lord);idx++;}return list;})();
    const mod = (a,b)=>((a%b)+b)%b;
    const DEG_PER_NAK = 360/27, DEG_PER_PADA = DEG_PER_NAK/4;
    function dms(deg){
      deg=mod(deg,360);
      const d=Math.floor(deg);
      const mFloat=(deg-d)*60;
      const m=Math.floor(mFloat);
      const s=Math.round((mFloat-m)*60);
      return `${d}°${String(m).padStart(2,'0')}′${String(s).padStart(2,'0')}″`;
    }
    function signOf(deg){return SIGNS[Math.floor(mod(deg,360)/30)]}
    function nakIndex(deg){return Math.floor(mod(deg,360)/DEG_PER_NAK)}
    function padaOf(deg){const within=mod(deg,360)%DEG_PER_NAK;return Math.floor(within/DEG_PER_PADA)+1;}
    function starLordOf(deg){return NAK_LORD[nakIndex(deg)]}
    function subLordOf(deg){
      const nIdx=nakIndex(deg);const startLord=NAK_LORD[nIdx];
      const startIdx=DASHAS.findIndex(d=>d.lord===startLord);
      const rotated=[...DASHAS.slice(startIdx),...DASHAS.slice(0,startIdx)];
      const arc=DEG_PER_NAK;const subArcs=rotated.map(d=>arc*(d.years/120));
      const within=mod(deg,DEG_PER_NAK);let acc=0;
      for(let i=0;i<subArcs.length;i++){acc+=subArcs[i];if(within<=acc+1e-9){return rotated[i].lord}}
      return rotated[rotated.length-1].lord;
    }
    function kpRashiSymbol(i){ const ras = ["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"]; return ras[i]; }

    function renderWheel(planets){
      const W=330,H=330,cell=82,off=27;
      let svg = `<svg viewBox="0 0 ${W} ${H}" width="260" height="260" style="background:transparent;">`;
      svg += `<rect x="4" y="4" width="${W-8}" height="${H-8}" rx="28" ry="28" fill="none" stroke="#ffd700" stroke-width="3.2" filter="url(#goldglow)"/>`;
      for(let i=0;i<12;i++){
        const x = [0,1,2,2,2,1,0,0,1,1,1,1][i]*cell+off;
        const y = [0,0,0,1,2,2,2,1,1,1,1,1][i]*cell+off;
        svg += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="14" ry="14" fill="none" stroke="#ffd70077" stroke-width="2"/>`;
        svg += `<text x="${x+cell/2}" y="${y+cell/2-8}" font-size="2.1em" font-family="serif" fill="#ffd700" text-anchor="middle" dominant-baseline="middle" style="font-weight:900;filter:drop-shadow(0 0 4px #ffd70050);">${kpRashiSymbol(i)}</text>`;
        svg += `<text x="${x+cell/2}" y="${y+cell-18}" font-size="0.95em" fill="#ffd700bb" text-anchor="middle" class="rasi-label">${SIGNS[i]}</text>`;
      }
      planets.forEach(p=>{
        let sign = Math.floor(mod(p.degree,360)/30);
        const x = [0,1,2,2,2,1,0,0,1,1,1,1][sign]*cell+off+cell/2;
        const y = [0,0,0,1,2,2,2,1,1,1,1,1][sign]*cell+off+cell/2;
        svg += `<circle cx="${x}" cy="${y}" r="17" fill="#191b2b" stroke="#ffd700" stroke-width="3" class="gold-glow"/><text x="${x}" y="${y+5}" font-size="1.08em" fill="#fff" font-weight="700" text-anchor="middle">${p.name[0]}</text>`;
      });
      svg += `<defs>
        <filter id="goldglow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>`;
      svg += `</svg>`;
      document.getElementById('wheel').innerHTML=svg;
    }

    function renderTable(planets){
      const tbody=document.getElementById('tbl'); tbody.innerHTML='';
      planets.forEach(p=>{
        const zi=signOf(p.degree),zIndex=SIGNS.indexOf(zi),nIdx=nakIndex(p.degree),nak=NAKS[nIdx],pada=padaOf(p.degree),sLord=starLordOf(p.degree),sub=subLordOf(p.degree);
        const tr=document.createElement('tr');
        tr.innerHTML=`
          <td>${p.name}</td>
          <td>${dms(p.degree)}</td>
          <td><span style="color:#ffd700;font-size:1.2em;font-family:serif;">${kpRashiSymbol(zIndex)}</span> <span style="color:var(--accent);font-weight:600;">${zi}</span></td>
          <td>${nak}</td>
          <td>${pada}</td>
          <td>${sLord}</td>
          <td><b style="color:var(--accent2);">${sub}</b></td>`;
        tbody.appendChild(tr);
      });
    }

    // Handler (demo planets)
    document.getElementById('kpForm').onsubmit = async function(e){
      e.preventDefault();
      // DEMO: static planets (replace with API call for real)
      const planets = [
        { "name": "Sun", "degree": 123.456 },
        { "name": "Moon", "degree": 200.123 },
        { "name": "Mercury", "degree": 85.234 },
        { "name": "Venus", "degree": 154.567 },
        { "name": "Mars", "degree": 210.987 },
        { "name": "Saturn", "degree": 305.432 },
        { "name": "Rahu", "degree": 45.876 },
        { "name": "Ketu", "degree": 225.876 }
      ];
      renderTable(planets);
      renderWheel(planets);
      document.getElementById('jsonPreview').value = JSON.stringify({planets}, null, 2);
      document.getElementById('status').textContent = '✓ Chart generated (demo data)';
    };
    // Initial preview
    document.getElementById('kpForm').onsubmit(new Event('submit'));
  </script>

<script>
  // ---------- small helper: run now or on DOM ready ----------
  function onReady(fn){
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn, { once:true });
    } else {
      fn();
    }
  }

  // ---------- STREET MAP ----------
  let marker = null;
  function initMap(){
    const map = L.map('map', {

  // ---------- TIMEZONE AUTO-DETECT (device timezone) ----------
  function bindTzButton(){
    const btn = document.getElementById('detectTzBtn');
    const tz  = document.getElementById('timezone');
    if (!btn || !tz) return;
    btn.onclick = ()=>{
      try{
        const offMin = -new Date().getTimezoneOffset(); // minutes
        const sign   = offMin >= 0 ? '+' : '-';
        const abs    = Math.abs(offMin);
        const hh     = String(Math.floor(abs/60)).padStart(2,'0');
        const mm     = String(abs % 60).padStart(2,'0');
        tz.value = `${sign}${hh}:${mm}`;
      }catch{
        tz.value = '+05:30';
      }
    };
  }

  // ---------- KP DEMO LOGIC (unchanged) ----------
  const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];

  const DASHAS=[{lord:'Ketu',years:7},{lord:'Venus',years:20},{lord:'Sun',years:6},{lord:'Moon',years:10},{lord:'Mars',years:7},{lord:'Rahu',years:18},{lord:'Jupiter',years:16},{lord:'Saturn',years:19},{lord:'Mercury',years:17}];
  const NAK_LORD=(()=>{const a=[];for(let i=0;i<27;i++)a.push(DASHAS[i%9].lord);return a;})();
  const mod=(a,b)=>((a%b)+b)%b, DEG_PER_NAK=360/27, DEG_PER_PADA=DEG_PER_NAK/4;
  function dms(deg){deg=mod(deg,360);const d=Math.floor(deg),mF=(deg-d)*60,m=Math.floor(mF),s=Math.round((mF-m)*60);return `${d}°${String(m).padStart(2,'0')}′${String(s).padStart(2,'0')}″`;}
  function signOf(deg){return SIGNS[Math.floor(mod(deg,360)/30)]}
  function nakIndex(deg){return Math.floor(mod(deg,360)/DEG_PER_NAK)}
  function padaOf(deg){const w=mod(deg,360)%DEG_PER_NAK;return Math.floor(w/DEG_PER_PADA)+1;}
  function starLordOf(deg){return NAK_LORD[nakIndex(deg)]}
  function subLordOf(deg){const nI=nakIndex(deg),start=NAK_LORD[nI],sI=DASHAS.findIndex(d=>d.lord===start);const rot=[...DASHAS.slice(sI),...DASHAS.slice(0,sI)];const arc=DEG_PER_NAK,subs=rot.map(d=>arc*(d.years/120));const within=mod(deg,DEG_PER_NAK);let acc=0;for(let i=0;i<subs.length;i++){acc+=subs[i];if(within<=acc+1e-9)return rot[i].lord}return rot.at(-1).lord;}
  function kpRashiSymbol(i){return ["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"][i]}

  function renderWheel(planets){
    const W=330,H=330,cell=82,off=27;
    let svg=`<svg viewBox="0 0 ${W} ${H}" width="260" height="260" style="background:transparent;">`;

    for(let i=0;i<12;i++){

  }

  function renderTable(planets){
    const tbody=document.getElementById('tbl'); tbody.innerHTML='';
    planets.forEach(p=>{
      const zi=signOf(p.degree),zIndex=SIGNS.indexOf(zi),nIdx=nakIndex(p.degree),nak=NAKS[nIdx],pada=padaOf(p.degree),sLord=starLordOf(p.degree),sub=subLordOf(p.degree);

  function bindForm(){
    const form = document.getElementById('kpForm');
    const status = document.getElementById('status');

      e.preventDefault();
      // DEMO planets (works offline)

    form.dispatchEvent(new Event('submit'));

  // run safely regardless of load state
  onReady(initMap);
  onReady(bindTzButton);
  onReady(bindForm);
</script>
