<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KP Chart Generator</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body { margin:0; background:#0f172a; color:#e0f2fe; font-family:system-ui,Segoe UI,Arial }
    .wrap { max-width:1100px; margin:20px auto; padding:12px }
    h2 { margin:6px 0 12px }
    .card { background:#0b1220; border:1px solid #1e293b; border-radius:12px; padding:14px; margin-bottom:16px }
    label { display:block; margin:8px 0 4px; color:#93c5fd }
    input,button { width:100%; padding:10px; border-radius:10px; border:1px solid #1e293b; background:#091426; color:#cdeafe }
    button { cursor:pointer; margin-top:8px }
    #map { height:300px; border-radius:12px; margin-top:10px }
    table { width:100%; border-collapse:collapse; margin-top:12px }
    th,td { border-bottom:1px solid #223149; padding:6px 10px; text-align:left }
    th { background:#121b2a; color:#bfe1ff }
    #wheel svg { width:100%; height:auto; max-width:520px; display:block; margin:auto }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Map + Inputs -->
    <div class="card">
      <h2>Birth Details</h2>
      <label>Name</label>
      <input id="name" placeholder="Your name">

      <label>Date & Time</label>
      <input id="datetime" type="datetime-local">

      <label>Place (click on map or enter coords)</label>
      <div class="row">
        <input id="lat" placeholder="Latitude">
        <input id="lon" placeholder="Longitude">
      </div>
      <label>Time Zone <button id="btnAutoTz" type="button">Auto Detect</button></label>
      <input id="timezone" placeholder="+05:30">

      <div id="map"></div>
    </div>

    <!-- Wheel + Table -->
    <div class="card">
      <h2>KP Wheel</h2>
      <div id="wheel"></div>
      <h2>Planet Table</h2>
      <table>
        <thead>
          <tr><th>Planet</th><th>Degree</th><th>Sign</th><th>Nakshatra</th><th>Pada</th><th>Star Lord</th><th>Sub-Lord</th></tr>
        </thead>
        <tbody id="tbl"></tbody>
      </table>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ===== Map Init =====
    const map = L.map('map',{ zoomControl:true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
    map.setView([7.8731,80.7718],7); // Sri Lanka default
    let marker = L.marker([7.8731,80.7718],{draggable:true}).addTo(map);

    function updateInputs(lat,lon){
      document.getElementById('lat').value = lat.toFixed(6);
      document.getElementById('lon').value = lon.toFixed(6);
    }
    map.on('click', e=>{ marker.setLatLng(e.latlng); updateInputs(e.latlng.lat,e.latlng.lng); });
    marker.on('dragend', ()=>{ let p=marker.getLatLng(); updateInputs(p.lat,p.lng); });

    // ===== Auto Detect Timezone =====
    document.getElementById('btnAutoTz').onclick = ()=>{
      let offset = -new Date().getTimezoneOffset();
      let sign = offset>=0?'+':'-'; let abs=Math.abs(offset);
      let hr=Math.floor(abs/60), mn=abs%60;
      document.getElementById('timezone').value = `${sign}${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;
    };

    // ===== Demo Planets =====
    const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
    const demoPlanets=[{name:'Sun',degree:123.4},{name:'Moon',degree:200.1},{name:'Mars',degree:18.8}];

    function renderTable(planets){
      const tbody=document.getElementById('tbl'); tbody.innerHTML='';
      planets.forEach(p=>{
        let tr=document.createElement('tr');
        tr.innerHTML=`<td>${p.name}</td><td>${p.degree.toFixed(2)}°</td><td>${SIGNS[Math.floor(p.degree/30)]}</td>
                      <td>-</td><td>-</td><td>-</td><td>-</td>`;
        tbody.appendChild(tr);
      });
    }
    function renderWheel(planets){
      const W=300,H=300,Cx=W/2,Cy=H/2,R=120;
      let svg=`<svg viewBox=\"0 0 ${W} ${H}\">`;
      for(let i=0;i<12;i++){ // sectors
        let a1=(i*30-90)*Math.PI/180, a2=((i+1)*30-90)*Math.PI/180;
        let x1=Cx+R*Math.cos(a1), y1=Cy+R*Math.sin(a1), x2=Cx+R*Math.cos(a2), y2=Cy+R*Math.sin(a2);
        svg+=`<path d=\"M${Cx},${Cy} L${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} Z\" stroke=\"#1a2c44\" fill=\"none\"/>`;
      }
      planets.forEach(p=>{
        let a=(p.degree-90)*Math.PI/180, x=Cx+(R-20)*Math.cos(a), y=Cy+(R-20)*Math.sin(a);
        svg+=`<circle cx=\"${x}\" cy=\"${y}\" r=\"6\" fill=\"#60a5fa\"/>`;
      });
      svg+=`</svg>`; document.getElementById('wheel').innerHTML=svg;
    }
    renderTable(demoPlanets); renderWheel(demoPlanets);
  </script>
</body>
</html>
