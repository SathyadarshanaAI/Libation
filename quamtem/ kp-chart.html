<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KP Chart Generator – All-in-One</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { background:#101d2e; color:#e2f0ff; font-family:sans-serif; margin:0; }
    .wrap { max-width:860px; margin:32px auto; padding:24px; background:#15213b; border-radius:14px; }
    label { display:block; margin:12px 0 4px; }
    input, select { width:100%; padding:8px; border-radius:7px; border:1px solid #284168; margin-bottom:8px; background:#162447; color:#e2f0ff;}
    button { background:#60a5fa; color:#03122a; border:0; border-radius:8px; padding:10px 24px; margin:10px 0; cursor:pointer; }
    #map { height: 220px; border-radius:10px; margin:12px 0 18px; }
    .row { display:flex; gap:12px; }
    .row > div { flex:1; }
    .status { font-size:14px; color:#73e4ff; margin-top:8px; }
    textarea { width:100%; background:#1a2847; color:#e2f0ff; border-radius:8px; border:1px solid #24304a; padding:8px; margin-top:12px;}
    table { width:100%; border-collapse:collapse; margin-top:16px;}
    th,td { border-bottom:1px solid #24304a; padding:7px; }
    th { color:#bfe1ff; text-align:left; }
    .chart-section { margin:30px 0; }
    #wheel { display:flex; justify-content:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>KP Chart Generator – All-in-One</h2>
    <form id="kpForm" autocomplete="off">
      <label>Name</label>
      <input type="text" id="name" required>
      <div class="row">
        <div>
          <label>Date of Birth</label>
          <input type="date" id="dob" required>
        </div>
        <div>
          <label>Time of Birth</label>
          <input type="time" id="tob" required>
        </div>
      </div>
      <label>Place of Birth (search or use map)</label>
      <input type="text" id="pob" placeholder="e.g. Colombo">
      <div class="row">
        <div>
          <label>Latitude</label>
          <input type="number" id="lat" step="0.0001" required placeholder="Click on map or enter">
        </div>
        <div>
          <label>Longitude</label>
          <input type="number" id="lon" step="0.0001" required placeholder="Click on map or enter">
        </div>
      </div>
      <label>Time Zone 
        <button type="button" id="detectTzBtn" style="float:right;margin-top:-2px;">Auto Detect</button>
      </label>
      <input type="text" id="timezone" required placeholder="+05:30">
      <button type="submit">Generate Chart</button>
      <div class="status" id="status"></div>
    </form>
    <div id="map"></div>
    <div class="chart-section">
      <div id="wheel"></div>
      <table>
        <thead>
          <tr>
            <th>Planet</th><th>Degree</th><th>Sign</th><th>Nakshatra</th><th>Pada</th><th>Star Lord</th><th>Sub-Lord</th>
          </tr>
        </thead>
        <tbody id="tbl"></tbody>
      </table>
      <textarea id="jsonPreview" rows="7" readonly placeholder="Preview will appear here"></textarea>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // 1. Street Map (Leaflet)
    const map = L.map('map').setView([7.1, 79.9], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    let marker = null;
    map.on('click', function(e) {
      if (marker) map.removeLayer(marker);
      marker = L.marker(e.latlng).addTo(map);
      document.getElementById('lat').value = e.latlng.lat.toFixed(4);
      document.getElementById('lon').value = e.latlng.lng.toFixed(4);
    });

    // 2. Time Zone auto-detect
    document.getElementById('detectTzBtn').onclick = function() {
      const offset = -new Date().getTimezoneOffset();
      const sign = offset >= 0 ? '+' : '-';
      const absOffset = Math.abs(offset);
      const hr = Math.floor(absOffset / 60);
      const min = absOffset % 60;
      const tz = `${sign}${String(hr).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
      document.getElementById('timezone').value = tz;
    };

    // 3. KP Logic (Demo/sample)
    const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
    const NAKS = ['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];
    const DASHAS = [
      {lord:'Ketu', years:7}, {lord:'Venus', years:20}, {lord:'Sun', years:6}, {lord:'Moon', years:10},
      {lord:'Mars', years:7}, {lord:'Rahu', years:18}, {lord:'Jupiter', years:16}, {lord:'Saturn', years:19}, {lord:'Mercury', years:17}
    ];
    const NAK_LORD = (()=>{const list=[];let idx=0;for(let i=0;i<27;i++){list.push(DASHAS[idx%9].lord);idx++;}return list;})();
    const mod = (a,b)=>((a%b)+b)%b;
    const DEG_PER_NAK = 360/27, DEG_PER_PADA = DEG_PER_NAK/4;
    function dms(deg){
      deg=mod(deg,360);
      const d=Math.floor(deg);
      const mFloat=(deg-d)*60;
      const m=Math.floor(mFloat);
      const s=Math.round((mFloat-m)*60);
      return `${d}°${String(m).padStart(2,'0')}′${String(s).padStart(2,'0')}″`;
    }
    function signOf(deg){return SIGNS[Math.floor(mod(deg,360)/30)]}
    function nakIndex(deg){return Math.floor(mod(deg,360)/DEG_PER_NAK)}
    function padaOf(deg){const within=mod(deg,DEG_PER_NAK);return Math.floor(within/DEG_PER_PADA)+1;}
    function starLordOf(deg){return NAK_LORD[nakIndex(deg)]}
    function subLordOf(deg){
      const nIdx=nakIndex(deg);const startLord=NAK_LORD[nIdx];
      const startIdx=DASHAS.findIndex(d=>d.lord===startLord);
      const rotated=[...DASHAS.slice(startIdx),...DASHAS.slice(0,startIdx)];
      const arc=DEG_PER_NAK;const subArcs=rotated.map(d=>arc*(d.years/120));
      const within=mod(deg,DEG_PER_NAK);let acc=0;
      for(let i=0;i<subArcs.length;i++){acc+=subArcs[i];if(within<=acc+1e-9){return rotated[i].lord}}
      return rotated[rotated.length-1].lord;
    }

    // 4. Chart Table & Wheel
    function renderTable(planets){
      const tbody=document.getElementById('tbl'); tbody.innerHTML='';
      planets.forEach(p=>{
        const zi=signOf(p.degree),nIdx=nakIndex(p.degree),nak=NAKS[nIdx],pada=padaOf(p.degree),sLord=starLordOf(p.degree),sub=subLordOf(p.degree);
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${p.name}</td><td>${dms(p.degree)}</td><td>${zi}</td><td>${nak}</td><td>${pada}</td><td>${sLord}</td><td><b>${sub}</b></td>`;
        tbody.appendChild(tr);
      });
    }
    function renderWheel(planets){
      const W=400,H=400,Cx=W/2,Cy=H/2,R=150,gLines=[],labels=[],planetsSvg=[];
      for(let i=0;i<12;i++){
        const a=(i*30-90)*Math.PI/180,x=Cx+R*Math.cos(a),y=Cy+R*Math.sin(a);
        gLines.push(`<line x1="${Cx}" y1="${Cy}" x2="${x}" y2="${y}" stroke="#24304a" stroke-width="1"/>`);
      }
      for(let i=0;i<12;i++){
        const a=((i*30+15)-90)*Math.PI/180,x=Cx+(R-18)*Math.cos(a),y=Cy+(R-18)*Math.sin(a);
        labels.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="#9cc3ff" font-size="11" text-anchor="middle" dominant-baseline="middle">${SIGNS[i].slice(0,3)}</text>`);
      }
      planets.forEach(p=>{
        const a=(p.degree-90)*Math.PI/180,r=R-35,x=Cx+r*Math.cos(a),y=Cy+r*Math.sin(a);
        planetsSvg.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="#60a5fa"/><text x="${x.toFixed(1)}" y="${(y-12).toFixed(1)}" fill="#e2f0ff" font-size="11" text-anchor="middle">${p.name[0]}</text>`);
      });
      const svg=`<svg viewBox="0 0 ${W} ${H}"><circle cx="${Cx}" cy="${Cy}" r="${R+14}" fill="#101f31"/><circle cx="${Cx}" cy="${Cy}" r="${R}" fill="none" stroke="#24304a"/><g>${gLines.join('')}</g><g>${labels.join('')}</g><g>${planetsSvg.join('')}</g></svg>`;
      document.getElementById('wheel').innerHTML=svg;
    }

    // 5. Form Handler (Sample - uses static demo planets)
    document.getElementById('kpForm').onsubmit = function(e){
      e.preventDefault();
      // For demo: use static sample planets (API integration possible)
      const planets = [
        { "name": "Sun", "degree": 123.456 },
        { "name": "Moon", "degree": 200.123 },
        { "name": "Mercury", "degree": 85.234 },
        { "name": "Venus", "degree": 154.567 },
        { "name": "Mars", "degree": 210.987 },
        { "name": "Jupiter", "degree": 275.654 },
        { "name": "Saturn", "degree": 305.432 },
        { "name": "Rahu", "degree": 45.876 },
        { "name": "Ketu", "degree": 225.876 }
      ];
      renderTable(planets);
      renderWheel(planets);
      document.getElementById('jsonPreview').value = JSON.stringify({planets}, null, 2);
      document.getElementById('status').textContent = '✓ Chart generated (demo data)';
    };

    // Initial preview (on page load)
    document.getElementById('kpForm').onsubmit(new Event('submit'));
  </script>
</body>
</html>
