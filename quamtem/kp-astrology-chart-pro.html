<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full KP Table – Sathyadarshana</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { background: #161926; color: #e2e8ff; font-family: sans-serif; margin: 0; }
    .main { max-width: 500px; margin: auto; padding: 2em; }
    form { display: flex; flex-direction: column; gap: 1em; }
    label { display: flex; flex-direction: column; font-size: 1em; }
    .result { margin-top: 2em; background: #232547; border-radius: 0.5em; padding: 1em; }
    table { width: 100%; border-collapse: collapse; color: #e2e8ff; background: #232547; }
    th, td { 
      border: 1px solid #283048; 
      padding: 0.5em; 
      color: #e2e8ff;           /* FIXED: Light color for text */
      background: #232547;      /* FIXED: Background same as result card */
    }
    th { font-weight: bold; }
    .error { color: #ff5b5b; font-weight: 700; }
    .chart-wrap { text-align: center; margin-top: 2em; }
  </style>
</head>
<body>
  <main class="main">
    <h1>Full KP Table</h1>
    <form id="kpForm">
      <label>Birth Date <input type="date" name="date" required></label>
      <label>Birth Time <input type="time" name="time" required></label>
      <label>Latitude <input type="number" step="0.0001" name="lat" required placeholder="Ex: 7.1"></label>
      <label>Longitude <input type="number" step="0.0001" name="lon" required placeholder="Ex: 79.9"></label>
      <button type="submit">Get KP Table</button>
    </form>
    <div class="result" id="result"></div>
    <div class="chart-wrap">
      <canvas id="astroChart" width="360" height="360" style="background:#232547;border-radius:50%;"></canvas>
    </div>
  </main>
  <script>
    // ... (nakshatra, subLord functions remain SAME)
    function drawAstroWheel(planets) {
      const canvas = document.getElementById('astroChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw outer circle
      ctx.beginPath();
      ctx.arc(180, 180, 170, 0, 2 * Math.PI);
      ctx.strokeStyle = '#e2e8ff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw 12 house lines
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * 2 * Math.PI - Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(180, 180);
        ctx.lineTo(180 + 170 * Math.cos(angle), 180 + 170 * Math.sin(angle));
        ctx.strokeStyle = '#e2e8ff88';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Draw planets
      for (let p of planets) {
        const deg = (p.deg - 90) * Math.PI / 180; // 0 deg = top
        const r = 140;
        ctx.beginPath();
        ctx.arc(180 + r*Math.cos(deg), 180 + r*Math.sin(deg), 12, 0, 2*Math.PI);
        ctx.fillStyle = '#1cfafa';
        ctx.fill();
        ctx.strokeStyle = '#232547';
        ctx.stroke();
        ctx.fillStyle = '#e2e8ff'; // FIX: planet letter color to light!
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.name[0], 180 + r*Math.cos(deg), 180 + r*Math.sin(deg));
      }
    }

    // ... rest as before
  </script>
</body>
</html>
