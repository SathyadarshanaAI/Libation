<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧬 Enter Birth Details</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .form-wrapper {
      max-width: 550px;
      margin: 2rem auto;
      background: rgba(15,23,42,0.92);
      padding: 2rem;
      border-radius: 1.2rem;
      box-shadow: 0 0 25px #0ea5e988;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #7dd3fc;
    }
    input, select {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 1.2rem;
      border: 1px solid #38bdf8;
      border-radius: 0.5rem;
      background: #1e293b;
      color: #e0f2fe;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 0.6rem;
      cursor: pointer;
    }
    button:hover {
      background: #0ea5e9;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <h1 style="text-align:center;">🔮 Enter Birth Details</h1>
    <form id="birthForm">
      <label for="name">Name</label>
      <input type="text" id="name" required />

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" required />

      <label for="tob">Time of Birth</label>
      <input type="time" id="tob" required />

      <label for="place">Place of Birth</label>
      <input type="text" id="place" required />

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">-- Select --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <button type="submit">Generate Chart</button>
    </form>
  </div>

  <script>
    document.getElementById('birthForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const dob = document.getElementById('dob').value;
      const tob = document.getElementById('tob').value;
      const place = document.getElementById('place').value;
      const gender = document.getElementById('gender').value;

      const birthData = { name, dob, tob, place, gender };

      localStorage.setItem('birthData', JSON.stringify(birthData));

      window.location.href = "chart.html";
    });
  </script>
</body>
</html>
