<body>
  <form id="birthForm" class="card" style="margin:14px">
    <label>Name</label>
    <input id="name" required placeholder="Your name">

    <label>Birth Date &amp; Time</label>
    <input id="datetime" type="datetime-local" required>

    <label>Lat, Lon (deg)</label>
    <input id="latlon" required placeholder="6.9271,79.8612">

    <button type="submit">Start → Chart</button>
  </form>

  <script>
    // 🕒 Set default date-time to now
    document.getElementById('datetime').value = new Date().toISOString().slice(0, 16);

    document.getElementById('birthForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      if (!name) {
        alert("Please enter your name.");
        return;
      }

      const latLonStr = document.getElementById('latlon').value || "6.9271,79.8612";
      const [lat, lon] = latLonStr.split(',').map(Number);

      if (isNaN(lat) || isNaN(lon)) {
        alert("Please enter valid latitude and longitude values.");
        return;
      }

      localStorage.setItem('kp_name', name);
      localStorage.setItem('kp_dt', document.getElementById('datetime').value);
      localStorage.setItem('kp_lat', lat);
      localStorage.setItem('kp_lon', lon);

      location.href = './chart.html';
    });
  </script>
</body>
