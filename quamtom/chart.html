<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KP Chart</title>
  <style>
    body{background:#0f172a;color:#e0f2fe;font-family:system-ui,Segoe UI,Arial;margin:0;padding:16px;text-align:center}
    .topbar{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto 8px}
    .topbar a{color:#7dd3fc;text-decoration:none}
    #wheel{display:block;margin:12px auto;background:#0b1220;border-radius:50%}
  </style>
</head>
<body>
  <div class="topbar">
    <a href="./index.html">← Back to Start</a>
    <h2 style="margin:4px 0">KP Chart Wheel</h2>
    <a href="./quamtom/kp-dasa.html">🧭 Vimshottari Dasha</a>
  </div>

  <canvas id="wheel" width="600" height="600"></canvas>

  <!-- Required JS files in correct order -->
  <script src="./ephemeris-data.js"></script>
  <script src="./kp-astro.js"></script>
  <script src="./chart-engine.js"></script>
  <script src="./chart-ui.js"></script>

  <script>
    function safeEphemeris(dt, lat, lon){
      try{
        if (typeof window.computeEphemeris === 'function') return window.computeEphemeris(dt, lat, lon);
        if (typeof window.computeMockEphemeris === 'function') return window.computeMockEphemeris(dt, lat, lon);
      }catch(e){ console.error(e); }
      return { positions: { Moon: 0 } };
    }

    window.addEventListener('load', () => {
      const name = localStorage.getItem('kp_name') || '';
      const dt   = localStorage.getItem('kp_dt') || new Date().toISOString().slice(0,16);
      const lat  = parseFloat(localStorage.getItem('kp_lat') || '6.9271');
      const lon  = parseFloat(localStorage.getItem('kp_lon') || '79.8612');

      const eph = safeEphemeris(dt, lat, lon);
      console.log('KP Chart — inputs:', { name, dt, lat, lon });
      console.log('Ephemeris:', eph);

      const cv = document.getElementById('wheel');
      if (typeof window.drawWheel === 'function'){
        window.drawWheel(cv, eph);
      } else {
        console.error('drawWheel() is not defined. Check chart-ui.js path/order.');
      }
    });
  </script>
</body>
</html>
