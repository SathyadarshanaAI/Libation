<html>
<head></head>
<body>
  <canvas id="wheel" width="600" height="600"></canvas>

  <!-- Required JS files in correct order -->
  <script src="./quamtom/ephemeris-data.js"></script>
  <script src="./quamtom/kp-astro.js"></script>
  <script src="./quamtom/chart-engine.js"></script>
  <script src="./quamtom/chart-ui.js"></script>

  <script>
    window.addEventListener('load', () => {
      const name = localStorage.getItem('kp_name') || '';
      const dt   = localStorage.getItem('kp_dt') || new Date().toISOString().slice(0,16);
      const lat  = parseFloat(localStorage.getItem('kp_lat') || '6.9271');
      const lon  = parseFloat(localStorage.getItem('kp_lon') || '79.8612');

      const eph = window.computeEphemeris(dt, lat, lon);
      window.drawWheel(document.getElementById('wheel'), eph);
    });
  </script>
</body>
</html>
