<script>
  function showErr(e){ /* ...same as yours... */ }

  window.addEventListener('load', () => {
    try {
      const name = localStorage.getItem('kp_name') || '';
      const dt   = localStorage.getItem('kp_dt')   || new Date().toISOString().slice(0,16);
      const lat  = parseFloat(localStorage.getItem('kp_lat') || '6.9271');
      const lon  = parseFloat(localStorage.getItem('kp_lon') || '79.8612');

      document.getElementById('info').textContent =
        `Loaded: ${name || '—'} • ${dt} • ${lat}, ${lon}`;

      // ✅ pick whatever exists: real -> mock -> fallback
      const calc = window.computeEphemeris || window.computeMockEphemeris || function(){
        return {
          Sun:{sign:'Leo',degree:145.5}, Moon:{sign:'Virgo',degree:182.2},
          Mars:{sign:'Cancer',degree:95.8}, Mercury:{sign:'Leo',degree:160.1},
          Jupiter:{sign:'Libra',degree:220.0}, Venus:{sign:'Virgo',degree:190.7},
          Saturn:{sign:'Gemini',degree:85.2}, Rahu:{sign:'Aquarius',degree:305.4},
          Ketu:{sign:'Leo',degree:125.4}
        };
      };

      const eph = calc(new Date(dt), lat, lon);
      drawWheel(document.getElementById('wheel'), eph); // from chart-ui.js
      document.getElementById('debug').textContent = JSON.stringify(eph, null, 2);
    } catch (e) { showErr(e); }
  });
</script>
