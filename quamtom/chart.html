<script src="./ephemeris-data.js"></script>
<script src="./kp-astro.js"></script>
<script src="./chart-engine.js"></script>
<script src="./chart-ui.js"></script>
<script>
const KP = {
  name: localStorage.getItem('kp_name')||'',
  dt:   localStorage.getItem('kp_dt')  || new Date().toISOString().slice(0,16),
  lat:  parseFloat(localStorage.getItem('kp_lat')||6.9271),
  lon:  parseFloat(localStorage.getItem('kp_lon')||79.8612),
};
window.addEventListener('load', ()=>{
  const eph = computeMockEphemeris(KP.dt, KP.lat, KP.lon);
  drawWheel(document.getElementById('wheel'), eph);
  document.getElementById('out').textContent = JSON.stringify({KP,eph}, null, 2);
});
// “Next → Sub-Lord”
function goNext(){ location.href='./sublord.html'; }
</script>
