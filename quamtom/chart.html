<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KP Chart</title>
  <style>
    body{background:#0f172a;color:#e0f2fe;font-family:system-ui,Segoe UI,Arial;margin:0;padding:16px;text-align:center}
    #wheel{display:block;margin:12px auto;background:#0b1220;border-radius:50%;border:1px solid #1e293b}
    #err{color:#fca5a5;margin-top:8px}
  </style>
</head>
<body>
  <a href="./index.html">← Back to Start</a>
  <h2 style="margin:6px 0 12px">KP Chart Wheel</h2>

  <canvas id="wheel" width="600" height="600"></canvas>
  <div id="err"></div>

  <!-- ✅ ALL scripts in /quamtom/ -->
  <script src="./ephemeris-data.js"></script>
  <script src="./chart-ui.js"></script>
  <script src="./chart-engine.js"></script> <!-- now exports renderWheelEngine (no clash) -->
  <script>
    const showErr = m => (document.getElementById('err').textContent = '⚠ ' + m);

    window.addEventListener('load', () => {
      const dt  = localStorage.getItem('kp_dt')  || new Date().toISOString().slice(0,16);
      const lat = +(localStorage.getItem('kp_lat')|| 6.9271);
      const lon = +(localStorage.getItem('kp_lon')|| 79.8612);

      const eph = (window.computeEphemeris || window.computeMockEphemeris)?.(dt, lat, lon);
      if (!eph) { showErr('Ephemeris not available'); return; }

      const canvas = document.getElementById('wheel');

      // Prefer chart-ui's drawWheel; fallback to chart-engine's renderWheelEngine
      if (typeof window.drawWheel === 'function') {
        window.drawWheel(canvas, eph);
      } else if (typeof window.renderWheelEngine === 'function') {
        window.renderWheelEngine(canvas, eph);
      } else {
        showErr('No wheel renderer found. Check chart-ui.js / chart-engine.js');
      }
    });
  </script>
</body>
</html>
