<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KP – Start</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root{--bg:#0f172a;--txt:#e0f2fe;--muted:#93c5fd;--card:#0b1220;--line:#1e293b}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial}
    a{color:#7dd3fc;text-decoration:none}
    .wrap{max-width:1100px;margin:18px auto;padding:12px}
    .topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
    .home{background:#0b1220;border:1px solid var(--line);padding:6px 10px;border-radius:8px}
    #google_translate_element{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:4px 8px}

    .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
    @media (max-width:900px){ .grid{grid-template-columns:1fr} }

    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    .card h2{margin:6px 0 12px}
    label{display:block;margin:10px 0 6px;color:var(--muted)}
    input,textarea,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#091426;color:#cdeafe;font-size:15px}
    textarea{min-height:92px;resize:vertical}
    button{cursor:pointer}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .pill{display:inline-block;border:1px solid var(--line);background:#091426;border-radius:999px;padding:6px 10px;margin-top:8px}
    .ok{border-color:#22c55e}

    /* Full-size map */
    .mapcard{padding:0}
    #mapWrap{
      position:relative; height:80vh; border:1px solid var(--line);
      border-radius:12px; overflow:hidden;
    }
    @media (max-width:900px){ #mapWrap{ height:100vh } }
    #map{ position:absolute; inset:0 }
    #mapLabel{
      position:absolute; top:10px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,.55); color:#e0f2fe; padding:6px 10px; border-radius:8px;
      font-weight:600; z-index:10; pointer-events:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="home" href="/">← Home</a>
      <div id="google_translate_element"></div>
    </div>

    <div class="grid">
      <!-- Left: Birth form + SAT helper -->
      <div class="card">
        <h2>KP – Start</h2>

        <form id="birthForm" novalidate>
          <label>Name</label>
          <input id="name" required placeholder="Your name"/>

          <label>Birth Date & Time</label>
          <input id="datetime" type="datetime-local" required/>

          <label>Lat, Lon (deg)</label>
          <input id="latlon" required placeholder="7.2862, 80.6316"/>

          <button style="margin-top:12px" type="submit">Start → Chart</button>
        </form>

        <div id="status" class="pill">Waiting…</div>

        <h3 style="margin:18px 0 8px;color:#93c5fd">SAT / Maps Helper</h3>
        <label>Enter place or paste coords</label>
        <textarea id="pasteBox"
          placeholder="e.g., Kandy, Sri Lanka — or 7.2862, 80.6316 — or a link with @lat,lon"></textarea>
        <div class="row">
          <button id="btnPaste" type="button">📋 Paste</button>
          <button id="btnExtract" type="button">🔍 Extract</button>
        </div>
        <div id="found" style="margin-top:8px;color:#93c5fd"></div>
      </div>

      <!-- Right: Full-size Map -->
      <div class="card mapcard">
        <div id="mapWrap">
          <div id="mapLabel">Pick on Map</div>
          <div id="map"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Google Translate -->
  <script>
    function googleTranslateElementInit(){
      new google.translate.TranslateElement({
        pageLanguage:'en', includedLanguages:'en,si,ta',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Prefill from localStorage
    window.addEventListener('load', ()=>{
      const dt  = localStorage.getItem('kp_dt');
      const nm  = localStorage.getItem('kp_name');
      const la  = localStorage.getItem('kp_lat');
      const lo  = localStorage.getItem('kp_lon');
      document.getElementById('datetime').value = (dt || new Date().toISOString()).slice(0,16);
      if(nm) document.getElementById('name').value = nm;
      if(la && lo) document.getElementById('latlon').value = `${la}, ${lo}`;
    });

    // Helpers
    const status = (msg, ok=false)=>{ const el=document.getElementById('status'); el.textContent=msg; el.className='pill'+(ok?' ok':''); };
    function parseCoords(t){
      if(!t) return null;
      let m=t.match(/(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)/);
      if(m) return {lat:+m[1], lon:+m[3]};
      m=t.match(/@(-?\d+(\.\d+)?),\s*(-?\d+(\.\d+)?)/);
      if(m) return {lat:+m[1], lon:+m[3]};
      return null;
    }
    async function geocodePlace(q){
      const url=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`;
      const res=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!res.ok) throw new Error('Search failed');
      const d=await res.json(); if(!d.length) return null;
      return {lat:+d[0].lat, lon:+d[0].lon, label:d[0].display_name};
    }

    // Map
    const map=L.map('map',{zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    let marker=L.marker([7.8731,80.7718],{draggable:true}).addTo(map);
    map.setView([7.8731,80.7718],7);
    function setMap(lat,lon,zoom){ marker.setLatLng([lat,lon]); map.setView([lat,lon],zoom||map.getZoom()); setTimeout(()=>map.invalidateSize(),50); }
    map.on('click',e=>{ const {lat,lng}=e.latlng; document.getElementById('latlon').value=`${lat.toFixed(6)}, ${lng.toFixed(6)}`; setMap(lat,lng); });
    marker.on('dragend',()=>{ const p=marker.getLatLng(); document.getElementById('latlon').value=`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`; });
    // center to existing
    (function(){ const c=parseCoords((document.getElementById('latlon').value||'').trim()); if(c) setMap(c.lat,c.lon,12); else setTimeout(()=>map.invalidateSize(),50); })();

    // Paste / Extract
    document.getElementById('btnPaste').addEventListener('click',async()=>{ try{ const t=await navigator.clipboard.readText(); document.getElementById('pasteBox').value=t||''; }catch{} });
    document.getElementById('btnExtract').addEventListener('click',async()=>{
      const t=document.getElementById('pasteBox').value.trim(); const out=document.getElementById('found');
      const c=parseCoords(t);
      if(c){ document.getElementById('latlon').value=`${c.lat}, ${c.lon}`; setMap(c.lat,c.lon,13); out.textContent=`Detected → ${c.lat.toFixed(6)}, ${c.lon.toFixed(6)} (filled)`; return; }
      if(!t){ out.textContent='Enter a place (e.g., Kandy, Sri Lanka).'; return; }
      out.textContent='Searching…';
      try{ const g=await geocodePlace(t); if(!g){ out.textContent='No results.'; return; }
        document.getElementById('latlon').value=`${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}`; setMap(g.lat,g.lon,13);
        out.textContent=`Found: ${g.label} → ${g.lat.toFixed(6)}, ${g.lon.toFixed(6)} (filled)`;
      }catch{ out.textContent='Search failed.'; }
    });

    // Submit → chart.html
    document.getElementById('birthForm').addEventListener('submit',e=>{
      e.preventDefault();
      const name=(document.getElementById('name').value||'').trim();
      const dt=document.getElementById('datetime').value;
      const cc=parseCoords(document.getElementById('latlon').value||'');
      if(!name||!dt||!cc){ status('Fill all fields (Name, Date/Time, Lat,Lon).'); return; }
      const {lat,lon}=cc;
      if(lat<-90||lat>90){ status('Latitude must be -90..90'); return; }
      if(lon<-180||lon>180){ status('Longitude must be -180..180'); return; }
      localStorage.setItem('kp_name',name);
      localStorage.setItem('kp_dt',dt);
      localStorage.setItem('kp_lat',lat);
      localStorage.setItem('kp_lon',lon);
      status('Saved. Opening chart…',true);
      location.href='./chart.html';
    });
  </script>
</body>
</html>
