<script>
  // --- helpers ---
  const $ = sel => document.querySelector(sel);
  const latlonEl = $('#latlon');

  function parseCoords(text){
    if(!text) return null;
    const t = text.trim();
    // 1) 7.2862, 80.6316
    let m = t.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
    if(m) return {lat:+m[1], lon:+m[2]};
    // 2) ...@7.2862,80.6316...
    m = t.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);
    if(m) return {lat:+m[1], lon:+m[2]};
    return null;
  }

  function setField(lat, lon, save=false){
    latlonEl.value = `${(+lat).toFixed(6)}, ${(+lon).toFixed(6)}`;
    if(save){
      localStorage.setItem('kp_lat', +lat);
      localStorage.setItem('kp_lon', +lon);
      status('Coords updated', true);
    }
  }

  // Leaflet setup (same as පෙර)
  const map = L.map('map',{zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  let marker = L.marker([7.8731,80.7718],{draggable:true}).addTo(map);
  map.setView([7.8731,80.7718],7);

  function setMapAndMarker(lat, lon, zoom){
    marker.setLatLng([lat,lon]);
    map.setView([lat,lon], zoom ?? map.getZoom());
  }

  // ---- two-way sync ----
  // 1) Field -> Map (type/paste/autofill)
  let typingTimer=null;
  latlonEl.addEventListener('input', ()=>{
    clearTimeout(typingTimer);
    typingTimer = setTimeout(()=>{
      const c = parseCoords(latlonEl.value);
      if(c){ setMapAndMarker(c.lat, c.lon); status('Map centered', true); }
    }, 180);
  });
  latlonEl.addEventListener('change', ()=>{ // for mobile autofill
    const c = parseCoords(latlonEl.value);
    if(c){ setMapAndMarker(c.lat,c.lon); status('Map centered', true); }
  });

  // 2) Map click -> Field (+save)
  map.on('click', e=>{
    setField(e.latlng.lat, e.latlng.lng, true);
  });

  // 3) Marker drag -> Field (+save)
  marker.on('dragend', ()=>{
    const p = marker.getLatLng();
    setField(p.lat, p.lng, true);
  });

  // Paste/Extract buttons (unchanged, but now call setField + setMap)
  $('#btnExtract')?.addEventListener('click', ()=>{
    const t = $('#pasteBox').value.trim();
    const c = parseCoords(t);
    if(!c){ $('#found').textContent = 'Could not detect coordinates.'; return; }
    $('#found').textContent = `Detected → ${c.lat.toFixed(6)}, ${c.lon.toFixed(6)} (filled)`;
    setField(c.lat, c.lon, true);
    setMapAndMarker(c.lat, c.lon, 13);
  });

  // Initial sync if field already has value
  (function initSync(){
    const c = parseCoords(latlonEl.value||'');
    if(c){ setMapAndMarker(c.lat,c.lon,12); }
  })();

  // Submit -> chart (unchanged)
  document.getElementById('birthForm').addEventListener('submit', e=>{
    e.preventDefault();
    const name = ($('#name').value||'').trim();
    const dt   = $('#datetime').value;
    const c    = parseCoords(latlonEl.value||'');
    if(!name||!dt||!c){ status('Fill all fields (Name, Date/Time, Lat,Lon).'); return; }
    if(c.lat<-90||c.lat>90){ status('Latitude must be between -90 and 90.'); return; }
    if(c.lon<-180||c.lon>180){ status('Longitude must be between -180 and 180.'); return; }
    localStorage.setItem('kp_name',name);
    localStorage.setItem('kp_dt',dt);
    localStorage.setItem('kp_lat',c.lat);
    localStorage.setItem('kp_lon',c.lon);
    status('Saved. Opening chart…', true);
    location.href='./kp-chart.html';
  });

  // Status helper
  function status(msg, ok=false){
    const el = document.getElementById('status');
    if(!el) return;
    el.textContent = msg;
    el.className = 'pill' + (ok?' ok':'');
  }
</script>
