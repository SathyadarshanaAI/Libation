<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sathyadarshana KP Astrology</title>

  <!-- Axios for NASA API calls -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { text-align: center; }
    #wheel { display: block; margin: auto; }
  </style>
</head>
<body>
  <h1>KP Astrology Chart</h1>
  <canvas id="wheel" width="500" height="500"></canvas>
  <div id="dashaTable"></div>

  <!-- Chart + Dasha scripts -->
  <script src="ephemeris-data.js"></script>
  <script src="kp-astro.js"></script>
  <script src="chart-engine.js"></script>
  <script src="dasha.js"></script>
  <script src="chart-ui.js"></script>

  <script>
    window.addEventListener('load', async () => {
      const name = localStorage.getItem('kp_name') || '';
      const dt   = localStorage.getItem('kp_dt') || new Date().toISOString().slice(0,16);
      const lat  = parseFloat(localStorage.getItem('kp_lat')) || 0;
      const lon  = parseFloat(localStorage.getItem('kp_lon')) || 0;

      let nasaData = {};
      try {
        const res = await axios.get(`/.netlify/functions/nasaKP?lat=${lat}&lon=${lon}&dt=${dt}`);
        nasaData = res.data || {};
      } catch (e) {
        nasaData = { error: "NASA data not available" };
      }

      drawKPChart(nasaData);

      if (nasaData.planets) {
        const birthYear = new Date(dt).getFullYear();
        initDashaFromPlanets(nasaData.planets, birthYear);
      }
    });
  </script>
</body>
</html>
