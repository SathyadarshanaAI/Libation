<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vimshottari Dasha Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 1em;
      text-align: center;
      background: #1e293b;
    }
    main {
      padding: 1em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2em;
      background: rgba(30, 41, 59, 0.9);
    }
    th, td {
      border: 1px solid #334155;
      padding: 0.5em;
      text-align: center;
    }
    th {
      background: #1e293b;
    }
    input, button {
      padding: 0.5em;
      margin: 0.3em;
    }
    .mono {
      font-family: monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>🪐 Vimshottari Dasha Calculator</h1>
  </header>
  <main>
    <div>
      <label>Moon Longitude (°):</label>
      <input type="number" id="moonDeg" step="0.01" placeholder="e.g. 123.45" />
      <label>Birth Date & Time:</label>
      <input type="datetime-local" id="birthDateTime" />
      <button onclick="calculateDasha()">Calculate</button>
    </div>

    <h2>Maha Dasha</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Lord</th>
          <th>Start</th>
          <th>End</th>
          <th>Years</th>
        </tr>
      </thead>
      <tbody id="dashaBody"></tbody>
    </table>

    <h2>Bhukti (Sub-Dasha)</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Lord</th>
          <th>Start</th>
          <th>End</th>
          <th>Years</th>
        </tr>
      </thead>
      <tbody id="bhuktiBody"></tbody>
    </table>
  </main>

  <!-- Load Dasha Logic -->
  <script src="./dasha.js"></script>
  <script>
    function calculateDasha() {
      const moonDeg = parseFloat(document.getElementById('moonDeg').value);
      const birthISO = document.getElementById('birthDateTime').value;

      if (isNaN(moonDeg) || !birthISO) {
        alert("Please enter Moon degree and birth date/time.");
        return;
      }

      const mahaList = computeVimshottariDasha(moonDeg, birthISO);
      renderDashaTable('dashaBody', mahaList);
      attachBhuktiOnClick('dashaBody', 'bhuktiBody', mahaList);
    }
  </script>
</body>
</html>
