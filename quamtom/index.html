<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KP Astrology Input</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e0f2fe;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #7dd3fc;
    }
    form {
      max-width: 500px;
      margin: auto;
      background: rgba(30,41,59,0.94);
      padding: 20px;
      border-radius: 10px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: none;
      border-radius: 5px;
    }
    #map {
      height: 300px;
      margin-top: 15px;
      border-radius: 10px;
    }
    button {
      background: #0284c7;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      margin-top: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <h1>Enter Birth Details</h1>
  <form id="birthForm">
    <label>Name:
      <input type="text" id="name" required />
    </label>
    <label>Date of Birth:
      <input type="date" id="dob" required />
    </label>
    <label>Time of Birth:
      <input type="time" id="tob" required />
    </label>
    <label>Place of Birth:
      <input type="text" id="place" placeholder="Search or pick from map" required />
    </label>
    <div id="map"></div>
    <label>Latitude:
      <input type="text" id="lat" readonly />
    </label>
    <label>Longitude:
      <input type="text" id="lon" readonly />
    </label>
    <button type="submit">Generate Chart</button>
  </form>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Initialize map
    const map = L.map('map').setView([7.8731, 80.7718], 7); // Sri Lanka center
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker;
    function updateLatLng(lat, lng) {
      document.getElementById('lat').value = lat.toFixed(6);
      document.getElementById('lon').value = lng.toFixed(6);
    }

    map.on('click', function(e) {
      if (marker) {
        map.removeLayer(marker);
      }
      marker = L.marker(e.latlng).addTo(map);
      updateLatLng(e.latlng.lat, e.latlng.lng);
    });

    document.getElementById('birthForm').addEventListener('submit', function(e) {
      e.preventDefault();
      localStorage.setItem('kp_name', document.getElementById('name').value);
      localStorage.setItem('kp_dob', document.getElementById('dob').value);
      localStorage.setItem('kp_tob', document.getElementById('tob').value);
      localStorage.setItem('kp_place', document.getElementById('place').value);
      localStorage.setItem('kp_lat', document.getElementById('lat').value);
      localStorage.setItem('kp_lon', document.getElementById('lon').value);
      window.location.href = './kp-chart.html';
    });
  </script>
</body>
</html>
