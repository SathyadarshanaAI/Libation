<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KP – Chart</title>
  <style>
    body{margin:0;background:#0f172a;color:#e0f2fe;font-family:system-ui,Segoe UI,Arial}
    .wrap{max-width:960px;margin:24px auto;padding:16px}
    .card{background:#0b1220;border:1px solid #1e293b;border-radius:12px;padding:16px}
    .row{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
    .pill{background:#091426;border:1px solid #1e293b;border-radius:999px;padding:8px 12px}
    canvas{width:100%;height:520px;display:block;background:#071224;border:1px solid #1e293b;border-radius:12px}
    a{color:#7dd3fc;text-decoration:none}
    #err{color:#fca5a5;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="./">← Back</a></p>
    <div class="card">
      <h2 style="margin:6px 0 12px">KP – Live Chart</h2>
      <div class="row" id="summary"></div>
      <canvas id="wheel" width="900" height="520"></canvas>
      <div id="err"></div>
    </div>
  </div>

  <!-- ✅ use the real libs from /quamtom/ -->
  <script src="./ephemeris-data.js"></script>
  <script src="./chart-ui.js"></script>
  <script src="./chart-engine.js"></script> <!-- provides renderWheelEngine fallback -->

  <script>
    // Read saved inputs
    const name = localStorage.getItem('kp_name') || '';
    const dt   = localStorage.getItem('kp_dt')   || '';
    const lat  = localStorage.getItem('kp_lat');
    const lon  = localStorage.getItem('kp_lon');

    // Guard if someone loads this page directly
    if (!name || !dt || lat === null || lon === null) {7
      alert('Missing birth data. Please start again.');
      location.href = './';
    }

    // Show summary pills
    const s = document.getElementById('summary');
    const pill = (t) => {
      const b = document.createElement('span');
      b.className = 'pill';
      b.textContent = t;
      return b;
    };
    s.append(pill(`Name: ${name}`));
    s.append(pill(`Date/Time: ${dt}`));
    s.append(pill(`Lat: ${Number(lat).toFixed(4)}`));
    s.append(pill(`Lon: ${Number(lon).toFixed(4)}`));

    // Render the real wheel
    const cv  = document.getElementById('wheel');
    // match canvas to CSS size (simple, avoids blur)
    cv.width  = cv.clientWidth;
    cv.height = cv.clientHeight;

    const showErr = m => (document.getElementById('err').textContent = '⚠ ' + m);

    window.addEventListener('load', () => {
      try{
        const eph = (window.computeEphemeris || window.computeMockEphemeris)?.(dt, +lat, +lon);
        if (!eph) { showErr('Ephemeris not available'); return; }

        if (typeof window.drawWheel === 'function') {
          window.drawWheel(cv, eph);                                // primary
        } else if (typeof window.renderWheelEngine === 'function') {
          window.renderWheelEngine(cv, eph);                        // fallback if you kept engine
        } else {
          showErr('No wheel renderer found. Check chart-ui.js / chart-engine.js');
        }
      } catch(err){
        console.error(err);
        showErr(err.message || 'Unknown error while drawing chart');
      }
    });
  </script>
</body>
</html>
