<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KP – Live Chart</title>
  <style>
    :root{--bg:#0f172a;--card:#0b1220;--line:#1e293b;--txt:#e0f2fe;--muted:#93c5fd;--accent:#38bdf8}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial}
    a{color:#7dd3fc;text-decoration:none}
    .wrap{max-width:1100px;margin:24px auto;padding:16px}
    .grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
    .pill{background:#091426;border:1px solid var(--line);border-radius:999px;padding:7px 10px}
    #wheel{
      width:100%;aspect-ratio:1/1;max-width:680px;margin:0 auto;
      background:#071224;border:1px solid var(--line);border-radius:12px;display:block
    }
    #kpboxes{width:100%;height:320px;background:#071224;border:1px solid var(--line);border-radius:12px;display:block}
    h2{margin:6px 0 12px}
    h3{margin:12px 0;color:var(--muted);font-weight:600}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:8px;border-bottom:1px solid #0f2339;text-align:left}
    th{color:var(--muted)}
    .mono{font-variant-numeric:tabular-nums}
    #err{color:#fca5a5;margin-top:8px}
    @media (max-width:860px){ .grid{grid-template-columns:1fr} #kpboxes{height:280px} }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="./">← Back</a></p>

    <div class="card">
      <h2>KP – Live Chart</h2>
      <div class="row" id="summary"></div>

      <div class="grid">
        <!-- Left: Wheel -->
        <div>
          <canvas id="wheel"></canvas>
          <div id="err"></div>
        </div>

        <!-- Right: Table + KP 12-box -->
        <div>
          <h3>Calculated Positions</h3>
          <table id="calcTable">
            <thead>
              <tr><th>Planet</th><th>Sign</th><th>Deg (D°M′)</th><th class="mono">° (0–360)</th></tr>
            </thead>
            <tbody></tbody>
          </table>

          <div id="moonExtra" style="margin-top:10px;color:var(--muted)"></div>
          <div id="ascExtra"  style="margin-top:6px;color:var(--muted)"></div>

          <h3>KP 12-Box Chart</h3>
          <canvas id="kpboxes"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- your libs (same folder) -->
  <script src="./ephemeris-data.js"></script>
  <script src="./kp-astro.js"></script>
  <script src="./chart-ui.js"></script>
  <script src="./chart-engine.js"></script>

  <script>
    // ---------- helpers ----------
    const SIGNS=["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
    const ABBR ={Sun:"Su",Moon:"Mo",Mars:"Ma",Mercury:"Me",Jupiter:"Ju",Venus:"Ve",Saturn:"Sa",Rahu:"Ra",Ketu:"Ke"};
    const norm360=d=>((d%360)+360)%360;
    const toDMS=deg=>{const d=Math.floor(deg),m=Math.floor((deg-d)*60);return `${d}°${String(m).padStart(2,'0')}′`;};

    // Fallback Asc calc (if ephemeris doesn't add Asc)
    function computeAscendant(dt, lat, lon){
      const date = new Date(dt || Date.now());
      const JD = date.getTime()/86400000 + 2440587.5;
      const T  = (JD-2451545.0)/36525.0;
      const eps=(23.439291 - 0.0130042*T)*Math.PI/180;
      let GMST=280.46061837 + 360.98564736629*(JD-2451545) + 0.000387933*T*T - (T*T*T)/38710000;
      const LST = norm360(GMST + (+lon)) * Math.PI/180;
      const phi = (+lat) * Math.PI/180;
      const num = -Math.cos(LST);
      const den =  Math.sin(LST)*Math.cos(eps) + Math.tan(phi)*Math.sin(eps);
      return norm360(Math.atan2(num,den)*180/Math.PI);
    }

    const name=localStorage.getItem('kp_name')||'';
    const dt  =localStorage.getItem('kp_dt')  ||'';
    const lat =localStorage.getItem('kp_lat');
    const lon =localStorage.getItem('kp_lon');
    if(!name||!dt||lat===null||lon===null){ alert('Missing birth data. Please start again.'); location.href='./'; }

    // summary pills
    const s=document.getElementById('summary');
    const pill=t=>{const b=document.createElement('span'); b.className='pill'; b.textContent=t; return b;};
    s.append(pill(`Name: ${name}`));
    s.append(pill(`Date/Time: ${dt}`));
    s.append(pill(`Lat: ${Number(lat).toFixed(4)}`));
    s.append(pill(`Lon: ${Number(lon).toFixed(4)}`));

    const cv=document.getElementById('wheel');

    // fit canvas pixels to CSS size + DPR (crisp lines)
    function fitCanvas(canvas){
      const dpr=Math.max(1,window.devicePixelRatio||1);
      const cssW=canvas.clientWidth, cssH=canvas.clientHeight;
      const w=Math.floor(cssW*dpr), h=Math.floor(cssH*dpr);
      if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
      canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    }

    // ---- KP 12-box South-Indian chart ----
    function drawKPBoxes(canvas, planets, ascDeg=null){
      canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight;
      const ctx=canvas.getContext('2d');
      const W=canvas.width,H=canvas.height, pad=10, cols=4, rows=3;
      const gw=W-pad*2, gh=H-pad*2, cw=gw/cols, rh=gh/rows;

      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#071224'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#1e293b'; ctx.lineWidth=1;

      for(let c=0;c<=cols;c++){const x=pad+c*cw; ctx.beginPath(); ctx.moveTo(x,pad); ctx.lineTo(x,pad+gh); ctx.stroke();}
      for(let r=0;r<=rows;r++){const y=pad+r*rh; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(pad+gw,y); ctx.stroke();}

      // corner diagonals
      const diag=(c,r,dir)=>{const x=pad+c*cw,y=pad+r*rh; ctx.beginPath();
        if(dir==='\\'){ctx.moveTo(x,y);ctx.lineTo(x+cw,y+rh);} else {ctx.moveTo(x+cw,y);ctx.lineTo(x,y+rh);} ctx.stroke();
      };
      diag(0,0,'\\'); diag(3,0,'/'); diag(0,2,'/'); diag(3,2,'\\');

      const ascSign=(ascDeg!=null&&!isNaN(ascDeg))?Math.floor(norm360(ascDeg)/30):0;

      const bySign=Array.from({length:12},()=>[]);
      (planets||[]).forEach(p=>{
        const s=Math.floor(norm360(p.degree)/30);
        bySign[s].push(ABBR[p.name]||p.name.slice(0,2));
      });

      ctx.font='13px system-ui,Segoe UI,Arial';
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          const idx=r*4+c, x0=pad+c*cw, y0=pad+r*rh;
          const house=((idx-ascSign+12)%12)+1;

          if(house===1){
            ctx.strokeStyle='#38bdf8'; ctx.lineWidth=2;
            ctx.strokeRect(x0+2,y0+2,cw-4,rh-4);
            ctx.strokeStyle='#1e293b'; ctx.lineWidth=1;
          }

          ctx.fillStyle='#93c5fd';
          ctx.fillText(SIGNS[idx].slice(0,3), x0+6, y0+14); // sign tag
          ctx.textAlign='right'; ctx.fillText(String(house), x0+cw-6, y0+16); ctx.textAlign='left';

          ctx.fillStyle='#e5e7eb';
          bySign[idx].forEach((t,i)=>ctx.fillText(t, x0+6, y0+34+i*16));
        }
      }
    }

    function redrawAll(){
      if(!window.eph) return;
      fitCanvas(cv);
      if(typeof window.drawWheel==='function') window.drawWheel(cv, eph);
      else if(typeof window.renderWheelEngine==='function') window.renderWheelEngine(cv, eph);

      const asc = (eph.positions && typeof eph.positions.Asc==='number') ? eph.positions.Asc : null;
      drawKPBoxes(document.getElementById('kpboxes'), eph.planets, asc);
    }

    window.addEventListener('load', ()=>{
      try{
        // ephemeris
        window.eph=(window.computeEphemeris||window.computeMockEphemeris)?.(dt,+lat,+lon);
        if(!eph) throw new Error('Ephemeris not available');

        // positions table
        const tb=document.querySelector('#calcTable tbody'); tb.innerHTML='';
        (eph.planets||[]).forEach(p=>{
          const abs=norm360(p.degree), sIx=Math.floor(abs/30), ins=abs-sIx*30;
          const tr=document.createElement('tr');
          tr.innerHTML=`<td>${p.name}</td><td>${SIGNS[sIx]}</td>
                        <td class="mono">${toDMS(ins)}</td><td class="mono">${abs.toFixed(2)}</td>`;
          tb.appendChild(tr);
        });

        // Moon Sub-Lord (if available)
        const moon=(eph.planets||[]).find(x=>x.name==='Moon');
        if(moon){
          let sl = (typeof window.calculateSubLord==='function')
            ? window.calculateSubLord(norm360(moon.degree))
            : 'Mock-SL';
          document.getElementById('moonExtra').innerHTML =
            `🌙 Moon Sub-Lord: <b style="color:var(--accent)">${sl}</b>`;
        }

        // Lagna (Asc) — from ephemeris or fallback calc
        let ascDeg = (eph.positions && typeof eph.positions.Asc === 'number')
          ? eph.positions.Asc
          : computeAscendant(dt, +lat, +lon);

        eph.positions = eph.positions || {}; eph.positions.Asc = ascDeg;
        const absAsc = norm360(ascDeg);
        const sIxAsc = Math.floor(absAsc/30);
        const inSign = absAsc - sIxAsc*30;
        document.getElementById('ascExtra').innerHTML =
          `⬆️ Lagna (Asc): <b style="color:var(--accent)">${SIGNS[sIxAsc]}</b> ${toDMS(inSign)} (${absAsc.toFixed(2)}°)`;

        // first draw + responsive
        redrawAll();
        new ResizeObserver(redrawAll).observe(cv);
        addEventListener('resize', redrawAll);
      }catch(err){
        console.error(err); document.getElementById('err').textContent='⚠ '+(err.message||err);
      }
    });
  </script>
</body>
</html>
