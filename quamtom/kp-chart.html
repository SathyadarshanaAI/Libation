<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Chart</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a href="./index.html" class="home-btn">🏠 Home</a>
  <h1>KP Astrology Chart</h1>

  <div id="google_translate_element"></div>
  <canvas id="wheel" width="600" height="600"></canvas>

  <!-- Load libraries -->
  <script src="./ephemeris-data.js" defer></script>
  <script src="./kp-astro.js" defer></script>
  <script src="./chart-ui.js" defer></script>
  <script src="./chart-engine.js" defer></script>
  <script src="./dasha.js" defer></script>

  <!-- Google Translate -->
  <script>
    function googleTranslateElementInit(){
      new google.translate.TranslateElement({
        pageLanguage:'en',
        includedLanguages:'en,si,ta',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>

  <!-- Page logic -->
  <script defer>
    window.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('kp_name') || '';
      const dt = localStorage.getItem('kp_dt') || '';
      const lat = parseFloat(localStorage.getItem('kp_lat'));
      const lon = parseFloat(localStorage.getItem('kp_lon'));

      if (!name || !dt || isNaN(lat) || isNaN(lon)) {
        alert('Missing birth data. Please go back and fill the form.');
        location.href = './index.html';
        return;
      }

      if (typeof drawWheel === 'function') {
        drawWheel(lat, lon, new Date(dt));
      } else {
        console.error('Chart rendering function missing.');
      }
    });
  </script>
</body>
</html>
