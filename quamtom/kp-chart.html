<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KP – Chart</title>
  <style>
    :root{--bg:#0f172a;--card:#0b1220;--line:#1e293b;--txt:#e0f2fe}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial}
    a{color:#7dd3fc;text-decoration:none}
    .wrap{max-width:960px;margin:24px auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    #wheel{width:100%;max-width:700px;aspect-ratio:1/1;display:block;margin:8px auto;background:#071224;border:1px solid var(--line);border-radius:12px}
    #err{color:#fca5a5;margin-top:8px;text-align:center;min-height:22px}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0;justify-content:center}
    .pill{background:#091426;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="./index.html">← Back</a></p>
    <div class="card">
      <h2 style="margin:6px 0 12px">KP – Live Chart</h2>
      <div class="row" id="summary"></div>
      <canvas id="wheel"></canvas>
      <div id="err"></div>
    </div>
  </div>

  <!-- External libs (must be in the SAME folder) -->
  <script src="./ephemeris-data.js"></script>
  <script src="./kp-astro.js"></script>
  <script src="./chart-engine.js"></script>
  <script src="./chart-ui.js"></script>

  <!-- Tiny fallback: if ephemeris-data.js failed -->
  <script>
    if (typeof window.computeEphemeris !== 'function') {
      console.warn('computeEphemeris missing — using inline mock fallback.');
      window.computeEphemeris = function(dt, lat, lon){
        const t = (new Date(dt||Date.now())).getTime()/1000;
        const norm=d=>((d%360)+360)%360;
        return {
          planets: [
            {name:'Sun',     degree:norm((t/86400)*0.985+120)},
            {name:'Moon',    degree:norm((t/3600)*13.176+ 60)},
            {name:'Mars',    degree:norm((t/86400)*0.524+330)},
            {name:'Venus',   degree:norm((t/86400)*1.620+ 75)},
            {name:'Mercury', degree:norm((t/86400)*4.090+180)},
            {name:'Jupiter', degree:norm((t/86400)*0.083+ 60)},
            {name:'Saturn',  degree:norm((t/86400)*0.033+310)},
            {name:'Rahu',    degree:45}, {name:'Ketu', degree:225}
          ]
        };
      };
    }
  </script>

  <script>
    const $=s=>document.querySelector(s);
    const showErr = m => ($('#err').textContent = m ? '⚠ ' + m : '');

    // guard
    const name = localStorage.getItem('kp_name')||'';
    const dt   = localStorage.getItem('kp_dt')  ||'';
    const lat  = localStorage.getItem('kp_lat');
    const lon  = localStorage.getItem('kp_lon');
    if(!name||!dt||lat===null||lon===null){
      alert('Missing birth data. Please start again.');
      location.href='./index.html';
    }

    // pills
    const pill=t=>{const b=document.createElement('span'); b.className='pill'; b.textContent=t; return b;};
    const s=$('#summary');
    s.append(pill(`Name: ${name}`));
    s.append(pill(`Date/Time: ${dt}`));
    s.append(pill(`Lat: ${(+lat).toFixed(6)}`));
    s.append(pill(`Lon: ${(+lon).toFixed(6)}`));

    function resizeCanvas(cv){
      const w=Math.min(cv.clientWidth||600,700);
      cv.width=w; cv.height=w;
    }

    function render(){
      const cv=$('#wheel');
      resizeCanvas(cv);

      if(typeof window.drawWheel!=='function'){
        showErr('drawWheel() missing — check ./chart-ui.js path/order.');
        return;
      }
      if(typeof window.computeEphemeris!=='function'){
        showErr('Ephemeris missing — check ./ephemeris-data.js.');
        return;
      }
      try{
        const eph=window.computeEphemeris(dt, +lat, +lon);
        window.drawWheel(cv, eph);
        showErr('');
      }catch(e){
        console.error(e);
        showErr(e.message||'Unknown error while drawing chart.');
      }
    }

    addEventListener('load', render);
    addEventListener('resize', render);
  </script>
</body>
</html>
