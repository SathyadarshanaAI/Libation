<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KP Astrology Chart</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(17, 24, 39, 0.9);
      --line: #334155;
      --text: #e2e8f0;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(2, 6, 23, 0.95);
      position: sticky;
      top: 0;
      z-index: 999;
    }
    .topbar a {
      color: #7dd3fc;
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1220;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
    }
    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    #wheel {
      width: 100%;
      max-width: 500px;
      margin: auto;
      display: block;
    }
    #dashaWrap {
      margin-top: 40px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <div class="topbar">
    <p style="margin:0">
      <a href="./">← Back</a>
      &nbsp;|&nbsp;
      <a href="#dashaWrap" title="Jump to Vimshottari Dasha">↯ Dasha</a>
    </p>
    <div id="google_translate_element"></div>
  </div>

  <!-- Chart Section -->
  <div class="grid">
    <div class="card">
      <h2>KP Chart</h2>
      <canvas id="wheel" width="500" height="500"></canvas>
    </div>
    <div class="card">
      <h2>Details</h2>
      <div id="chartDetails">Loading chart data…</div>
    </div>
  </div>

  <!-- Dasha Section -->
  <div id="dashaWrap" class="card" style="margin:16px">
    <h2>Vimshottari Dasha</h2>
    <div id="dashaTable">Loading Dasha periods…</div>
  </div>

  <script src="ephemeris-data.js"></script>
  <script src="kp-astro.js"></script>
  <script src="chart-engine.js"></script>
  <script src="chart-ui.js"></script>
  <script src="dasha.js"></script>
</body>
</html>
