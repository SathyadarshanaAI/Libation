<!-- quamtom/kp-chart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KP – Chart (Simple)</title>
  <style>
    :root{--bg:#0f172a;--card:#0b1220;--line:#1e293b;--txt:#e0f2fe;--muted:#93c5fd}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial}
    .wrap{max-width:960px;margin:24px auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    #wheel{width:100%;aspect-ratio:1/1;display:block;background:#071224;border:1px solid var(--line);border-radius:12px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:8px;border-bottom:1px solid #0f2339;text-align:left}
    th{color:var(--muted)}
    .mono{font-variant-numeric:tabular-nums}
    #err{color:#fca5a5;margin-top:8px}
    @media (max-width:860px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>KP – Simple Chart</h2>
      <div id="meta" style="margin:6px 0;color:#93c5fd"></div>

      <div class="grid">
        <div>
          <canvas id="wheel"></canvas>
          <div id="err"></div>
        </div>

        <div>
          <h3 style="margin:0 0 8px;color:#93c5fd">Positions</h3>
          <table id="calcTable">
            <thead><tr>
              <th>Body</th><th>Sign</th><th>Deg (D°M′)</th><th class="mono">° (0–360)</th>
            </tr></thead>
            <tbody></tbody>
          </table>

          <h3 style="margin:14px 0 8px;color:#93c5fd">Vimshottari Maha Dasha</h3>
          <table>
            <thead><tr>
              <th>#</th><th>Lord</th><th>Start</th><th>End</th><th class="mono">Years</th>
            </tr></thead>
            <tbody id="dashaBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Minimal libs (must exist in the same folder) -->
  <script src="./ephemeris-data.js"></script>
  <script src="./chart-ui.js"></script>
  <script src="./dasha.js"></script>

  <script>
    // --- tiny helpers ---
    const SIGNS = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
    const norm360 = d => ((d%360)+360)%360;
    const toDMS = deg => { const d=Math.floor(deg), m=Math.floor((deg-d)*60); return `${d}°${String(m).padStart(2,'0')}′`; };
    const showErr = m => { document.getElementById('err').textContent = m ? ('⚠ ' + m) : ''; };

    // state (fallbacks added)
    const name = localStorage.getItem('kp_name') || '';
    const dt   = localStorage.getItem('kp_dt') || new Date().toISOString().slice(0,16);
    const lat  = parseFloat(localStorage.getItem('kp_lat') ?? '0');
    const lon  = parseFloat(localStorage.getItem('kp_lon') ?? '0');

    document.getElementById('meta').textContent =
      `${name? name+' • ' : ''}${dt} • Lat ${isNaN(lat)?'?':lat.toFixed(4)} Lon ${isNaN(lon)?'?':lon.toFixed(4)}`;

    function fitCanvas(el){
      const max = Math.min(640, el.clientWidth || el.parentElement.clientWidth || 640);
      el.width = max; el.height = max;
    }

    function render(){
      try{
        const cv = document.getElementById('wheel');
        fitCanvas(cv);

        // use real ephemeris if available else mock (provided by ephemeris-data.js)
        const ephFn = (window.computeEphemeris || window.computeMockEphemeris);
        if (typeof ephFn !== 'function') { showErr('Ephemeris function missing'); return; }
        const eph = ephFn(dt, lat, lon);
        if (!eph || !Array.isArray(eph.planets)) { showErr('Ephemeris not available'); return; }

        // draw wheel (chart-ui.js exposes drawWheel)
        if (typeof window.drawWheel === 'function') {
          window.drawWheel(cv, eph);
        } else {
          showErr('Wheel renderer missing (chart-ui.js)'); return;
        }

        // fill table
        const tb = document.querySelector('#calcTable tbody'); tb.innerHTML='';
        (eph.planets||[]).forEach(p=>{
          const abs = norm360(p.degree), sIx = Math.floor(abs/30), inS = abs - sIx*30;
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${p.name}</td><td>${SIGNS[sIx]}</td><td class="mono">${toDMS(inS)}</td><td class="mono">${abs.toFixed(2)}</td>`;
          tb.appendChild(tr);
        });

        // dasha: moonDeg FIRST, then birthISO
        const moon = (eph.planets||[]).find(x=>x.name==='Moon');
        if (moon && typeof window.computeVimshottariDasha==='function' && typeof window.renderDashaTable==='function'){
          const rows = window.computeVimshottariDasha(norm360(moon.degree), dt, 120);
          window.renderDashaTable('dashaBody', rows.slice(0,18));
        }

        showErr('');
      }catch(err){
        console.error(err);
        showErr(err.message || 'Unknown error');
      }
    }

    window.addEventListener('load', render);
    window.addEventListener('resize', ()=>requestAnimationFrame(render));
  </script>
</body>
</html>
