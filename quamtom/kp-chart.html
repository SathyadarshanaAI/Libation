<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KP Chart & Vimshottari Dasha</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #000);
      color: #e0f2fe;
      text-align: center;
      min-height: 100vh;
    }
    a.home-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      background: #0f172a;
      color: #7dd3fc;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      z-index: 999;
    }
    #dashaWrap {
      visibility: hidden;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="home-btn">🏠 Home</a>
  <h1>KP Chart & Vimshottari Dasha</h1>

  <canvas id="wheel" width="600" height="600"></canvas>

  <!-- KP Houses + Planets Positions Table -->
  <div id="positions"></div>

  <!-- Vimshottari Dasha Table -->
  <div id="dashaWrap">
    <h2>Vimshottari Dasha</h2>
    <table border="1" cellpadding="5" style="margin:auto; border-collapse: collapse; color:#fff;">
      <thead>
        <tr>
          <th>#</th>
          <th>Lord</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Years</th>
        </tr>
      </thead>
      <tbody id="dashaBody"></tbody>
    </table>
  </div>

  <!-- Required JS files -->
  <script src="./ephemeris-data.js"></script>
  <script src="./kp-astro.js"></script>
  <script src="./chart-engine.js"></script>
  <script src="./chart-ui.js"></script>
  <script src="./dasha.js"></script>

  <script>
    window.addEventListener('load', () => {
      const name = localStorage.getItem('kp_name') || '';
      const dt   = localStorage.getItem('kp_dt') || new Date().toISOString().slice(0,16);
      const lat  = parseFloat(localStorage.getItem('kp_lat')) || 0;
      const lon  = parseFloat(localStorage.getItem('kp_lon')) || 0;

      // Draw Chart + KP Boxes
      const eph = computeEphemeris(dt, lat, lon);
      const ascDeg = computeAscendantStrict(dt, lat, lon);
      drawKPBoxes(eph, ascDeg);

      // Show positions
      renderPositionsTable('positions', eph);

      // Defer Vimshottari Dasha rendering so chart loads first
      requestAnimationFrame(() => {
        const moonBody = (eph.planets || []).find(p => p.name === 'Moon');
        if (moonBody && window.computeVimshottariDasha && window.renderDashaTable) {
          const md = window.computeVimshottariDasha(norm360(moonBody.degree), dt, 120);
          window.renderDashaTable('dashaBody', md.slice(0, 18));
        }
        document.getElementById('dashaWrap').style.visibility = 'visible';
      });
    });
  </script>
</body>
</html>
