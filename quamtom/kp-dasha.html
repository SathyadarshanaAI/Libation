<html>
<head>
  <meta charset="UTF-8">
  <title>KP Astrology Wheel</title>
  <style>
    body {
      text-align: center;
      background: #0f172a;
      color: #e0f2fe;
      font-family: Arial, sans-serif;
    }
    a.dasha-link {
      display: inline-block;
      margin-top: 15px;
      color: #7dd3fc;
      text-decoration: none;
      font-weight: bold;
    }
    a.dasha-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <canvas id="wheel" width="600" height="600"></canvas>

  <!-- Link to Dasha page -->
  <div>
    <a href="./kp-dasa.html" class="dasha-link">📅 View Vimshottari Dasha</a>
  </div>

  <!-- Required JS files in correct order -->
  <script src="./ephemeris-data.js"></script>
  <script src="./kp-astro.js"></script>
  <script src="./chart-engine.js"></script>
  <script src="./chart-ui.js"></script>

  <script>
    window.addEventListener('load', () => {
      const name = localStorage.getItem('kp_name') || '';
      const dt   = localStorage.getItem('kp_dt') || new Date().toISOString().slice(0,16);
      const lat  = parseFloat(localStorage.getItem('kp_lat') || '6.9271');
      const lon  = parseFloat(localStorage.getItem('kp_lon') || '79.8612');

      const eph = window.computeEphemeris(dt, lat, lon);
      window.drawWheel(document.getElementById('wheel'), eph);
    });
  </script>
</body>
</html>
