<html>
<head>
  <meta charset="utf-8">
  <title>Vimshottari Dasha</title>
  <style>
    body {
      background: #0f172a;
      color: #e0f2fe;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    a {
      color: #7dd3fc;
      text-decoration: none;
    }
    h1 {
      color: #93c5fd;
    }
    .muted {
      color: #94a3b8;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <p style="text-align:right;margin:0 0 10px">
    <a href="/kp-chart.html">🪐 Go to KP Wheel</a>
  </p>

  <h1>Vimshottari Dasha — Mahadasha (MD)</h1>
  <p class="muted">
    This page shows the Mahadasha timeline based on your birth data.<br>
    Wheel drawing is available separately on the KP Wheel page.
  </p>

  <div id="dasha"></div>

  <!-- Required JS -->
  <script src="./ephemeris-data.js"></script>
  <script src="./kp-astro.js"></script>
  <script src="./kp-subload.js"></script>

  <script>
    window.addEventListener('load', () => {
      const dt  = localStorage.getItem('kp_dt') || new Date().toISOString().slice(0,16);
      const lat = parseFloat(localStorage.getItem('kp_lat') || '6.9271');
      const lon = parseFloat(localStorage.getItem('kp_lon') || '79.8612');

      const eph = window.computeEphemeris(dt, lat, lon);
      const moonDeg = eph.positions.Moon;

      console.log("Ephemeris:", eph);
      console.log("Moon Degree:", moonDeg);

      if (typeof generateFullDasha === 'function') {
        const mdList = generateFullDasha(moonDeg, dt);
        console.log("MD List:", mdList);

        let html = `<table border="1" cellpadding="5" style="border-collapse:collapse;color:#e0f2fe">
          <tr><th>Mahadasha Lord</th><th>Start Date</th><th>End Date</th></tr>`;

        mdList.forEach(md => {
          html += `<tr>
            <td>${md.lord}</td>
            <td>${md.start}</td>
            <td>${md.end}</td>
          </tr>`;
        });

        html += `</table>`;
        document.getElementById('dasha').innerHTML = html;
      } else {
        document.getElementById('dasha').innerHTML = "<p>⚠ Dasha calculation not available.</p>";
      }
    });
  </script>
</body>
</html>
