<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KP – Start</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    :root{--bg:#0f172a;--card:#0b1220;--line:#1e293b;--txt:#e0f2fe;--muted:#93c5fd}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial}
    a{color:#7dd3fc;text-decoration:none}
    .wrap{max-width:980px;margin:24px auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    label{display:block;margin:10px 0 6px;color:var(--muted)}
    input,button{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#091426;color:#cdeafe}
    button{cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
    .chip{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#0b162a;color:#cdeafe;cursor:pointer}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
    #map{height:240px;border:1px solid var(--line);border-radius:12px}
    .results{background:#0b162a;border:1px solid var(--line);border-radius:8px;margin-top:8px;max-height:180px;overflow:auto}
    .results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #0f2339;background:transparent;padding:10px}
    .results button:last-child{border-bottom:0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 style="margin:0 0 10px">KP – Start</h2>

      <form id="birthForm" novalidate>
        <label>Name</label>
        <input id="name" required placeholder="Your name"/>

        <label>Birth Date & Time (local)</label>
        <input id="datetime" type="datetime-local" required/>

        <label>Quick Places (tap)</label>
        <div class="row" id="chips">
          <button type="button" class="chip" data-lat="6.9271" data-lon="79.8612">Colombo</button>
          <button type="button" class="chip" data-lat="7.2862" data-lon="80.6316">Kandy General Hospital</button>
          <button type="button" class="chip" data-lat="6.0535" data-lon="80.2210">Galle</button>
          <button type="button" class="chip" data-lat="9.6615" data-lon="80.0255">Jaffna</button>
          <button type="button" class="chip" data-lat="51.5074" data-lon="-0.1278">London</button>
        </div>

        <div class="grid">
          <div>
            <label>Search place</label>
            <div class="row" style="gap:8px">
              <input id="searchBox" placeholder="e.g., Kandy General Hospital"/>
              <button type="button" id="searchBtn" style="max-width:140px">Search</button>
            </div>
            <div id="searchResults" class="results" hidden></div>

            <label>Pick on map</label>
            <div id="map"></div>
          </div>

          <div>
            <label>Latitude, Longitude</label>
            <input id="latlon" placeholder="7.2862, 80.6316" readonly/>

            <button type="submit" style="margin-top:12px">Start → Chart</button>
            <p style="margin-top:10px"><a href="../astrology.html">← Back</a></p>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // Prefill
    (function(){
      const prev = localStorage.getItem('kp_dt');
      document.getElementById('datetime').value = (prev || new Date().toISOString()).slice(0,16);
      document.getElementById('name').value = localStorage.getItem('kp_name') || '';
    })();

    // Map
    const map = L.map('map',{zoomControl:true}).setView([7.8731,80.7718],7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    let marker = L.marker([7.8731,80.7718],{draggable:true}).addTo(map);

    function setLatLon(lat, lon, zoom=12){
      document.getElementById('latlon').value = `${(+lat).toFixed(6)}, ${(+lon).toFixed(6)}`;
      marker.setLatLng([+lat,+lon]); map.setView([+lat,+lon], zoom);
    }
    document.getElementById('chips').addEventListener('click', e=>{
      const b=e.target.closest('.chip'); if(!b) return;
      setLatLon(b.dataset.lat, b.dataset.lon, 14);
    });
    map.on('click', e=> setLatLon(e.latlng.lat, e.latlng.lng, map.getZoom()));
    marker.on('dragend', ()=>{
      const p = marker.getLatLng(); setLatLon(p.lat, p.lng, map.getZoom());
    });

    // Search (LK-first)
    async function doSearch(){
      const q = document.getElementById('searchBox').value.trim();
      const box = document.getElementById('searchResults');
      box.innerHTML=''; if(!q){ box.hidden=true; return; }
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&countrycodes=lk&accept-language=en`;
      try{
        const res = await fetch(url, {headers:{'Accept':'application/json'}});
        const data = await res.json();
        if(!data.length){ box.hidden=true; return; }
        data.forEach(item=>{
          const btn = document.createElement('button');
          btn.type='button'; btn.textContent=item.display_name;
          btn.addEventListener('click', ()=>{
            setLatLon(item.lat, item.lon, 15);
            box.hidden = true;
          });
          box.appendChild(btn);
        });
        box.hidden = false;
      }catch{ box.hidden=true; alert('Search failed. Try again.'); }
    }
    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('searchBox').addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); doSearch(); }
    });

    // Submit → save + go chart
    document.getElementById('birthForm').addEventListener('submit', e=>{
      e.preventDefault();
      const name=(document.getElementById('name').value||'').trim();
      const dt  =document.getElementById('datetime').value;
      const p = marker.getLatLng();
      if(!name || !dt){ alert('Please fill name and date/time.'); return; }
      localStorage.setItem('kp_name', name);
      localStorage.setItem('kp_dt', dt);
      localStorage.setItem('kp_lat', +p.lat);
      localStorage.setItem('kp_lon', +p.lng);
      location.href = './kp-chart.html';
    });

    // set initial to Kandy GH
    setLatLon(7.2862, 80.6316, 12);
  </script>
</body>
</html>
