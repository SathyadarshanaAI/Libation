    function getSubSubLord(degree) {
      const nakshatraSpans = [
        { name: "Ashwini", lord: "Ketu", start: 0, end: 13.333 },
        { name: "Bharani", lord: "Venus", start: 13.334, end: 26.666 },
        { name: "Krittika", lord: "Sun", start: 26.667, end: 30.000 }
      ];
      const subLordTable = [
        { lord: "Ketu", span: 7 }, { lord: "Venus", span: 20 },
        { lord: "Sun", span: 6 }, { lord: "Moon", span: 10 },
        { lord: "Mars", span: 7 }, { lord: "Rahu", span: 18 },
        { lord: "Jupiter", span: 16 }, { lord: "Saturn", span: 19 },
        { lord: "Mercury", span: 17 }
      ];
      const nak = nakshatraSpans.find(n => degree >= n.start && degree <= n.end);
      if (!nak) return { error: "Invalid degree." };
      const nakLen = nak.end - nak.start;
      const posInNak = degree - nak.start;
      const totalSecs = nakLen * 3600;
      const passedSecs = posInNak * 3600;
      let acc = 0, subLord = "", subLordDeg = 0;
      for (const s of subLordTable) {
        const part = (s.span / 120) * totalSecs;
        if (passedSecs <= acc + part) {
          subLord = s.lord;
          subLordDeg = part;
          break;
        }
        acc += part;
      }
      const posInSub = passedSecs - acc;
      acc = 0;
      let subSubLord = "";
      for (const s of subLordTable) {
        const part = (s.span / 120) * subLordDeg;
        if (posInSub <= acc + part) {
          subSubLord = s.lord;
          break;
        }
        acc += part;
      }
      return {
        nakshatra: nak.name,
        starLord: nak.lord,
        subLord,
        subSubLord
      };
