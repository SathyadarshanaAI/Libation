<form id="kpForm" onsubmit="saveKpData(event)">
  <input type="text" id="name" placeholder="Full Name" required />
  <input type="date" id="dob" required />
  <input type="time" id="tob" required />
  <input type="text" id="pob" placeholder="Place of Birth" required />
  <button type="submit">Generate KP Report</button>
</form>

<script>
  function saveKpData(e) {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const dob = document.getElementById("dob").value;
    const tob = document.getElementById("tob").value;
    const pob = document.getElementById("pob").value;

    const kpData = { name, dob, tob, pob };
    localStorage.setItem("kpData", JSON.stringify(kpData));

    // ✅ Redirect after saving
    window.location.href = "/quantom/kp-report.html";
  }
</script>
