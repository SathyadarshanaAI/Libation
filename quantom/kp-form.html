<form id="kpForm">
  <input type="text" id="name" placeholder="Full Name" required />
  <input type="date" id="dob" required />
  <input type="time" id="tob" required />
  <input type="text" id="pob" placeholder="Place of Birth" required />
  <button type="submit">Generate Chart</button>
</form>

<script>
  document.getElementById('kpForm').onsubmit = function(e) {
    e.preventDefault();
    const data = {
      name: document.getElementById('name').value,
      dob: document.getElementById('dob').value,
      tob: document.getElementById('tob').value,
      pob: document.getElementById('pob').value
    };
    localStorage.setItem('kpData', JSON.stringify(data));
    window.location.href = '/quantom/kp-report.html';
  }
</script>
