<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KP Birth Report</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #0f172a, #1e293b);
      font-family: 'Segoe UI', sans-serif;
      color: #e0f2fe;
    }

    .report-box {
      max-width: 600px;
      margin: 2rem auto;
      background: rgba(30, 41, 59, 0.95);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      color: #7dd3fc;
      margin-bottom: 1rem;
    }

    p {
      line-height: 1.7;
      margin: 0.5rem 0;
    }

    .download-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2563eb;
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 50px;
      box-shadow: 0 0 10px #2563ebaa;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .download-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="report-box">
    <h1>KP Astrology Birth Report</h1>
    <p><strong>Full Name:</strong> <span id="name">---</span></p>
    <p><strong>Date of Birth:</strong> <span id="dob">---</span></p>
    <p><strong>Time of Birth:</strong> <span id="tob">---</span></p>
    <p><strong>Place of Birth:</strong> <span id="pob">---</span></p>
    <p><strong>Ascendant (Lagna):</strong> <span id="ascendant">---</span></p>
    <p><strong>Sub-Lord:</strong> <span id="sublord">---</span></p>
    <p><strong>Ruling Planets:</strong> <span id="rulers">---</span></p>
    <p><strong>Traits:</strong> <span id="traits">---</span></p>
  </div>

  <button class="download-btn" onclick="downloadPDF()">Download PDF</button>

  <script src="kp-pdf.js"></script>
</body>
</html>
