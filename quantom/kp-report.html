<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🪐 KP Report - Preview</title>
  <style>
    body {
      background: #0f172a;
      color: #e0f2fe;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      line-height: 1.6;
    }
    .report-container {
      background: #1e293b;
      max-width: 800px;
      margin: auto;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px #38bdf8;
    }
    h1, h2 {
      color: #38bdf8;
      text-align: center;
    }
    .field {
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    /* 🖨️ Print styling */
    @media print {
      button {
        display: none !important;
      }
      body {
        background: white;
        color: black;
      }
      .report-container {
        box-shadow: none;
        background: white;
        color: black;
      }
    }
  </style>
</head>
<body>

<script>
  window.onload = () => {
    const downloadBtn = document.createElement('button');
    downloadBtn.textContent = '📄 Download as PDF';
    downloadBtn.style.cssText =
      'position:fixed;top:12px;right:12px;padding:8px 14px;border-radius:6px;background:#0ea5e9;color:black;font-weight:bold;cursor:pointer;border:none;z-index:1000;';
    document.body.appendChild(downloadBtn);

    downloadBtn.addEventListener('click', () => {
      window.print(); // PDF
    });

    const data = JSON.parse(localStorage.getItem('kpData'));

    if (!data) {
      document.body.innerHTML += `<h2 style="text-align:center;margin-top:30%;">⚠️ No birth data found. Please go back and enter details.</h2>`;
      return;
    }

    const container = document.createElement('div');
    container.className = 'report-container';

    container.innerHTML = `
      <h1>🪐 KP Astrology Report</h1>
      <div class="field"><strong>Name:</strong> ${data.name}</div>
      <div class="field"><strong>Date of Birth:</strong> ${data.dob}</div>
      <div class="field"><strong>Time of Birth:</strong> ${data.tob}</div>
      <div class="field"><strong>Place of Birth:</strong> ${data.pob}</div>
      <hr style="margin: 2rem 0; border-color: #38bdf8;" />
      <div class="field"><strong>🧠 Sub-Lord Prediction:</strong><br>Loading...</div>
    `;

    document.body.appendChild(container);
  };
</script>

</body>
</html>
