<script>
  function downloadPDF() {
    const data = JSON.parse(localStorage.getItem("kpData"));
    if (!data) {
      alert("No data available to generate the report.");
      return;
    }

    const content = `
      🔭 Sathyadarshana - KP Astrology Birth Report

      📌 Full Name: ${data.name}
      📅 Date of Birth: ${data.dob}
      ⏰ Time of Birth: ${data.tob}
      🌍 Place of Birth: ${data.pob}

      🧭 Ascendant (Lagna): Libra ♎
      🔸 Sub-Lord: Venus
      🌟 Ruling Planets: Venus, Mercury, Moon

      🧠 Traits:
      Balanced, artistic, emotionally sensitive, spiritually inclined.
    `;

    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "kp_report.txt";
    link.click();
  }
</script>
