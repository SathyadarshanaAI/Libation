<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔭 KP Birth Report | Sathyadarshana</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    body {
      background: #0f172a;
      color: #e0f2fe;
      font-family: 'Segoe UI', sans-serif;
      padding: 1.5rem;
      line-height: 1.6;
    }
    h1 {
      color: #7dd3fc;
      text-align: center;
    }
    .report-box {
      max-width: 700px;
      margin: auto;
      background: rgba(15,23,42,0.8);
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 0 15px #0284c7;
    }
    .field {
      margin: 0.5rem 0;
    }
    .label {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .value {
      font-weight: bold;
      color: #f1f5f9;
    }
    .download-btn {
      margin-top: 2rem;
      text-align: center;
    }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
    .note {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="report-box">
    <h1>🔭 KP Astrology Birth Report</h1>

    <div class="field"><span class="label">Full Name:</span> <span class="value" id="name"></span></div>
    <div class="field"><span class="label">Date of Birth:</span> <span class="value" id="dob"></span></div>
    <div class="field"><span class="label">Time of Birth:</span> <span class="value" id="tob"></span></div>
    <div class="field"><span class="label">Place of Birth:</span> <span class="value" id="pob"></span></div>

    <hr style="margin: 1rem 0; border-color: #334155;"/>

    <div class="field"><span class="label">Ascendant (Lagna):</span> <span class="value" id="ascendant"></span></div>
    <div class="field"><span class="label">Sub-Lord of Lagna:</span> <span class="value" id="sublord"></span></div>
    <div class="field"><span class="label">Ruling Planets:</span> <span class="value" id="rulers"></span></div>

    <div class="field"><span class="label">Basic Traits:</span>
      <div class="value" id="traits"></div>
    </div>

    <div class="download-btn">
      <button onclick="downloadPDF()">⬇ Download PDF</button>
    </div>

    <div class="note">
      This report is auto-generated from astrology inputs.<br/>
      NASA & KP Logic will be added dynamically.
    </div>
  </div>

  <script src="kp-pdf.js"></script>
  <script>
    // Dynamic fill (in future from queryString/localStorage/API)
    const data = {
      name: "Anuruddha Dilip",
      dob: "1990-01-01",
      tob: "06:15 AM",
      pob: "Anuradhapura, Sri Lanka",
      ascendant: "Libra ♎",
      sublord: "Venus",
      rulers: "Venus, Mercury, Moon",
      traits: "A balanced thinker, emotionally intuitive, highly analytical, and artistic in nature."
    };

    Object.entries(data).forEach(([key, val]) => {
      const el = document.getElementById(key);
      if (el) el.innerText = val;
    });
  </script>
</body>
</html>
