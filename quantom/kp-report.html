    document.write(`

        <h2>🔮 KP Birth Report</h2>
        <p><strong>👤 Name:</strong> ${data.name}</p>
        <p><strong>📅 Date of Birth:</strong> ${data.dob}</p>
        <p><strong>⏰ Time of Birth:</strong> ${data.tob}</p>
        <p><strong>📍 Place of Birth:</strong> ${data.pob}</p>
        <hr>
        <p><strong>🔭 Ascendant (Lagna):</strong> Libra ♎</p>
        <p><strong>🌞 Sub Lord:</strong> Venus</p>
        <p><strong>🔵 Ruling Planets:</strong> Venus, Mercury, Moon</p>
        <p><strong>❤️ Traits:</strong> Balanced, analytical, emotionally aware, artistic.</p>
      </div>
    `);

</script>
