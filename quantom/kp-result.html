<!-- Show KP Chart Summary -->
<div id="chart-container">
  <h2>🧑 Name: [Name]</h2>
  <p><strong>🌀 Gender:</strong> [Gender]</p>
  <p><strong>📅 Date of Birth:</strong> [DOB]</p>
  <p><strong>⏰ Time of Birth:</strong> [Time]</p>
  <p><strong>🌍 Birth Place:</strong> [Place]</p>
</div>

<script>
  window.onload = function () {
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || 'Not Provided';
    const gender = params.get('gender') || 'Not Specified';
    const dob = params.get('dob') || 'N/A';
    const time = params.get('time') || 'N/A';
    const place = params.get('place') || 'Unknown';

    const chartBox = document.getElementById('chart-container');
    chartBox.innerHTML = `
      <h2>🧑 Name: ${name}</h2>
      <p><strong>🌀 Gender:</strong> ${gender}</p>
      <p><strong>📅 Date of Birth:</strong> ${dob}</p>
      <p><strong>⏰ Time of Birth:</strong> ${time}</p>
      <p><strong>🌍 Birth Place:</strong> ${place}</p>
      <hr style="margin:1.5rem 0;" />
      <p>🪐 <em>Your KP chart will be generated soon using Sub-Lord logic and planetary positions.</em></p>
    `;
  }
</script>
