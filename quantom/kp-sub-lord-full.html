<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KP Sub-Sub Lord Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px #38bdf8;
      max-width: 450px;
      width: 100%;
    }

    h2 {
      color: #38bdf8;
      text-align: center;
    }

    label, input, button {
      display: block;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      background: #0ea5e9;
      color: #000;
      border: none;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .result {
      background: #0f172a;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-family: monospace;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>KP Sub-Sub Lord Calculator</h2>
    <label for="planetDegree">Planet Degree (0–30):</label>
    <input type="number" id="planetDegree" min="0" max="30" step="0.01" placeholder="Enter degree (e.g., 15.5)">

    <button onclick="calculate()">Get Sub & Sub-Sub Lord</button>

    <div class="result" id="output"></div>
  </div>

  <script>
    function getSubSubLord(degree) {
      const nakshatraSpans = [
        { name: "Ashwini", lord: "Ketu", start: 0, end: 13.333 },
        { name: "Bharani", lord: "Venus", start: 13.334, end: 26.666 },
        { name: "Krittika", lord: "Sun", start: 26.667, end: 30.000 }
      ];

      const subLordTable = [
        { lord: "Ketu", span: 7 },
        { lord: "Venus", span: 20 },
        { lord: "Sun", span: 6 },
        { lord: "Moon", span: 10 },
        { lord: "Mars", span: 7 },
        { lord: "Rahu", span: 18 },
        { lord: "Jupiter", span: 16 },
        { lord: "Saturn", span: 19 },
        { lord: "Mercury", span: 17 }
      ];

      const nak = nakshatraSpans.find(n => degree >= n.start && degree <= n.end);
      if (!nak) return { error: "Invalid degree. Must be within 0–30° of one Rashi." };

      const nakshatraLength = nak.end - nak.start;
      const posInNak = degree - nak.start;
      const totalSecs = nakshatraLength * 3600;
      const passedSecs = posInNak * 3600;

      let acc = 0, subLord = "", subLordDeg = 0;
      for (const s of subLordTable) {
        const part = (s.span / 120) * totalSecs;
        if (passedSecs <= acc + part) {
          subLord = s.lord;
          subLordDeg = part;
          break;
        }
        acc += part;
      }

      const posInSub = passedSecs - acc;
      acc = 0;
      let subSubLord = "";
      for (const s of subLordTable) {
        const part = (s.span / 120) * subLordDeg;
        if (posInSub <= acc + part) {
          subSubLord = s.lord;
          break;
        }
        acc += part;
      }

      return {
        nakshatra: nak.name,
        starLord: nak.lord,
        subLord: subLord,
        subSubLord: subSubLord
      };
    }

    function calculate() {
      const degree = parseFloat(document.getElementById("planetDegree").value);
      if (isNaN(degree)) {
        document.getElementById("output").innerText = "❗ Please enter a valid degree (0–30)";
        return;
      }

      const result = getSubSubLord(degree);
      if (result.error) {
        document.getElementById("output").innerText = `⚠️ ${result.error}`;
      } else {
        document.getElementById("output").innerText =
          `🌠 Nakshatra: ${result.nakshatra}\n⭐ Star Lord: ${result.starLord}\n🪐 Sub Lord: ${result.subLord}\n🌌 Sub-Sub Lord: ${result.subSubLord}`;
      }
    }
  </script>
</body>
</html>
