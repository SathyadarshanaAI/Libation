<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KP Sub Lord Calculator</title>
  <style>
    body {
      background: #0f172a;
      color: #e0f2fe;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      margin: auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }

    h2 {
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 1.1rem;
      user-select: none; /* 🔒 Prevent tooltip */
    }

    .label {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>KP Sub Lord & Sub-Sub Lord 🌌</h2>
    
    <label class="label">Enter Planetary Degree (0° to 360°):</label>
    <input type="number" id="degree" step="0.01" min="0" max="360" placeholder="e.g. 123.45" />

    <label class="label">Select Language:</label>
    <select id="language">
      <option value="en">English</option>
      <option value="si">සිංහල</option>
      <option value="ta">தமிழ்</option>
    </select>

    <button onclick="calculate()">Calculate</button>

    <div id="result" contenteditable="false"></div>
  </div>

  <script>
    const subLordData = [
      { name: "Sun", si: "සූරිය", ta: "சூரியன்" },
      { name: "Moon", si: "සඳ", ta: "சந்திரன்" },
      { name: "Mars", si: "කුජ", ta: "செவ்வாய்" },
      { name: "Mercury", si: "බුධ", ta: "புதன்" },
      { name: "Jupiter", si: "ගුරු", ta: "குரு" },
      { name: "Venus", si: "ශුක්‍ර", ta: "சுக்ரன்" },
      { name: "Saturn", si: "ශනි", ta: "சனி" },
      { name: "Rahu", si: "රාහු", ta: "ராகு" },
      { name: "Ketu", si: "කේතු", ta: "கேது" }
    ];

    function getNameByLanguage(name, lang) {
      const match = subLordData.find(p => p.name === name);
      if (!match) return name;
      return lang === 'si' ? match.si : lang === 'ta' ? match.ta : match.name;
    }

    function calculate() {
      const degree = parseFloat(document.getElementById("degree").value);
      const lang = document.getElementById("language").value;
      if (isNaN(degree) || degree < 0 || degree > 360) {
        document.getElementById("result").innerHTML = "Please enter a valid degree.";
        return;
      }

      const lords = ["Ketu", "Venus", "Sun", "Moon", "Mars", "Rahu", "Jupiter", "Saturn", "Mercury"];
      const subLord = lords[Math.floor(degree / 40)];
      const subSubLord = lords[Math.floor((degree % 40) / (40 / 9))];

      const subText = getNameByLanguage(subLord, lang);
      const subSubText = getNameByLanguage(subSubLord, lang);

      document.getElementById("result").innerHTML = `
        <strong>Sub Lord:</strong> ${subText}<br>
        <strong>Sub-Sub Lord:</strong> ${subSubText}
      `;
    }
  </script>
</body>
</html>
