<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <title>Users Registration Form</title>
  <script type="module">
    // Firebase Config එක මෙහි import කරන්න
    import { firebaseConfig } from './firebaseConfig.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase Initialize
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Form Submit Event
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Field values
        const name = document.getElementById('name').value;
        const nic = document.getElementById('nic').value;
        const dob = document.getElementById('dob').value;
        const birth_time = document.getElementById('birth_time').value;
        const birth_place = document.getElementById('birth_place').value;

        // Document ID auto-generate (or use nic if you want)
        const docRef = doc(db, "Users", nic);

        // Write to Firestore
        try {
          await setDoc(docRef, {
            name,
            nic,
            dob,
            birth_time,
            birth_place
          });
          alert("දත්ත සාර්ථකව ලබාදී ඇත!");
          document.getElementById('registerForm').reset();
        } catch (err) {
          alert("දත්ත ලබාදීමේ දෝෂයක්: " + err.message);
        }
      });
    });
  </script>
  <style>
    body { font-family: sans-serif; background: #f6f6f6; }
    form { background: #fff; padding: 24px; margin: 40px auto; width: 320px; border-radius: 8px; box-shadow: 0 2px 6px #ccc; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background: #2B7A78; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #20505a; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">පරිශීලක ලියාපදිංචි කිරීම</h2>
  <form id="registerForm">
    <label for="name">නම</label>
    <input type="text" id="name" name="name" required>

    <label for="nic">ජා.හැ.අංකය (NIC)</label>
    <input type="text" id="nic" name="nic" required>

    <label for="dob">උපන් දිනය</label>
    <input type="date" id="dob" name="dob" required>

    <label for="birth_time">උපන් වේලාව</label>
    <input type="time" id="birth_time" name="birth_time" required>

    <label for="birth_place">උපන් ස්ථානය</label>
    <input type="text" id="birth_place" name="birth_place" required>

    <button type="submit">ලියාපදිංචි කරන්න</button>
  </form>
</body>
</html>
