<body>
  <h1>Astrology Research Module</h1>
  <form id="astroForm">
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required>

    <label for="time"> <input type="text" id="place" name="place" placeholder="Enter city/town" required>

    <button type="submit">Analyze</button>
  </form>

  <div id="output" class="output-box"></div>

  <script>
    document.getElementById('astroForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const dob = document.getElementById('dob').value;
      const time = document.getElementById('time').value;
      const place = document.getElementById('place').value;

      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = `
        <h2 style="color:#7dd3fc;">Preliminary Research</h2>
        <p><strong>Date:</strong> ${dob}</p>
        <p><strong>Time:</strong> ${time}</p>
        <p><strong>Place:</strong> ${place}</p>
        <p style="margin-top:1em; color:#cbd5e1;">
          NASA Ephemeris and KP Sub-Lord logic will be connected here. <br>
          Final version will provide planetary positions, research insights & advanced charting.
        </p>
      `;
      outputDiv.style.display = "block";
      outputDiv.scrollIntoView({behavior:"smooth"});
    });
  </script>
