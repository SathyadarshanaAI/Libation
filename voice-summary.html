<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KP Voice Summary Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #e0f2fe;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px #38bdf8;
      max-width: 600px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #38bdf8;
    }

    textarea, select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background-color: #0ea5e9;
      color: #000;
      font-weight: bold;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    audio {
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🗣️ KP Voice Summary Generator</h2>
    <textarea id="textInput" placeholder="Enter astrology summary or result here..."></textarea>

    <label for="language">🌐 Choose Language:</label>
    <select id="language">
      <option value="en-US">English</option>
      <option value="si-LK">සිංහල (Sinhala)</option>
      <option value="ta-IN">தமிழ் (Tamil)</option>
    </select>

    <button onclick="generateVoice()">🔊 Play Voice Summary</button>
    <audio id="audioPlayer" controls hidden></audio>
  </div>

  <script>
    function generateVoice() {
      const text = document.getElementById("textInput").value;
      const lang = document.getElementById("language").value;
      const audio = document.getElementById("audioPlayer");

      if (!text.trim()) {
        alert("Please enter some summary text first.");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      speechSynthesis.speak(utterance);

      audio.hidden = true;
    }
  </script>
</body>
</html>
